    // ============ Data loading ============

    async function loadIssues({ silent } = {}) {
      // Silent loads (pull-to-refresh, background poll) don't flicker the list
      // through a loading state — they just swap in fresh data when it arrives.
      if (!silent) {
        state.loading = true;
        state.error = null;
        patchView();
      }
      // Warm people + account caches so we can show names/avatars
      ensurePeopleLoaded();
      // Re-render the list when accounts arrive so account names appear inline
      ensureAccountsLoaded().then(() => { if (state.view === 'list') patchView(); });
      try {
        // Pylon /issues requires a start_time/end_time window (RFC3339).
        // The window is user-controlled via the date-range filter (chip in the
        // filter bar opens a picker). Default is last 90 days; user can pick
        // any window. We paginate through with cursor to collect all issues
        // in that window — not just the first 100.
        const fromStr = state.filter.dateFrom || defaultDateWindow().dateFrom;
        const toStr   = state.filter.dateTo   || defaultDateWindow().dateTo;
        // dateFrom is inclusive start-of-day; dateTo is inclusive end-of-day
        // (add one day so 2026-06-01 covers all of June 1st).
        const start = new Date(fromStr + 'T00:00:00');
        const endIncl = new Date(toStr + 'T00:00:00');
        const end = new Date(endIncl.getTime() + 24 * 60 * 60 * 1000);
        const baseQuery = {
          start_time: start.toISOString(),
          end_time: end.toISOString(),
          limit: 100,
        };
        let all = [];
        let cursor = null;
        let pages = 0;
        const MAX_PAGES = 30; // hard cap so a misbehaving API can't loop forever
        do {
          const q = cursor ? Object.assign({}, baseQuery, { cursor }) : baseQuery;
          const resp = await Pylon.listIssues(q);
          const items = extractList(resp);
          all = all.concat(items);
          // Update progressive count so the "All N" chip reflects fetched-so-far
          state.allIssues = all;
          if (pages === 0) reapplyFilters(); // show first page immediately
          // Look for cursor in common shapes: pagination.cursor + has_next_page
          const pg = resp && (resp.pagination || resp.meta || resp);
          const hasNext = pg && (pg.has_next_page === true || (pg.next_cursor && pg.has_next_page !== false));
          cursor = hasNext ? (pg.cursor || pg.next_cursor || null) : null;
          pages += 1;
        } while (cursor && pages < MAX_PAGES);
        state.allIssues = all;
        reapplyFilters();
        return;
      } catch (e) {
        state.allIssues = [];
        state.issues = [];
        state.stateCounts = {};
        state.assigneeStats = [];
        state.error = friendlyError(e);
      } finally {
        state.loading = false;
        patchView();
      }
    }

    // Filter pipeline. `skip` is a Set of dimensions to bypass:
    //   'state', 'assignee', 'q'. Used so the status chips can compute "if I
    //   picked this state" counts while still respecting the assignee filter.
    function applyClientFilters(issues, skip = new Set()) {
      const meId = state.me && (state.me.id || state.me.user_id);
      return issues.filter(i => {
        if (!skip.has('state') && state.filter.state) {
          const s = (i.state || i.status || '').toLowerCase();
          if (s !== state.filter.state) return false;
        }
        if (!skip.has('assignee') && Array.isArray(state.filter.assignees) && state.filter.assignees.length) {
          const aId = i.assignee_id || (i.assignee && i.assignee.id) || '';
          // Multi-select: ticket passes if its assignee matches ANY selected filter.
          const matches = state.filter.assignees.some(filt => {
            if (filt === 'me') return meId && aId === meId;
            if (filt === 'unassigned') return !aId;
            return aId === filt;
          });
          if (!matches) return false;
        }
        if (!skip.has('account') && Array.isArray(state.filter.accounts) && state.filter.accounts.length) {
          const acctId = i.account_id || (i.account && i.account.id) || '';
          const matches = state.filter.accounts.some(filt => {
            if (filt === '__none__') return !acctId;
            return acctId === filt;
          });
          if (!matches) return false;
        }
        if (!skip.has('requester') && Array.isArray(state.filter.requesters) && state.filter.requesters.length) {
          const reqId = (i.requester && i.requester.id) || (i.contact && i.contact.id) || i.requester_id || '';
          const matches = state.filter.requesters.some(filt => reqId === filt);
          if (!matches) return false;
        }
        if (!skip.has('q') && state.filter.q) {
          const needle = state.filter.q.toLowerCase();
          const hay = [
            i.title, i.subject,
            i.requester && (i.requester.name || i.requester.email),
            i.account && i.account.name,
            assigneeNameOf(i),
            i.number, i.id,
          ].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(needle)) return false;
        }
        return true;
      });
    }

    function reapplyFilters() {
      // Final displayed list — every filter applied
      state.issues = applyClientFilters(state.allIssues);
      // State chip counts — apply every filter EXCEPT state
      state.stateCounts = countByState(applyClientFilters(state.allIssues, new Set(['state'])));
      // Each dimension's stats are computed by applying every OTHER filter, so
      // the counts a user sees in the popover reflect what they'd see if they
      // picked that option (without losing the rest of their filters).
      state.assigneeStats  = topAssignees(applyClientFilters(state.allIssues, new Set(['assignee'])));
      state.accountStats   = topAccounts(applyClientFilters(state.allIssues, new Set(['account'])));
      state.requesterStats = topRequesters(applyClientFilters(state.allIssues, new Set(['requester'])));
      patchView();
    }

    function countByState(issues) {
      const c = { _total: issues.length };
      for (const i of issues) {
        const s = (i.state || i.status || '').toLowerCase();
        if (!s) continue;
        c[s] = (c[s] || 0) + 1;
      }
      return c;
    }

    function assigneeNameOf(issue) {
      const aId = issue.assignee_id || (issue.assignee && issue.assignee.id);
      if (!aId) return '';
      if (issue.assignee && (issue.assignee.name || issue.assignee.email)) {
        return issue.assignee.name || issue.assignee.email;
      }
      const p = resolvePerson(aId, 'user');
      return p ? (p.name || p.email || '') : '';
    }

    function topAssignees(issues) {
      const map = new Map();
      for (const i of issues) {
        const aId = i.assignee_id || (i.assignee && i.assignee.id);
        if (!aId) continue;
        const cur = map.get(aId) || { id: aId, count: 0, name: '' };
        cur.count += 1;
        if (!cur.name) cur.name = assigneeNameOf(i);
        map.set(aId, cur);
      }
      // Resolve names again now that peopleCache may have arrived
      for (const v of map.values()) {
        if (!v.name) {
          const p = resolvePerson(v.id, 'user');
          if (p) v.name = p.name || p.email || '';
        }
      }
      return Array.from(map.values()).sort((a, b) => b.count - a.count).slice(0, 6);
    }

    // Build account stats from the current issue list. Empty account_id is
    // bucketed under a special '__none__' key so the user can filter to
    // "No account" tickets explicitly.
    function topAccounts(issues) {
      const map = new Map();
      for (const i of issues) {
        const acctId = i.account_id || (i.account && i.account.id) || '__none__';
        const cur = map.get(acctId) || { id: acctId, count: 0, name: '' };
        cur.count += 1;
        if (!cur.name) cur.name = resolveAccountName(i) || (acctId === '__none__' ? 'No account' : '');
        map.set(acctId, cur);
      }
      // Resolve names once more in case accountCache caught up.
      for (const v of map.values()) {
        if (!v.name && v.id && v.id !== '__none__') {
          const cached = accountCache.byId && accountCache.byId[v.id];
          if (cached) v.name = cached.name || cached.title || cached.display_name || '';
        }
      }
      return Array.from(map.values())
        .sort((a, b) => b.count - a.count);
    }

    // Build requester stats. Picks the first non-empty (name | email | id) as
    // the display label.
    function topRequesters(issues) {
      const map = new Map();
      for (const i of issues) {
        const r = i.requester || i.contact || {};
        const rId = r.id || i.requester_id;
        if (!rId) continue;
        const cur = map.get(rId) || { id: rId, count: 0, name: '', email: '' };
        cur.count += 1;
        if (!cur.name) cur.name = r.name || '';
        if (!cur.email) cur.email = r.email || '';
        map.set(rId, cur);
      }
      // Try to fill missing names from peopleCache (contacts).
      for (const v of map.values()) {
        if (!v.name) {
          const p = resolvePerson(v.id, 'contact');
          if (p) { v.name = p.name || ''; v.email = v.email || p.email || ''; }
        }
      }
      return Array.from(map.values())
        .sort((a, b) => b.count - a.count);
    }

    async function loadIssueDetail(id, { silent } = {}) {
      if (!silent) { state.loading = true; state.error = null; state.messages = []; render(); }
      // Fire people-loading in the background — it's only used to label authors.
      ensurePeopleLoaded();
      try {
        // Issue details
        const issueResp = await Pylon.getIssue(id).catch(e => { console.warn('getIssue failed', e); return null; });
        if (issueResp) {
          const issue = issueResp.data || issueResp.issue || issueResp;
          state.issue = Object.assign({}, state.issue, issue);
        }

        // Messages — try /issues/{id}/messages first (matches MCP shape), then /messages
        let msgResp = await Pylon.listMessages(id).catch(() => null);
        if (!msgResp || (extractList(msgResp).length === 0 && !Array.isArray(msgResp.messages))) {
          msgResp = await Pylon.listMessagesAlt(id).catch(() => null);
        }
        if (msgResp) state.messages = extractList(msgResp);
      } catch (e) {
        state.error = friendlyError(e);
      } finally {
        state.loading = false;
        if (state.view === 'detail') {
          // Silent refreshes (background poll, foreground-resume, pull-to-refresh)
          // must NOT re-render while the user is mid-reply, or the renderDetail()
          // call wipes the contenteditable and closes the composer.
          if (silent && isComposingActively()) {
            // Skip — fresh data is already in state and will surface on the
            // user's next manual interaction (send, navigate, etc.).
          } else {
            renderDetail();
          }
        }
      }
    }

    // Try a list of (endpoint, payload) candidates until one succeeds.
    // Pylon's actual reply endpoint isn't in the docs I can read from here;
    // this brute-forces the most common patterns so the app works while we
    // pin down the real path from the network log on first success.
    // Reply / note / thread per Pylon docs:
    //   POST /issues/{id}/reply  →  customer-facing reply  (body_html, message_id)
    //   POST /issues/{id}/note   →  internal note           (body_html, thread_id?)
    //   POST /issues/{id}/threads → new internal thread     (name)
    async function postReply(id, { body_html, isInternal, threadId, newThreadName, recipients }) {
      if (isInternal) {
        let targetThreadId = threadId || null;
        if (newThreadName) {
          const t = await Pylon.createThread(id, { name: newThreadName });
          const created = (t && (t.data || t)) || {};
          // Per docs: use the `id` field (not thread_id) from the response
          targetThreadId = created.id || created.thread_id || null;
          // Refresh thread list cache for this issue
          delete threadsByIssue[id];
        }
        const body = { body_html };
        if (targetThreadId) body.thread_id = targetThreadId;
        await Pylon.postNote(id, body);
        return { kind: 'note', threadId: targetThreadId };
      } else {
        // Public reply
        const msgs = state.messages || [];
        let messageId = null;
        for (let i = msgs.length - 1; i >= 0; i--) {
          const m = msgs[i];
          const isPrivate = !!(m && (m.is_private ?? m.is_internal ?? m.internal));
          if (!isPrivate && m && m.id) { messageId = m.id; break; }
        }
        const body = { body_html };
        if (messageId) body.message_id = messageId;
        // email_info: { to_emails, cc_emails, bcc_emails } — required when issue.source is email
        if (recipients && (recipients.to.length || recipients.cc.length || recipients.bcc.length)) {
          body.email_info = {
            to_emails: recipients.to.map(r => r.email).filter(Boolean),
            cc_emails: recipients.cc.map(r => r.email).filter(Boolean),
            bcc_emails: recipients.bcc.map(r => r.email).filter(Boolean),
          };
        }
        await Pylon.replyPublic(id, body);
        return { kind: 'reply' };
      }
    }

    // Build the default recipient lists for a reply.
    //
    // The TO field should be the original customer/sender. We try, in order:
    //   1. issue.requester.email           (most reliable when set)
    //   2. From the latest customer message: lookup author_id in peopleCache
    //   3. The latest non-internal message's email_info.from_email field
    //
    // CC/BCC come from the latest non-internal message's email_info, minus
    // anyone already in TO and minus the signed-in user.
    function gatherDefaultRecipients(issue, messages) {
      const me = state.me || {};
      const myEmails = new Set([me.email].filter(Boolean).map(s => s.toLowerCase()));
      const seen = new Set();
      const out = { to: [], cc: [], bcc: [] };

      function pushUnique(target, email, name) {
        if (!email) return;
        const lower = String(email).toLowerCase();
        if (myEmails.has(lower)) return; // never auto-add self
        if (seen.has(lower)) return;
        target.push({ email, name: name || '' });
        seen.add(lower);
      }

      // 1. requester.email from the issue (most reliable when populated)
      if (issue && issue.requester && issue.requester.email) {
        pushUnique(out.to, issue.requester.email, issue.requester.name);
      }

      // 2. If TO is still empty, try resolving via the latest customer message's author
      if (out.to.length === 0) {
        const msgs = messages || [];
        for (let i = msgs.length - 1; i >= 0; i--) {
          const m = msgs[i];
          if (!m || !m.from_customer) continue;
          // First try peopleCache.contacts (populated by listContacts)
          if (m.author_id && peopleCache.contacts[m.author_id]) {
            const c = peopleCache.contacts[m.author_id];
            pushUnique(out.to, c.email, c.name);
            if (out.to.length > 0) break;
          }
          // Fallback to nested author/from objects on the message itself
          const nested = m.author || m.from || m.sender;
          if (nested && typeof nested === 'object' && nested.email) {
            pushUnique(out.to, nested.email, nested.name);
            if (out.to.length > 0) break;
          }
        }
      }

      // 3. Walk newest-first, find the latest non-internal message's email_info
      const msgs = messages || [];
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        const isPrivate = !!(m && (m.is_private ?? m.is_internal));
        if (isPrivate) continue;
        const info = m && (m.email_info || m.email || m.email_metadata);
        if (!info) continue;

        // If TO is still empty, the from_email of the latest customer email is the best guess
        if (out.to.length === 0) {
          const fromEmail = info.from_email || info.from || (info.from_address && info.from_address.email);
          const fromName = (info.from_address && info.from_address.name) || '';
          if (fromEmail) pushUnique(out.to, fromEmail, fromName);
        }

        const addList = (key, target) => {
          const arr = info[key + '_emails'] || info[key] || [];
          for (const raw of (Array.isArray(arr) ? arr : [])) {
            const email = typeof raw === 'string' ? raw : (raw && (raw.email || raw.address));
            const name = typeof raw === 'object' ? (raw.name || '') : '';
            pushUnique(target, email, name);
          }
        };
        // Pull cc/bcc; some Pylon payloads also have to_emails — if our TO is
        // still empty, use those as a last resort.
        addList('cc', out.cc);
        addList('bcc', out.bcc);
        if (out.to.length === 0) addList('to', out.to);

        break;
      }

      return out;
    }

    // Async helper: if a customer message's contact isn't in the cache, fetch it
    // and re-fill the composer recipients in place.
    async function fillToFromContactIfMissing(messages, onResolved) {
      const msgs = messages || [];
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        if (!m || !m.from_customer || !m.author_id) continue;
        if (peopleCache.contacts[m.author_id]) continue; // already had it
        try {
          const r = await Pylon.getContact(m.author_id);
          const c = (r && (r.data || r)) || null;
          if (c && c.id) {
            peopleCache.contacts[c.id] = c;
            if (c.email) onResolved({ email: c.email, name: c.name || '' });
          }
        } catch {}
        break;
      }
    }

    function recipientLabel(r) { return r.name ? `${r.name} <${r.email}>` : r.email; }

    // Thread list per issue (cached for the session)
    const threadsByIssue = {};
    async function ensureThreadsLoaded(issueId) {
      if (threadsByIssue[issueId]) return threadsByIssue[issueId];
      try {
        const r = await Pylon.listThreads(issueId);
        const list = extractList(r) || [];
        threadsByIssue[issueId] = list;
      } catch {
        threadsByIssue[issueId] = [];
      }
      return threadsByIssue[issueId];
    }

    async function changeIssueState(newState) {
      const issue = state.issue || {};
      const id = issue.id || issue.number;
      if (!id) return;
      try {
        const resp = await Pylon.updateIssue(id, { state: newState });
        const updated = (resp && (resp.data || resp.issue || resp)) || {};
        state.issue = Object.assign({}, state.issue, updated, { state: newState });
        toast(`State changed to ${prettyState(newState)}`, 'success');
        if (state.view === 'detail') renderDetail();
      } catch (e) {
        toast(friendlyError(e), 'error');
      }
    }

    // Whether the tag picker dropdown is open
    let tagPickerOpen = false;
    let tagPickerSearch = '';

    function currentTagNames() {
      const t = (state.issue && state.issue.tags) || [];
      return t.map(x => typeof x === 'string' ? x : tagNameOf(x)).filter(Boolean);
    }

    function renderTagsSection() {
      const current = currentTagNames();
      const currentSet = new Set(current.map(n => n.toLowerCase()));
      const allTags = (tagCache.tags || []).map(tagNameOf).filter(Boolean);
      // Available = not yet on this issue
      const needle = tagPickerSearch.toLowerCase();
      const filtered = allTags
        .filter(n => !currentSet.has(n.toLowerCase()))
        .filter(n => !needle || n.toLowerCase().includes(needle))
        .slice(0, 50);

      const pills = current.map(name => `
        <span class="tag-pill" style="background:${tagColor(name)}; color:${tagTextColor(name)};">
          ${escapeHtml(name)}
          <button class="tag-remove" data-tag="${escapeAttr(name)}" aria-label="Remove ${escapeAttr(name)}">×</button>
        </span>`).join('');

      const picker = !tagPickerOpen ? '' : `
        <div class="tag-picker">
          <input type="search" id="tagSearch" placeholder="Search tags…" value="${escapeAttr(tagPickerSearch)}" autocomplete="off" />
          <div class="tag-options" id="tagOptions">
            ${!tagCache.loaded
              ? '<div class="state-row faint" style="padding:14px;"><span class="spinner"></span> Loading tags…</div>'
              : (filtered.length === 0
                  ? `<div class="state-row faint" style="padding:14px;">${tagPickerSearch ? 'No matches.' : (allTags.length === 0 ? 'No tags available for this workspace.' : 'All tags already added.')}</div>`
                  : filtered.map(name => `
                    <button class="tag-option" data-tag="${escapeAttr(name)}">
                      <span class="tag-swatch" style="background:${tagColor(name)};"></span>
                      ${escapeHtml(name)}
                    </button>`).join(''))
            }
          </div>
        </div>`;

      return `
        <div class="tag-row">
          ${pills}
          <button class="tag-add" id="tagAddBtn">${tagPickerOpen ? '× Close' : '+ Add tag'}</button>
        </div>
        ${picker}
      `;
    }

    function patchTagsSection() {
      const node = document.getElementById('tagsSection');
      if (!node) return;
      node.innerHTML = renderTagsSection();
      bindTagsSection();
      if (tagPickerOpen) {
        const $s = document.getElementById('tagSearch');
        if ($s) $s.focus();
      }
    }

    function bindTagsSection() {
      const $add = document.getElementById('tagAddBtn');
      if ($add) {
        $add.onclick = async () => {
          tagPickerOpen = !tagPickerOpen;
          tagPickerSearch = '';
          patchTagsSection();
          if (tagPickerOpen && !tagCache.loaded) {
            await ensureTagsLoaded();
            if (tagPickerOpen) patchTagsSection();
          }
        };
      }
      const $section = document.getElementById('tagsSection');
      if (!$section) return;
      $section.querySelectorAll('.tag-remove').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          removeTag(btn.dataset.tag);
        };
      });
      $section.querySelectorAll('.tag-option').forEach(btn => {
        btn.onclick = () => addTag(btn.dataset.tag);
      });
      const $search = document.getElementById('tagSearch');
      if ($search) {
        $search.oninput = (e) => {
          tagPickerSearch = e.target.value;
          const $opts = document.getElementById('tagOptions');
          if ($opts) {
            const allTags = (tagCache.tags || []).map(tagNameOf).filter(Boolean);
            const currentSet = new Set(currentTagNames().map(n => n.toLowerCase()));
            const needle = tagPickerSearch.toLowerCase();
            const filtered = allTags
              .filter(n => !currentSet.has(n.toLowerCase()))
              .filter(n => !needle || n.toLowerCase().includes(needle))
              .slice(0, 50);
            $opts.innerHTML = filtered.length === 0
              ? `<div class="state-row faint" style="padding:14px;">${needle ? 'No matches.' : 'All tags already added.'}</div>`
              : filtered.map(name => `
                <button class="tag-option" data-tag="${escapeAttr(name)}">
                  <span class="tag-swatch" style="background:${tagColor(name)};"></span>
                  ${escapeHtml(name)}
                </button>`).join('');
            $opts.querySelectorAll('.tag-option').forEach(b => {
              b.onclick = () => addTag(b.dataset.tag);
            });
          }
        };
      }
    }

    async function setIssueTags(nextTags, optimisticPrev) {
      const issue = state.issue || {};
      const id = issue.id || issue.number;
      if (!id) return;
      try {
        const resp = await Pylon.updateIssue(id, { tags: nextTags });
        const updated = (resp && (resp.data || resp.issue || resp)) || {};
        state.issue = Object.assign({}, state.issue, updated, { tags: nextTags });
        // Also reflect in the list-cache so the list view doesn't drift
        const idx = state.allIssues.findIndex(i => (i.id || i.number) === (issue.id || issue.number));
        if (idx >= 0) state.allIssues[idx] = Object.assign({}, state.allIssues[idx], { tags: nextTags });
      } catch (e) {
        // Revert
        state.issue = Object.assign({}, state.issue, { tags: optimisticPrev });
        toast(friendlyError(e), 'error');
      } finally {
        patchTagsSection();
      }
    }

    async function addTag(name) {
      const prev = currentTagNames();
      if (prev.map(n => n.toLowerCase()).includes(name.toLowerCase())) return;
      const next = [...prev, name];
      // Optimistic
      state.issue = Object.assign({}, state.issue, { tags: next });
      patchTagsSection();
      await setIssueTags(next, prev);
      toast(`Added "${name}"`, 'success');
    }
    async function removeTag(name) {
      const prev = currentTagNames();
      const next = prev.filter(n => n.toLowerCase() !== name.toLowerCase());
      state.issue = Object.assign({}, state.issue, { tags: next });
      patchTagsSection();
      await setIssueTags(next, prev);
      toast(`Removed "${name}"`, 'success');
    }

    // Deterministic pastel-ish tag colors based on the tag name.
    const TAG_PALETTE = [
      ['#ece8ff','#5b46b8'], ['#ffe5e7','#b42318'], ['#d6f1e1','#176e3a'],
      ['#d8e6ff','#1f4faf'], ['#fff1d6','#9a5b00'], ['#ffe1f0','#a3185f'],
      ['#dff7f5','#066b5e'], ['#f5e1ff','#6b1a8c'], ['#fff0e0','#8a3a00'],
      ['#e7fde7','#236f23'],
    ];
    function tagColorIdx(name) {
      let h = 0;
      const s = String(name || '');
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h % TAG_PALETTE.length;
    }
    function tagColor(name) { return TAG_PALETTE[tagColorIdx(name)][0]; }
    function tagTextColor(name) { return TAG_PALETTE[tagColorIdx(name)][1]; }

    function extractList(resp) {
      if (!resp) return [];
      if (Array.isArray(resp)) return resp;
      if (Array.isArray(resp.data)) return resp.data;
      if (Array.isArray(resp.items)) return resp.items;
      if (Array.isArray(resp.results)) return resp.results;
      if (Array.isArray(resp.issues)) return resp.issues;
      if (Array.isArray(resp.messages)) return resp.messages;
      return [];
    }

    function patchView() {
      if (state.view !== 'list') return;
      const container = document.getElementById('listContainer');
      const row = document.getElementById('filterRow');
      if (!container || !row) { render(); return; }
      // Re-render filter chips so counts (status chip especially) stay fresh
      // when issues load in the background.
      row.innerHTML =
        renderStatusFilterChip() +
        renderAssigneeFilterChip() +
        renderAccountFilterChip() +
        renderRequesterFilterChip() +
        renderDateChip();
      container.innerHTML = renderListBody();
      const retry = document.getElementById('retryBtn');
      if (retry) retry.addEventListener('click', loadIssues);
      attachBodyObservers();
    }

    // ============ Header actions ============

    hdrLeft.addEventListener('click', () => {
      if (state.view === 'detail') navigate('list');
      else if (state.view === 'settings') navigate('list');
      else if (state.view === 'netlog') { state.view = 'settings'; render(); }
      else if (state.view === 'signature') { state.view = 'settings'; render(); }
    });
    hdrRight.addEventListener('click', () => {
      if (state.view === 'list') navigate('settings');
    });

    // Bottom nav handlers
    bottomNav.addEventListener('click', (e) => {
      const btn = e.target.closest('.bottom-nav-btn');
      if (!btn) return;
      const target = btn.dataset.nav;
      if (target === 'list') navigate('list');
      else if (target === 'search') {
        navigate('list');
        // Focus synchronously inside the same task as the user tap so iOS
        // treats it as a user gesture and pops up the soft keyboard. A
        // setTimeout (even 0ms) breaks the gesture chain and the keyboard
        // never appears on iPhone — only the visual focus ring shows.
        const s = document.getElementById('searchInput');
        if (s) {
          s.focus({ preventScroll: true });
          // Belt and braces — re-focus on the next frame in case render
          // re-created the element after our initial focus call.
          requestAnimationFrame(() => {
            const s2 = document.getElementById('searchInput');
            if (s2 && document.activeElement !== s2) s2.focus({ preventScroll: true });
          });
        }
      } else if (target === 'settings') navigate('settings');
    });

    // ============ Toast ============

    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg, kind) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
      clearTimeout(toastTimer);
      if (kind === 'error') {
        // Errors stick until tapped, so the user can read & copy the full message
        toastEl.onclick = () => {
          toastEl.className = 'toast' + (kind ? ' ' + kind : '');
          toastEl.onclick = null;
        };
      } else {
        toastEl.onclick = null;
        toastTimer = setTimeout(() => { toastEl.className = 'toast' + (kind ? ' ' + kind : ''); }, 2400);
      }
    }

    // ============ Helpers ============

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // very small HTML sanitizer for message bodies — strips scripts/styles/event handlers,
    // and strips any author-supplied colours so the app theme always wins contrast.
    function sanitizeHtml(html) {
      const tpl = document.createElement('template');
      tpl.innerHTML = String(html || '');
      const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_ELEMENT);
      const remove = [];
      let n;
      while ((n = walker.nextNode())) {
        const tag = n.tagName.toLowerCase();
        if (['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta'].includes(tag)) {
          remove.push(n);
          continue;
        }
        // Drop legacy colour attributes from email HTML (<font color="#000">, <body bgcolor="…">, etc.)
        ['color', 'bgcolor', 'text', 'link', 'vlink', 'alink'].forEach(a => n.removeAttribute(a));

        for (const attr of Array.from(n.attributes)) {
          const name = attr.name.toLowerCase();
          const val = (attr.value || '').trim();
          if (name.startsWith('on')) n.removeAttribute(attr.name);
          else if ((name === 'href' || name === 'src') && /^javascript:/i.test(val)) n.removeAttribute(attr.name);
          else if (name === 'style') {
            // Strip colour-related declarations so theme tokens (--text, --surface) win contrast.
            const cleaned = val
              .split(';')
              .map(s => s.trim())
              .filter(s => s && !/^(color|background|background-color)\s*:/i.test(s))
              .join('; ');
            if (cleaned) n.setAttribute('style', cleaned);
            else n.removeAttribute('style');
          }
        }
        if (tag === 'a' && n.hasAttribute('href')) {
          n.setAttribute('target', '_blank');
          n.setAttribute('rel', 'noopener noreferrer');
        }
        if (tag === 'img') {
          n.setAttribute('loading', 'lazy');
        }
      }
      remove.forEach(el => el.remove());
      return tpl.innerHTML;
    }

    function formatDate(d) {
      try {
        return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return String(d); }
    }
    function formatDateTime(d) {
      try {
        const date = new Date(d);
        const today = new Date();
        const sameDay = date.toDateString() === today.toDateString();
        if (sameDay) return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      } catch { return String(d); }
    }
    function timeAgo(d) {
      try {
        const ms = Date.now() - new Date(d).getTime();
        const s = Math.floor(ms / 1000);
        if (s < 60) return 'just now';
        const m = Math.floor(s / 60);
        if (m < 60) return m + 'm';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h';
        const day = Math.floor(h / 24);
        if (day < 7) return day + 'd';
        return formatDate(d);
      } catch { return ''; }
    }

    function friendlyError(e) {
      const msg = (e && e.message) || String(e);
      if (/Failed to fetch|NetworkError|TypeError/.test(msg)) {
        return 'Network/CORS error. Direct browser calls to api.usepylon.com are usually blocked by CORS — configure a CORS proxy in Settings (see README).';
      }
      // Preserve the full Pylon error message verbatim — the API often returns
      // useful detail (missing field, bad enum, etc).
      return msg;
    }

    // True when the user appears to be actively writing a reply: the editor
    // is focused, or it contains real (non-empty) content. Used to suppress
    // silent re-renders that would otherwise wipe the contenteditable.
    function isComposingActively() {
      const editor = document.getElementById('replyEditor');
      if (!editor) return false;
      if (document.activeElement === editor) return true;
      const html = (editor.innerHTML || '').trim();
      // Treat browser-inserted empty markers as "no content"
      if (!html) return false;
      if (html === '<br>' || html === '<br/>' || html === '<div><br></div>') return false;
      const text = (editor.textContent || '').replace(/[\s​]+/g, '');
      return text.length > 0;
    }

    // Copy the current issue's Pylon web URL to the clipboard. Triggered by the
    // small copy button next to the # number in the detail-view header.
    async function copyIssueUrl(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const issue = state.issue;
      const num = issue && issue.number;
      if (num == null) { toast('No ticket number to copy', 'error'); return; }
      const url = 'https://app.usepylon.com/issues?issueNumber=' + encodeURIComponent(num);
      const btn = document.getElementById('hdrCopyBtn');
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
          await navigator.clipboard.writeText(url);
          copied = true;
        } else {
          throw new Error('clipboard API unavailable');
        }
      } catch {
        // Fallback for older Safari and non-secure contexts: hidden textarea + execCommand
        try {
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, url.length);
          copied = document.execCommand && document.execCommand('copy');
          document.body.removeChild(ta);
        } catch { copied = false; }
      }
      if (copied) {
        toast('Ticket URL copied', 'success');
        if (window.__buzz) window.__buzz(8);
        if (btn) {
          btn.classList.add('is-copied');
          setTimeout(function () { btn.classList.remove('is-copied'); }, 1200);
        }
      } else {
        toast('Copy failed — ' + url, 'error');
      }
    }

    // ============ Issue overflow menu (delete, etc) ============
    function openIssueMoreMenu(anchorBtn) {
      closeIssueMoreMenu();
      const menu = document.createElement('div');
      menu.className = 'popover-menu';
      menu.setAttribute('role', 'menu');

      // Position fixed, anchored to bottom-right of the trigger button

    function closeIssueMoreMenu() {
      document.querySelectorAll('.popover-menu, .popover-menu-backdrop').forEach(function (el) {
        el.remove();
      });
      document.removeEventListener('keydown', onMoreMenuKey);
    }
    function onMoreMenuKey(e) { if (e.key === 'Escape') closeIssueMoreMenu(); }

    // Generic confirm dialog — returns a Promise<boolean>.
    function confirmAction(opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        overlay.innerHTML =
          '<div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">' +
            '<h3 id="confirmTitle">' + escapeHtml(opts.title || 'Are you sure?') + '</h3>' +
            (opts.message ? '<p>' + escapeHtml(opts.message) + '</p>' : '') +
            '<div class="confirm-actions">' +
              '<button type="button" class="confirm-cancel">' + escapeHtml(opts.cancelLabel || 'Cancel') + '</button>' +
              '<button type="button" class="' + (opts.danger ? 'confirm-danger' : 'confirm-cancel') + '">' +
                escapeHtml(opts.confirmLabel || 'OK') +
              '</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        requestAnimationFrame(function () { overlay.classList.add('is-open'); });

        const cancelBtn = overlay.querySelector('.confirm-cancel');
        const confirmBtn = overlay.querySelectorAll('button')[1];
        function close(result) {
          overlay.classList.remove('is-open');
          setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
          document.removeEventListener('keydown', onKey);
          resolve(result);
        }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          else if (e.key === 'Enter') close(true);
        }
        cancelBtn.addEventListener('click', function () { close(false); });
        confirmBtn.addEventListener('click', function () { close(true); });
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(false); });
        document.addEventListener('keydown', onKey);
        // Focus the cancel button by default so accidental Enter doesn't delete.
        setTimeout(function () { cancelBtn.focus(); }, 50);
      });
    }

    // ============ AI assist (Groq) ============
    // Strip HTML from a message body into plain text for sending to Claude.
    function htmlToPlainText(html) {
      try {
        const d = document.createElement('div');
        d.innerHTML = String(html || '');
        // Replace block elements with line breaks for legibility
        d.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
        d.querySelectorAll('p, div, li').forEach(el => {
          if (!el.textContent.endsWith('\n')) el.appendChild(document.createTextNode('\n'));
        });
        return (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
      } catch { return String(html || ''); }
    }

    // Build the system prompt: configured prompt (or default) + ticket context.
    function buildAiSystemPrompt(issue, recentMsgs) {
      const base = (cfg.aiSystemPrompt && cfg.aiSystemPrompt.trim()) || DEFAULT_AI_PROMPT;
      const parts = [base, ''];
      if (issue) {
        parts.push('TICKET CONTEXT');
        if (issue.number != null) parts.push('Number: #' + issue.number);
        const title = issue.title || issue.subject || '';
        if (title) parts.push('Subject: ' + title);
        const acct = (issue.account && (issue.account.name || issue.account.title)) || '';
        if (acct) parts.push('Account: ' + acct);
        const req = (issue.requester && (issue.requester.name || issue.requester.email)) || '';
        if (req) parts.push('Requester: ' + req);
        parts.push('');
      }
      if (recentMsgs && recentMsgs.length) {
        parts.push('RECENT MESSAGES (oldest to newest)');
        for (const m of recentMsgs) {
          const isCustomer = m.from_customer === true || m.author_type === 'contact';
          const who = isCustomer ? 'Customer' : 'Agent';
          const name = (m.author && (m.author.name || m.author.email)) || m.author_name || '';
          const text = htmlToPlainText(m.body_html ?? m.html_body ?? m.message_html ?? m.body_text ?? m.body ?? '');
          if (!text) continue;
          parts.push('--- ' + who + (name ? ' (' + name + ')' : '') + ' ---');
          parts.push(text);
          parts.push('');
        }
      }
      return parts.join('\n');
    }

    // POST to Groq's OpenAI-compatible Chat Completions API. Groq's free tier
    // is reliably free: 30 req/min, 14,400 req/day. Signup needs only an email
    // — no Google account, no card. Get a key at console.groq.com → API Keys.
    // CORS works out of the box for direct browser calls.
    async function callGroq({ system, userMessage, model, maxTokens }) {
      if (!cfg.aiApiKey) throw new Error('No Groq API key set. Add one in Settings → AI assist.');
      const modelId = model || cfg.aiModel || DEFAULT_AI_MODEL;
      const messages = [];
      if (system && system.trim()) messages.push({ role: 'system', content: system });
      messages.push({ role: 'user', content: userMessage });
      const body = {
        model: modelId,
        messages: messages,
        max_tokens: maxTokens || 2048,
        temperature: 0.7,
      };
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.aiApiKey,
        },
        body: JSON.stringify(body),
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      if (!resp.ok) {
        const apiErr = (data && data.error && (data.error.message || data.error.code)) || text || ('HTTP ' + resp.status);
        throw new Error('Groq API ' + resp.status + ': ' + apiErr);
      }
      const out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!out || !out.trim()) {
        const reason = (data && data.choices && data.choices[0] && data.choices[0].finish_reason) || 'unknown';
        throw new Error('Groq returned no text (' + reason + ')');
      }
      return out.trim();
    }

    // The whole flow: take the editor's current draft, build context from the
    // last 5 thread messages + ticket info, send to Claude, replace the editor
    // content with the refined reply.
    async function refineDraftWithAi() {
      const editor = document.getElementById('replyEditor');
      if (!editor) return;
      const draft = (editor.textContent || '').trim();
      if (!draft) { toast('Write a draft first, then tap ✨', 'error'); return; }
      if (!cfg.aiApiKey) { toast('Add your Groq API key in Settings → AI assist', 'error'); return; }

      const btn = document.getElementById('aiRefineBtn');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      try {
        const recent = Array.isArray(state.messages) ? state.messages.slice(-5) : [];
        const system = buildAiSystemPrompt(state.issue, recent);
        const userMessage = 'Here is my draft reply. Please refine it according to the system instructions.\n\n--- DRAFT ---\n' + draft + '\n--- END DRAFT ---';
        const refined = await callGroq({ system, userMessage });
        // Replace editor content. Convert plain text back to simple HTML so
        // the contenteditable shows line breaks.
        editor.innerHTML = '';
        const lines = refined.split(/\n/);
        lines.forEach((line, i) => {
          if (i > 0) editor.appendChild(document.createElement('br'));
          editor.appendChild(document.createTextNode(line));
        });
        // Trigger any input listeners (e.g. send-button-enabled state)
        editor.dispatchEvent(new Event('input', { bubbles: true }));
        toast('Refined with Groq', 'success');
        if (window.__buzz) window.__buzz(10);
      } catch (e) {
        toast(e.message || String(e), 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
      }
    }

    // AI Overview — runs the entire ticket thread through Groq and shows a
    // structured summary in a bottom-slide sheet so the user can grok a long
    // ticket without scrolling through every message.
    async function getAiOverview() {
      if (!cfg.aiApiKey) {
        toast('Add your Groq API key in Settings → AI assist', 'error');
        return;
      }
      const issue = state.issue;
      if (!issue) return;
      const messages = state.messages || [];
      if (!messages.length) { toast('No messages to summarise yet', 'error'); return; }

      // Build full ticket context (NOT just the last 5 like refineDraftWithAi).
      const lines = [];
      lines.push('Ticket: #' + (issue.number != null ? issue.number : (issue.id || '?')));
      const title = issue.title || issue.subject;
      if (title) lines.push('Subject: ' + title);
      const stateStr = issue.state || issue.status;
      if (stateStr) lines.push('Status: ' + prettyState(stateStr));
      const acct = (issue.account && (issue.account.name || issue.account.title)) || '';
      if (acct) lines.push('Account: ' + acct);
      const req = (issue.requester && (issue.requester.name || issue.requester.email)) || '';
      if (req) lines.push('Requester: ' + req);
      if (issue.created_at) lines.push('Created: ' + formatDate(issue.created_at));
      if (Array.isArray(issue.tags) && issue.tags.length) {
        const tagNames = issue.tags.map(t => typeof t === 'string' ? t : (t.name || t.value || '')).filter(Boolean);
        if (tagNames.length) lines.push('Tags: ' + tagNames.join(', '));
      }
      lines.push('');
      lines.push('CONVERSATION (oldest to newest):');
      lines.push('');
      for (const m of messages) {
        const isCustomer = m.from_customer === true || m.author_type === 'contact';
        const who = isCustomer ? 'Customer' : 'Agent';
        const name = (m.author && (m.author.name || m.author.email)) || m.author_name || '';
        const when = m.sent_at || m.created_at || m.timestamp;
        const text = htmlToPlainText(m.body_html ?? m.html_body ?? m.message_html ?? m.body_text ?? m.body ?? '');
        if (!text) continue;
        lines.push('--- ' + who + (name ? ' (' + name + ')' : '') + (when ? ' · ' + formatDateTime(when) : '') + ' ---');
        lines.push(text);
        lines.push('');
      }

      const system =
        "You are reviewing a Pylon customer support ticket to give the support rep a quick overview so they can resume the conversation without reading every message. Read the entire conversation and produce a clear, structured summary using these exact section headings on their own line, followed by short content:\n\n" +
        "**What is this ticket about?**\n" +
        "(1-2 sentences on the core issue)\n\n" +
        "**Current status**\n" +
        "(what's happening right now, who's waiting on whom)\n\n" +
        "**What's been done so far**\n" +
        "(chronological bullets of agent actions and customer responses)\n\n" +
        "**Next action**\n" +
        "(what the rep should do next, or what they're waiting for)\n\n" +
        "**Key people**\n" +
        "(names of the customer, agents, and any internal CC'd folks)\n\n" +
        "**Open questions / blockers**\n" +
        "(anything unresolved or that needs clarification — omit this section if none)\n\n" +
        "Use - (hyphen) for bullets. Bold (**like this**) for important names or terms. No preamble, no quoting of original messages, no fluff.";

      const overlay = openAiSheet('Reading the thread…');
      try {
        const overview = await callGroq({ system, userMessage: lines.join('\n'), maxTokens: 1500 });
        fillAiSheet(overlay, overview);
      } catch (e) {
        fillAiSheetError(overlay, (e && e.message) || String(e));
      }
    }

    // Bottom-slide sheet used for AI Overview output. Returns the overlay
    // element so the caller can populate it once the API response lands.
    function openAiSheet(loadingLabel) {
      const overlay = document.createElement('div');
      overlay.className = 'ai-sheet-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML =
        '<div class="ai-sheet">' +
          '<div class="ai-sheet-header">' +
            '<span class="ai-sheet-title">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">' +
                '<path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/>' +
                '<path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>' +
              '</svg>' +
              '<span>Ticket Overview</span>' +
            '</span>' +
            '<button type="button" class="ai-sheet-close" aria-label="Close">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' +
              '</svg>' +
            '</button>' +
          '</div>' +
          '<div class="ai-sheet-body">' +
            '<div class="ai-sheet-loading"><span class="spinner"></span> ' + escapeHtml(loadingLabel) + '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      function close() {
        overlay.classList.remove('is-open');
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 220);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      overlay.querySelector('.ai-sheet-close').addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
      return overlay;
    }

    function fillAiSheet(overlay, text) {
      const body = overlay.querySelector('.ai-sheet-body');
      body.innerHTML = '<div class="ai-sheet-content">' + formatAiResponse(text) + '</div>';
    }
    function fillAiSheetError(overlay, msg) {
      const body = overlay.querySelector('.ai-sheet-body');
      body.innerHTML = '<div class="ai-sheet-error">Couldn’t load overview: ' + escapeHtml(msg) + '</div>';
    }

    // Light markdown-ish renderer for AI responses. Supports **bold**, bullet
    // lines starting with - or *, and paragraph breaks. Anything else passes
    // through as escaped plain text.
    function formatAiResponse(text) {
      const escaped = escapeHtml(String(text || ''));
      // Bold
      let html = escaped.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      // Single-asterisk italic (only when not adjacent to other asterisks)
      html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      // Group consecutive bullet lines into <ul><li>...
      const out = [];
      const blocks = html.split(/\n{2,}/);
      for (const block of blocks) {
        const ls = block.split(/\n/);
        const bulletRe = /^\s*[-•*]\s+(.+)$/;
        if (ls.every(l => bulletRe.test(l) || !l.trim())) {
          const items = ls.filter(l => l.trim()).map(l => '<li>' + l.replace(bulletRe, '$1') + '</li>').join('');
          out.push('<ul>' + items + '</ul>');
        } else {
          out.push('<p>' + ls.join('<br>') + '</p>');
        }
      }
      return out.join('');
    }

    // Delete the currently-open issue after a confirmation step.
    async function deleteCurrentIssue() {
      const issue = state.issue;
      if (!issue) return;
      const id = issue.id || issue.number;
      if (!id) return;
      const num = issue.number != null ? issue.number : id;
      const ok = await confirmAction({
        title: 'Delete #' + num + '?',
        message: 'This permanently deletes the ticket from Pylon. This cannot be undone.',
        confirmLabel: 'Delete',
        danger: true,
      });
      if (!ok) return;
      try {
        await Pylon.deleteIssue(id);
        // Remove from local caches so the inbox reflects the change immediately
        const matches = function (i) { return (i.id || i.number) === (issue.id || issue.number); };
        if (Array.isArray(state.allIssues)) state.allIssues = state.allIssues.filter(function (i) { return !matches(i); });
        if (Array.isArray(state.issues))    state.issues    = state.issues.filter(function (i) { return !matches(i); });
        state.issue = null;
        state.messages = [];
        toast('Ticket #' + num + ' deleted', 'success');
        if (window.__buzz) window.__buzz(15);
        navigate('list');
      } catch (e) {
        toast('Delete failed: ' + friendlyError(e), 'error');
      }
    }

    // ============ Image lightbox ============
    // Single delegated click handler — any tap on an image inside a message
    // body or an attachment thumbnail opens the lightbox.
    document.addEventListener('click', function (e) {
      const img = e.target && e.target.closest
        ? e.target.closest('.msg-body img, .att-image img')
        : null;
      if (!img) return;
      // Suppress any wrapping <a href="...tracker..."> link
      e.preventDefault();
      e.stopPropagation();
      openLightbox(img.currentSrc || img.src, img.alt || '');
    }, true);

    let lightboxEl = null;
    let lightboxPrevOverflow = '';
    function openLightbox(src, alt) {
      if (!src) return;
      closeLightbox(); // close any previous instance first
      const wrap = document.createElement('div');
      wrap.className = 'lightbox';
      wrap.setAttribute('role', 'dialog');
      wrap.setAttribute('aria-modal', 'true');
      wrap.setAttribute('aria-label', 'Image preview');
      wrap.innerHTML =
        '<button type="button" class="lightbox-close" aria-label="Close">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
        ' stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
        '<div class="lightbox-img-wrap">' +
          '<img alt="' + escapeAttr(alt) + '" draggable="false" />' +
        '</div>' +
        '<a class="lightbox-open-orig" href="' + escapeAttr(src) + '"' +
        ' target="_blank" rel="noopener noreferrer">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
        ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>' +
        '<polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        '<span>Open in browser</span></a>';
      const imgWrap = wrap.querySelector('.lightbox-img-wrap');
      const img = wrap.querySelector('img');
      img.src = src;
      document.body.appendChild(wrap);
      lightboxEl = wrap;
      lightboxPrevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';

      // ----- Pinch zoom + pan + double-tap -----
      let scale = 1, tx = 0, ty = 0;
      let startScale = 1, startTx = 0, startTy = 0;
      let startDist = 0, startMid = { x: 0, y: 0 };
      let panAnchor = null;
      let lastTapAt = 0;

      function applyT() {
        img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      }
      function snapReset(animate) {
        scale = 1; tx = 0; ty = 0;
        if (animate) {
          img.style.transition = 'transform .22s ease';
          applyT();
          setTimeout(function () { img.style.transition = ''; }, 240);
        } else {
          applyT();
        }
      }
      function distOf(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }
      function midOf(t1, t2) {
        return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      }

      imgWrap.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          startScale = scale;
          startTx = tx; startTy = ty;
          startDist = distOf(e.touches[0], e.touches[1]);
          startMid  = midOf(e.touches[0], e.touches[1]);
          panAnchor = null;
        } else if (e.touches.length === 1 && scale > 1) {
          panAnchor = { x: e.touches[0].clientX - tx, y: e.touches[0].clientY - ty };
        }
      }, { passive: false });

      imgWrap.addEventListener('touchmove', function (e) {
        if (e.touches.length === 2 && startDist > 0) {
          e.preventDefault();
          const d = distOf(e.touches[0], e.touches[1]);
          const m = midOf(e.touches[0], e.touches[1]);
          // Scale clamped to [1, 6]
          scale = Math.max(1, Math.min(6, startScale * (d / startDist)));
          // Pan by midpoint movement so the gesture feels anchored under fingers
          tx = startTx + (m.x - startMid.x);
          ty = startTy + (m.y - startMid.y);
          applyT();
        } else if (e.touches.length === 1 && scale > 1 && panAnchor) {
          e.preventDefault();
          tx = e.touches[0].clientX - panAnchor.x;
          ty = e.touches[0].clientY - panAnchor.y;
          applyT();
        }
      }, { passive: false });

      imgWrap.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) startDist = 0;
        if (e.touches.length > 0) return;
        panAnchor = null;
        // If barely zoomed (e.g. accidental pinch), snap back
        if (scale < 1.05) {
          snapReset(true);
          lastTapAt = 0;
          return;
        }
        // Double-tap toggle: zoom out if zoomed, zoom in if not
        const now = Date.now();
        if (now - lastTapAt < 280 && e.changedTouches.length === 1) {
          img.style.transition = 'transform .22s ease';
          if (scale > 1) { scale = 1; tx = 0; ty = 0; }
          else { scale = 2.5; tx = 0; ty = 0; }
          applyT();
          setTimeout(function () { img.style.transition = ''; }, 240);
          lastTapAt = 0;
        } else {
          lastTapAt = now;
        }
      });

      // Desktop: scroll wheel zooms (handy for testing in a browser)
      imgWrap.addEventListener('wheel', function (e) {
        if (!e.ctrlKey && Math.abs(e.deltaY) < 5) return;
        e.preventDefault();
        const delta = -e.deltaY * 0.004;
        scale = Math.max(1, Math.min(6, scale + delta));
        if (scale === 1) { tx = 0; ty = 0; }
        applyT();
      }, { passive: false });

      // Tap-to-close — only when not zoomed; never closes when tapping the
      // image itself or the open-in-browser link.
      wrap.addEventListener('click', function (ev) {
        if (ev.target.closest('.lightbox-close')) { closeLightbox(); return; }
        if (ev.target.closest('img') || ev.target.closest('.lightbox-open-orig')) return;
        if (scale > 1) return;
        closeLightbox();
      });

      // Escape closes (mainly for desktop / keyboard users)
      document.addEventListener('keydown', onLightboxKey);

      // Fade in
      requestAnimationFrame(function () { wrap.classList.add('is-open'); });
    }

    function closeLightbox() {
      if (!lightboxEl) return;
      const el = lightboxEl;
      lightboxEl = null;
      document.removeEventListener('keydown', onLightboxKey);
      document.body.style.overflow = lightboxPrevOverflow;
      el.classList.remove('is-open');
      // Wait for fade-out, then remove
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
    }
    function onLightboxKey(e) { if (e.key === 'Escape') closeLightbox(); }

    // ============ Boot ============
    if (!cfg.apiKey) {
      render();
    } else {
      // try /me silently so settings has user info; then load list
      Pylon.me().then(me => { state.me = (me && (me.data || me)) || null; render(); }).catch(() => render());
      loadIssues();
    }

    // ============ PWA: service worker + install handling ============
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.navigator.standalone === true;

    // Add a class so we can hide install hints when already installed
    if (isStandalone) document.documentElement.classList.add('is-standalone');

    // Register service worker (file:// won't allow this — only when served over http(s))
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Detect new versions and offer to refresh
          function watchForUpdate(installing) {
            if (!installing) return;
            installing.addEventListener('statechange', () => {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(reg);
              }
            });
          }
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg);
          reg.addEventListener('updatefound', () => watchForUpdate(reg.installing));
        }).catch(() => {});

        // When the active SW changes, reload to pick up the new shell.
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }

    function showUpdateBanner(reg) {
      // Build a small bottom banner so the user can choose to refresh
      let bar = document.getElementById('pwa-update-bar');
      if (bar) return;
      bar = document.createElement('div');
      bar.id = 'pwa-update-bar';
      bar.className = 'pwa-update-bar';
      bar.innerHTML = `
        <span>A new version is available.</span>
        <button type="button" id="pwa-update-refresh">Refresh</button>
        <button type="button" id="pwa-update-dismiss" aria-label="Dismiss">×</button>
      `;
      document.body.appendChild(bar);
      document.getElementById('pwa-update-refresh').onclick = () => {
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      };
      document.getElementById('pwa-update-dismiss').onclick = () => bar.remove();
    }

    // Android / desktop Chrome: capture the install prompt and offer it ourselves
    let deferredInstall = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      maybeShowAndroidInstallBanner();
    });
    window.addEventListener('appinstalled', () => {
      deferredInstall = null;
      const b = document.getElementById('pwa-install-bar');
      if (b) b.remove();
    });

    function maybeShowAndroidInstallBanner() {
      if (!deferredInstall) return;
      if (isStandalone) return;
      if (sessionStorage.getItem('pwa-install-dismissed') === '1') return;
      let bar = document.getElementById('pwa-install-bar');
      if (bar) return;
      bar = document.createElement('div');
      bar.id = 'pwa-install-bar';
      bar.className = 'pwa-install-bar';
      bar.innerHTML = `
        <span>Install Pylon Mobile to your home screen for a faster experience.</span>
        <button type="button" id="pwa-install-yes">Install</button>
        <button type="button" id="pwa-install-no" aria-label="Dismiss">×</button>
      `;
      document.body.appendChild(bar);
      document.getElementById('pwa-install-yes').onclick = async () => {
        const e = deferredInstall;
        deferredInstall = null;
        bar.remove();
        if (e) e.prompt();
      };
      document.getElementById('pwa-install-no').onclick = () => {
        sessionStorage.setItem('pwa-install-dismissed', '1');
        bar.remove();
      };
    }

    // iOS Safari: no beforeinstallprompt — show a one-off hint banner
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent || '') && !/crios|fxios|edgios/i.test(navigator.userAgent || '');
    if (isIos && !isStandalone && !localStorage.getItem('pwa-ios-hint-dismissed')) {
      window.addEventListener('load', () => {
        const bar = document.createElement('div');
        bar.id = 'pwa-ios-hint';
        bar.className = 'pwa-install-bar';
        bar.innerHTML = `
          <span>
            Install: tap
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            then <strong>Add to Home Screen</strong>.
          </span>
          <button type="button" id="pwa-ios-hint-dismiss" aria-label="Dismiss">×</button>
        `;
        document.body.appendChild(bar);
        document.getElementById('pwa-ios-hint-dismiss').onclick = () => {
          localStorage.setItem('pwa-ios-hint-dismissed', '1');
          bar.remove();
        };
      });
    }

    // Light haptic feedback on key actions for native feel (Android only — iOS Safari ignores)
    window.__buzz = function (ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch {}
    };

    // Keyboard tracking — iOS 16.4+/Chrome 108+ honour
    // <meta viewport interactive-widget=resizes-content> and 100dvh shrinks for
    // the keyboard automatically. For older iOS we fall back to visualViewport
    // and expose --kb-inset (keyboard height) so the composer and main padding
    // can adjust. Without this the composer stays anchored to the layout-
    // viewport bottom, leaving dead space between it and the keyboard.
    (function trackKeyboard() {
      const vv = window.visualViewport;
      if (!vv) return;
      function update() {
        // Keyboard inset = the difference between the layout viewport bottom
        // and the visual viewport bottom (offsetTop accounts for any visual
        // viewport scroll/pan caused by focused inputs).
        const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty('--kb-inset', inset + 'px');
      }
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
      window.addEventListener('orientationchange', function () {
        // Defer until after iOS finishes the rotation
        setTimeout(update, 200);
      });
      update();
    })();

    // ============ Pull-to-refresh + background auto-refresh ============
    (function setupRefresh() {
      const PULL_THRESHOLD = 70;   // px past which release triggers refresh
      const MAX_PULL = 140;        // px ceiling on visible pull
      const POLL_MS = 30000;       // 30s background poll interval

      // Indicator UI
      const indicator = document.createElement('div');
      indicator.id = 'ptrIndicator';
      indicator.setAttribute('aria-hidden', 'true');
      indicator.innerHTML =
        '<svg class="ptr-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"' +
        ' stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>' +
        '<span class="ptr-spinner"></span>';
      document.body.appendChild(indicator);

      let startY = 0;
      let pulling = false;
      let refreshing = false;
      let currentPull = 0;

      function getScrollTop() {
        return (document.scrollingElement || document.documentElement).scrollTop ||
               document.body.scrollTop || 0;
      }

      function setIndicator(pull) {
        currentPull = pull;
        // -64px = hidden above viewport; 0px = at rest position; +N = pulled down
        const ty = Math.min(pull, MAX_PULL) - 64;
        indicator.style.transform = 'translate(-50%, ' + ty + 'px)';
        indicator.classList.toggle('ptr-ready', pull >= PULL_THRESHOLD);
      }

      function resetIndicator(animate) {
        indicator.style.transition = animate ? 'transform .2s ease' : 'none';
        setIndicator(0);
        if (animate) {
          setTimeout(function () { indicator.style.transition = 'none'; }, 220);
        }
      }

      // Allow refresh only on views that have data to refresh
      function canRefresh() {
        if (refreshing) return false;
        // Don't refresh while the user is mid-reply — silent refresh would wipe
        // their typed content.
        if (typeof isComposingActively === 'function' && isComposingActively()) return false;
        return state.view === 'list' ||
               (state.view === 'detail' && state.issue && state.issue.id);
      }

      async function triggerRefresh() {
        if (!canRefresh()) { resetIndicator(true); return; }
        refreshing = true;
        indicator.classList.add('ptr-refreshing');
        indicator.style.transition = 'transform .2s ease';
        indicator.style.transform = 'translate(-50%, ' + (PULL_THRESHOLD - 64) + 'px)';
        try {
          if (state.view === 'list') {
            await loadIssues({ silent: true });
          } else if (state.view === 'detail') {
            await loadIssueDetail(state.issue.id, { silent: true });
          }
        } catch (e) {
          // Errors are surfaced by the load functions themselves via state.error.
        } finally {
          refreshing = false;
          indicator.classList.remove('ptr-refreshing');
          resetIndicator(true);
        }
      }

      // Expose so other code paths can trigger a refresh too
      window.__refresh = triggerRefresh;

      document.addEventListener('touchstart', function (e) {
        if (refreshing) return;
        // Don't activate pull-to-refresh while the lightbox is open
        if (document.querySelector('.lightbox')) { pulling = false; return; }
        if (e.touches.length !== 1) { pulling = false; return; }
        if (getScrollTop() > 0) { pulling = false; return; }
        if (!canRefresh()) { pulling = false; return; }
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.style.transition = 'none';
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!pulling || refreshing) return;
        if (getScrollTop() > 0) {
          pulling = false;
          resetIndicator(true);
          return;
        }
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) {
          // Direction reversed; cancel pull
          resetIndicator(false);
          return;
        }
        // Suppress native iOS rubber-band so our indicator drives the motion
        if (e.cancelable) e.preventDefault();
        // Rubber-band damping so the pull feels resistive past the threshold
        const damped = dy <= PULL_THRESHOLD
          ? dy
          : PULL_THRESHOLD + (dy - PULL_THRESHOLD) * 0.4;
        setIndicator(damped);
      }, { passive: false });

      document.addEventListener('touchend', function () {
        if (!pulling || refreshing) return;
        pulling = false;
        if (currentPull >= PULL_THRESHOLD) {
          // Light haptic confirmation that refresh was triggered
          if (window.__buzz) window.__buzz(6);
          triggerRefresh();
        } else {
          resetIndicator(true);
        }
      });

      // Background auto-refresh — silent poll every 30s while the app is visible
      let pollTimer = null;
      function startPolling() {
        stopPolling();
        pollTimer = setInterval(function () {
          if (document.visibilityState !== 'visible') return;
          if (refreshing) return;
          if (!cfg.apiKey) return;
          // Never poll while the user is mid-reply — even though loadIssueDetail
          // now skips its re-render in that case, avoiding the API call entirely
          // is cleaner and saves rate-limit budget.
          if (isComposingActively()) return;
          if (state.view === 'list') {
            loadIssues({ silent: true }).catch(function () {});
          } else if (state.view === 'detail' && state.issue && state.issue.id) {
            loadIssueDetail(state.issue.id, { silent: true }).catch(function () {});
          }
        }, POLL_MS);
      }
      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          startPolling();
          // Also fire one immediate refresh when the app returns to foreground —
          // but skip if the user is mid-reply.
          if (cfg.apiKey && !refreshing && !isComposingActively()) {
            if (state.view === 'list') loadIssues({ silent: true }).catch(function () {});
            else if (state.view === 'detail' && state.issue && state.issue.id) {
              loadIssueDetail(state.issue.id, { silent: true }).catch(function () {});
            }
          }
        } else {
          stopPolling();
        }
      });

      // Kick off polling once the page is ready
      if (cfg.apiKey) startPolling();
    })();

  })();
  </script>
</body>
</html>
