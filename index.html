    function closeIssueMoreMenu() {
      document.querySelectorAll('.popover-menu, .popover-menu-backdrop').forEach(function (el) {
        el.remove();
      });
      document.removeEventListener('keydown', onMoreMenuKey);
    }
    function onMoreMenuKey(e) { if (e.key === 'Escape') closeIssueMoreMenu(); }

    // Generic confirm dialog — returns a Promise<boolean>.
    function confirmAction(opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        const overlay = document.createElement('div');
        overlay.className = 'confirm-overlay';
        overlay.innerHTML =
          '<div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">' +
            '<h3 id="confirmTitle">' + escapeHtml(opts.title || 'Are you sure?') + '</h3>' +
            (opts.message ? '<p>' + escapeHtml(opts.message) + '</p>' : '') +
            '<div class="confirm-actions">' +
              '<button type="button" class="confirm-cancel">' + escapeHtml(opts.cancelLabel || 'Cancel') + '</button>' +
              '<button type="button" class="' + (opts.danger ? 'confirm-danger' : 'confirm-cancel') + '">' +
                escapeHtml(opts.confirmLabel || 'OK') +
              '</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        requestAnimationFrame(function () { overlay.classList.add('is-open'); });

        const cancelBtn = overlay.querySelector('.confirm-cancel');
        const confirmBtn = overlay.querySelectorAll('button')[1];
        function close(result) {
          overlay.classList.remove('is-open');
          setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
          document.removeEventListener('keydown', onKey);
          resolve(result);
        }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          else if (e.key === 'Enter') close(true);
        }
        cancelBtn.addEventListener('click', function () { close(false); });
        confirmBtn.addEventListener('click', function () { close(true); });
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(false); });
        document.addEventListener('keydown', onKey);
        // Focus the cancel button by default so accidental Enter doesn't delete.
        setTimeout(function () { cancelBtn.focus(); }, 50);
      });
    }

    // ============ AI assist (Groq) ============
    // Strip HTML from a message body into plain text for sending to Claude.
    function htmlToPlainText(html) {
      try {
        const d = document.createElement('div');
        d.innerHTML = String(html || '');
        // Replace block elements with line breaks for legibility
        d.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
        d.querySelectorAll('p, div, li').forEach(el => {
          if (!el.textContent.endsWith('\n')) el.appendChild(document.createTextNode('\n'));
        });
        return (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
      } catch { return String(html || ''); }
    }

    // Build the system prompt: configured prompt (or default) + ticket context.
    function buildAiSystemPrompt(issue, recentMsgs) {
      const base = (cfg.aiSystemPrompt && cfg.aiSystemPrompt.trim()) || DEFAULT_AI_PROMPT;
      const parts = [base, ''];
      if (issue) {
        parts.push('TICKET CONTEXT');
        if (issue.number != null) parts.push('Number: #' + issue.number);
        const title = issue.title || issue.subject || '';
        if (title) parts.push('Subject: ' + title);
        const acct = (issue.account && (issue.account.name || issue.account.title)) || '';
        if (acct) parts.push('Account: ' + acct);
        const req = (issue.requester && (issue.requester.name || issue.requester.email)) || '';
        if (req) parts.push('Requester: ' + req);
        parts.push('');
      }
      if (recentMsgs && recentMsgs.length) {
        parts.push('RECENT MESSAGES (oldest to newest)');
        for (const m of recentMsgs) {
          const isCustomer = m.from_customer === true || m.author_type === 'contact';
          const who = isCustomer ? 'Customer' : 'Agent';
          const name = (m.author && (m.author.name || m.author.email)) || m.author_name || '';
          const text = htmlToPlainText(m.body_html ?? m.html_body ?? m.message_html ?? m.body_text ?? m.body ?? '');
          if (!text) continue;
          parts.push('--- ' + who + (name ? ' (' + name + ')' : '') + ' ---');
          parts.push(text);
          parts.push('');
        }
      }
      return parts.join('\n');
    }

    // POST to Groq's OpenAI-compatible Chat Completions API. Groq's free tier
    // is reliably free: 30 req/min, 14,400 req/day. Signup needs only an email
    // — no Google account, no card. Get a key at console.groq.com → API Keys.
    // CORS works out of the box for direct browser calls.
    async function callGroq({ system, userMessage, model, maxTokens }) {
      if (!cfg.aiApiKey) throw new Error('No Groq API key set. Add one in Settings → AI assist.');
      const modelId = model || cfg.aiModel || DEFAULT_AI_MODEL;
      const messages = [];
      if (system && system.trim()) messages.push({ role: 'system', content: system });
      messages.push({ role: 'user', content: userMessage });
      const body = {
        model: modelId,
        messages: messages,
        max_tokens: maxTokens || 2048,
        temperature: 0.7,
      };
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.aiApiKey,
        },
        body: JSON.stringify(body),
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      if (!resp.ok) {
        const apiErr = (data && data.error && (data.error.message || data.error.code)) || text || ('HTTP ' + resp.status);
        throw new Error('Groq API ' + resp.status + ': ' + apiErr);
      }
      const out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!out || !out.trim()) {
        const reason = (data && data.choices && data.choices[0] && data.choices[0].finish_reason) || 'unknown';
        throw new Error('Groq returned no text (' + reason + ')');
      }
      return out.trim();
    }

    // The whole flow: take the editor's current draft, build context from the
    // last 5 thread messages + ticket info, send to Claude, replace the editor
    // content with the refined reply.
    async function refineDraftWithAi() {
      const editor = document.getElementById('replyEditor');
      if (!editor) return;
      const draft = (editor.textContent || '').trim();
      if (!draft) { toast('Write a draft first, then tap ✨', 'error'); return; }
      if (!cfg.aiApiKey) { toast('Add your Groq API key in Settings → AI assist', 'error'); return; }

      const btn = document.getElementById('aiRefineBtn');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      try {
        const recent = Array.isArray(state.messages) ? state.messages.slice(-5) : [];
        const system = buildAiSystemPrompt(state.issue, recent);
        const userMessage = 'Here is my draft reply. Please refine it according to the system instructions.\n\n--- DRAFT ---\n' + draft + '\n--- END DRAFT ---';
        const refined = await callGroq({ system, userMessage });
        // Replace editor content. Convert plain text back to simple HTML so
        // the contenteditable shows line breaks.
        editor.innerHTML = '';
        const lines = refined.split(/\n/);
        lines.forEach((line, i) => {
          if (i > 0) editor.appendChild(document.createElement('br'));
          editor.appendChild(document.createTextNode(line));
        });
        // Trigger any input listeners (e.g. send-button-enabled state)
        editor.dispatchEvent(new Event('input', { bubbles: true }));
        toast('Refined with Groq', 'success');
        if (window.__buzz) window.__buzz(10);
      } catch (e) {
        toast(e.message || String(e), 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
      }
    }

    // ============ AI Search ============
    // Deep search across ticket conversations. Builds candidate list from the
    // current local filter (subject/account/preview matches), fetches each
    // candidate's messages, sends the bundle to Groq with the user's query,
    // and filters the inbox to whatever ticket numbers the model returns.
    async function runAiSearch() {
      if (!cfg.aiApiKey) {
        toast('Add your Groq API key in Settings → AI assist', 'error');
        return;
      }
      const query = (state.filter.q || '').trim();
      if (!query) {
        toast('Type something in the search box first', 'error');
        return;
      }

      // Cap candidates so we don't fire dozens of API calls. We pick the most
      // recent issues (within the active filters) as the search space.
      const MAX_CANDIDATES = 30;
      // Snapshot current local matches WITHOUT the AI filter so we can replace it.
      const wasAi = state.aiSearchMatches;
      state.aiSearchMatches = null;
      const localMatches = applyClientFilters(state.allIssues);
      // Restore until we have new matches
      state.aiSearchMatches = wasAi;
      const candidates = localMatches.slice(0, MAX_CANDIDATES);

      if (!candidates.length) {
        toast('No tickets match your filters to search', 'error');
        return;
      }

      const btn = document.getElementById('aiSearchBtn');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      toast('AI searching ' + candidates.length + ' ticket' + (candidates.length === 1 ? '' : 's') + '…', 'success');

      // Fetch messages for each candidate with bounded concurrency so we
      // don't blow through Pylon's rate limits.
      const CONCURRENCY = 5;
      const threads = new Array(candidates.length).fill(null);
      let next = 0;
      async function worker() {
        while (true) {
          const idx = next++;
          if (idx >= candidates.length) return;
          const issue = candidates[idx];
          const id = issue.id || issue.number;
          try {
            const resp = await Pylon.listMessages(id).catch(() => null);
            const msgs = extractList(resp) || [];
            threads[idx] = msgs;
          } catch { threads[idx] = []; }
        }
      }
      const workers = [];
      for (let w = 0; w < Math.min(CONCURRENCY, candidates.length); w++) workers.push(worker());

      try {
        await Promise.all(workers);

        // Build the prompt: for each candidate, emit a structured block with
        // metadata + the full thread text. Keep each message tight so the
        // payload stays under model context limits.
        const blocks = candidates.map(function (issue, idx) {
          const num = issue.number != null ? issue.number : (issue.id || '?');
          const title = issue.title || issue.subject || '';
          const acct = (issue.account && (issue.account.name || issue.account.title)) || resolveAccountName(issue) || '';
          const req = (issue.requester && (issue.requester.name || issue.requester.email)) || '';
          const msgs = threads[idx] || [];
          // Cap each thread to last 20 messages, each message to ~500 chars,
          // to keep the prompt bounded.
          const recent = msgs.slice(-20);
          const lines = recent.map(function (m) {
            const isCustomer = m.from_customer === true || m.author_type === 'contact';
            const who = isCustomer ? 'Customer' : 'Agent';
            const text = htmlToPlainText(m.body_html ?? m.html_body ?? m.message_html ?? m.body_text ?? m.body ?? '').slice(0, 500);
            return who + ': ' + text;
          }).filter(Boolean).join('\n');
          return '#' + num + ' | ' + title +
            (acct ? ' | Account: ' + acct : '') +
            (req ? ' | Requester: ' + req : '') +
            (lines ? '\n' + lines : '');
        });

        const userMessage =
          'The user is searching their Pylon support inbox for: "' + query + '"\n\n' +
          'Below are ' + candidates.length + ' tickets, each with their subject, account, requester, and full conversation. ' +
          'Return ONLY the ticket numbers (digits only, one per line) that match the user\'s query — based on the meaning of the query, including any text inside the conversation. ' +
          'If a ticket is clearly unrelated, omit it. If none match, return an empty response.\n\n' +
          'TICKETS:\n' +
          blocks.join('\n\n---\n\n');

        const system =
          'You are a search assistant for a customer support inbox. Read the user\'s query and the list of tickets below. ' +
          'Return ONLY the matching ticket numbers, one per line (e.g.\n12345\n12340\n12331). ' +
          'No preamble, no explanation, no "#" prefix, no other text. ' +
          'Match on intent and content — synonyms, paraphrases, and references inside the conversation all count.';

        const response = await callGroq({ system, userMessage, maxTokens: 200 });

        // Parse: lines that contain only digits (after trimming common prefixes).
        const matched = new Set();
        response.split(/\r?\n/).forEach(function (line) {
          const m = line.replace(/^#/, '').trim().match(/^\d+$/);
          if (m) matched.add(m[0]);
        });

        if (matched.size === 0) {
          toast('AI found no matches for that query', 'error');
        } else {
          state.aiSearchMatches = matched;
          state.aiSearchQuery = query;
          reapplyFilters();
          render(); // re-render to show the AI banner
          toast('AI found ' + matched.size + ' match' + (matched.size === 1 ? '' : 'es'), 'success');
          if (window.__buzz) window.__buzz(10);
        }
      } catch (e) {
        toast('AI search failed: ' + ((e && e.message) || String(e)), 'error');
      } finally {
        const b = document.getElementById('aiSearchBtn');
        if (b) { b.disabled = false; b.classList.remove('is-loading'); }
      }
    }

    // AI Overview — runs the entire ticket thread through Groq and shows a
    // structured summary in a bottom-slide sheet so the user can grok a long
    // ticket without scrolling through every message.
    async function getAiOverview() {
      if (!cfg.aiApiKey) {
        toast('Add your Groq API key in Settings → AI assist', 'error');
        return;
      }
      const issue = state.issue;
      if (!issue) return;
      const messages = state.messages || [];
      if (!messages.length) { toast('No messages to summarise yet', 'error'); return; }

      // Build full ticket context (NOT just the last 5 like refineDraftWithAi).
      const lines = [];
      lines.push('Ticket: #' + (issue.number != null ? issue.number : (issue.id || '?')));
      const title = issue.title || issue.subject;
      if (title) lines.push('Subject: ' + title);
      const stateStr = issue.state || issue.status;
      if (stateStr) lines.push('Status: ' + prettyState(stateStr));
      const acct = (issue.account && (issue.account.name || issue.account.title)) || '';
      if (acct) lines.push('Account: ' + acct);
      const req = (issue.requester && (issue.requester.name || issue.requester.email)) || '';
      if (req) lines.push('Requester: ' + req);
      if (issue.created_at) lines.push('Created: ' + formatDate(issue.created_at));
      if (Array.isArray(issue.tags) && issue.tags.length) {
        const tagNames = issue.tags.map(t => typeof t === 'string' ? t : (t.name || t.value || '')).filter(Boolean);
        if (tagNames.length) lines.push('Tags: ' + tagNames.join(', '));
      }
      lines.push('');
      lines.push('CONVERSATION (oldest to newest):');
      lines.push('');
      for (const m of messages) {
        const isCustomer = m.from_customer === true || m.author_type === 'contact';
        const who = isCustomer ? 'Customer' : 'Agent';
        const name = (m.author && (m.author.name || m.author.email)) || m.author_name || '';
        const when = m.sent_at || m.created_at || m.timestamp;
        const text = htmlToPlainText(m.body_html ?? m.html_body ?? m.message_html ?? m.body_text ?? m.body ?? '');
        if (!text) continue;
        lines.push('--- ' + who + (name ? ' (' + name + ')' : '') + (when ? ' · ' + formatDateTime(when) : '') + ' ---');
        lines.push(text);
        lines.push('');
      }

      const system =
        "You are reviewing a Pylon customer support ticket to give the support rep a quick overview so they can resume the conversation without reading every message. Read the entire conversation and produce a clear, structured summary using these exact section headings on their own line, followed by short content:\n\n" +
        "**What is this ticket about?**\n" +
        "(1-2 sentences on the core issue)\n\n" +
        "**Current status**\n" +
        "(what's happening right now, who's waiting on whom)\n\n" +
        "**What's been done so far**\n" +
        "(chronological bullets of agent actions and customer responses)\n\n" +
        "**Next action**\n" +
        "(what the rep should do next, or what they're waiting for)\n\n" +
        "**Key people**\n" +
        "(names of the customer, agents, and any internal CC'd folks)\n\n" +
        "**Open questions / blockers**\n" +
        "(anything unresolved or that needs clarification — omit this section if none)\n\n" +
        "Use - (hyphen) for bullets. Bold (**like this**) for important names or terms. No preamble, no quoting of original messages, no fluff.";

      const overlay = openAiSheet('Reading the thread…');
      try {
        const overview = await callGroq({ system, userMessage: lines.join('\n'), maxTokens: 1500 });
        fillAiSheet(overlay, overview);
      } catch (e) {
        fillAiSheetError(overlay, (e && e.message) || String(e));
      }
    }

    // Bottom-slide sheet used for AI Overview output. Returns the overlay
    // element so the caller can populate it once the API response lands.
    function openAiSheet(loadingLabel) {
      const overlay = document.createElement('div');
      overlay.className = 'ai-sheet-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML =
        '<div class="ai-sheet">' +
          '<div class="ai-sheet-header">' +
            '<span class="ai-sheet-title">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">' +
                '<path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/>' +
                '<path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>' +
              '</svg>' +
              '<span>Ticket Overview</span>' +
            '</span>' +
            '<button type="button" class="ai-sheet-close" aria-label="Close">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' +
              '</svg>' +
            '</button>' +
          '</div>' +
          '<div class="ai-sheet-body">' +
            '<div class="ai-sheet-loading"><span class="spinner"></span> ' + escapeHtml(loadingLabel) + '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      // Lock body scroll while the sheet is open so the page underneath
      // doesn't compete with the sheet's own scroll on Android Chrome.
      const prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      function close() {
        overlay.classList.remove('is-open');
        document.body.style.overflow = prevOverflow;
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 220);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      overlay.querySelector('.ai-sheet-close').addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
      return overlay;
    }

    // After populating the sheet body, force its scrollTop to 0. On Android
    // Chrome the inserted content sometimes lands with the scroll partway
    // down (the previous innerHTML's loading-row height is reused); iOS
    // resets cleanly but Android doesn't.
    function _scrollSheetToTop(overlay) {
      const body = overlay && overlay.querySelector('.ai-sheet-body');
      if (!body) return;
      // Run on next frame so the new content has been laid out.
      requestAnimationFrame(function () {
        body.scrollTop = 0;
        // Belt-and-braces — Android sometimes ignores the first attempt if
        // the layout is still settling.
        setTimeout(function () { body.scrollTop = 0; }, 50);
      });
    }

    function fillAiSheet(overlay, text) {
      const body = overlay.querySelector('.ai-sheet-body');
      body.innerHTML = '<div class="ai-sheet-content">' + formatAiResponse(text) + '</div>';
      _scrollSheetToTop(overlay);
    }
    function fillAiSheetError(overlay, msg) {
      const body = overlay.querySelector('.ai-sheet-body');
      body.innerHTML = '<div class="ai-sheet-error">Couldn’t load overview: ' + escapeHtml(msg) + '</div>';
      _scrollSheetToTop(overlay);
    }

    // Light markdown-ish renderer for AI responses. Supports **bold**, bullet
    // lines starting with - or *, and paragraph breaks. Anything else passes
    // through as escaped plain text.
    function formatAiResponse(text) {
      const escaped = escapeHtml(String(text || ''));
      // Bold
      let html = escaped.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      // Single-asterisk italic (only when not adjacent to other asterisks)
      html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      // Group consecutive bullet lines into <ul><li>...
      const out = [];
      const blocks = html.split(/\n{2,}/);
      for (const block of blocks) {
        const ls = block.split(/\n/);
        const bulletRe = /^\s*[-•*]\s+(.+)$/;
        if (ls.every(l => bulletRe.test(l) || !l.trim())) {
          const items = ls.filter(l => l.trim()).map(l => '<li>' + l.replace(bulletRe, '$1') + '</li>').join('');
          out.push('<ul>' + items + '</ul>');
        } else {
          out.push('<p>' + ls.join('<br>') + '</p>');
        }
      }
      return out.join('');
    }

    // Delete the currently-open issue after a confirmation step.
    async function deleteCurrentIssue() {
      const issue = state.issue;
      if (!issue) return;
      const id = issue.id || issue.number;
      if (!id) return;
      const num = issue.number != null ? issue.number : id;
      const ok = await confirmAction({
        title: 'Delete #' + num + '?',
        message: 'This permanently deletes the ticket from Pylon. This cannot be undone.',
        confirmLabel: 'Delete',
        danger: true,
      });
      if (!ok) return;
      try {
        await Pylon.deleteIssue(id);
        // Remove from local caches so the inbox reflects the change immediately
        const matches = function (i) { return (i.id || i.number) === (issue.id || issue.number); };
        if (Array.isArray(state.allIssues)) state.allIssues = state.allIssues.filter(function (i) { return !matches(i); });
        if (Array.isArray(state.issues))    state.issues    = state.issues.filter(function (i) { return !matches(i); });
        state.issue = null;
        state.messages = [];
        toast('Ticket #' + num + ' deleted', 'success');
        if (window.__buzz) window.__buzz(15);
        navigate('list');
      } catch (e) {
        toast('Delete failed: ' + friendlyError(e), 'error');
      }
    }

    // ============ Bulk select ============
    // Long-press a card to enter selection mode; subsequent taps toggle
    // selection. Bottom action bar offers Delete / Change status / Add tag,
    // each running serially with a 3.5s pacing delay so we stay under
    // Pylon's 20/min rate limit. Live progress toast while a batch runs.

    state.selectionMode = false;
    state.selectedIssueIds = new Set();

    function enterSelectionMode(firstCardId) {
      state.selectionMode = true;
      state.selectedIssueIds = new Set();
      if (firstCardId) state.selectedIssueIds.add(String(firstCardId));
      document.documentElement.classList.add('is-selection-mode');
      // Highlight the first-selected card immediately.
      if (firstCardId) {
        const card = document.querySelector('.issue-card[data-id="' + CSS.escape(String(firstCardId)) + '"]');
        if (card) card.classList.add('is-selected');
      }
      showBulkActionBar();
      if (window.__buzz) window.__buzz(15);
    }

    function exitSelectionMode() {
      state.selectionMode = false;
      state.selectedIssueIds = new Set();
      document.documentElement.classList.remove('is-selection-mode');
      document.querySelectorAll('.issue-card.is-selected').forEach(c => c.classList.remove('is-selected'));
      hideBulkActionBar();
    }

    function toggleCardSelection(card) {
      const id = card && card.dataset.id;
      if (!id) return;
      if (state.selectedIssueIds.has(String(id))) {
        state.selectedIssueIds.delete(String(id));
        card.classList.remove('is-selected');
      } else {
        state.selectedIssueIds.add(String(id));
        card.classList.add('is-selected');
      }
      updateBulkActionBar();
      if (state.selectedIssueIds.size === 0) exitSelectionMode();
    }

    function showBulkActionBar() {
      if (document.getElementById('bulkActionBar')) return;
      const bar = document.createElement('div');
      bar.id = 'bulkActionBar';
      bar.className = 'bulk-action-bar';
      bar.innerHTML =
        '<div class="bulk-bar-row">' +
          '<button type="button" class="bulk-cancel-btn" id="bulkCancelBtn" aria-label="Cancel selection">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
          '<span class="bulk-count" id="bulkCount">1 selected</span>' +
          '<div class="bulk-actions">' +
            '<button type="button" class="bulk-action-btn" id="bulkStatusBtn" title="Change status">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>' +
              '<span>Status</span>' +
            '</button>' +
            '<button type="button" class="bulk-action-btn" id="bulkTagBtn" title="Add tag">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>' +
              '<span>Tag</span>' +
            '</button>' +
            '<button type="button" class="bulk-action-btn bulk-action-danger" id="bulkDeleteBtn" title="Delete selected">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>' +
              '<span>Delete</span>' +
            '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(bar);
      document.getElementById('bulkCancelBtn').addEventListener('click', exitSelectionMode);
      document.getElementById('bulkDeleteBtn').addEventListener('click', bulkDeleteSelected);
      document.getElementById('bulkStatusBtn').addEventListener('click', bulkChangeStatus);
      document.getElementById('bulkTagBtn').addEventListener('click', bulkAddTag);
      requestAnimationFrame(() => bar.classList.add('is-visible'));
      updateBulkActionBar();
    }
    function hideBulkActionBar() {
      const bar = document.getElementById('bulkActionBar');
      if (!bar) return;
      bar.classList.remove('is-visible');
      setTimeout(() => { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 200);
    }
    function updateBulkActionBar() {
      const el = document.getElementById('bulkCount');
      if (!el) return;
      const n = state.selectedIssueIds.size;
      el.textContent = n + ' selected';
    }

    // Long-press detection on inbox cards. touchstart starts a 500ms timer;
    // if the user lifts or moves more than ~10px before it fires, the press
    // is cancelled (treated as a tap). When the timer fires, selection mode
    // activates and the pressed card is selected.
    function attachLongPressHandlers(container) {
      if (!container) return;
      let timer = null;
      let startX = 0, startY = 0;
      let activated = false;
      container.addEventListener('touchstart', (e) => {
        const card = e.target.closest('.issue-card');
        if (!card) return;
        if (state.selectionMode) return; // already in selection mode — taps handle toggle
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        activated = false;
        timer = setTimeout(() => {
          activated = true;
          enterSelectionMode(card.dataset.id);
          timer = null;
        }, 500);
      }, { passive: true });
      container.addEventListener('touchmove', (e) => {
        if (!timer) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 10 || dy > 10) {
          clearTimeout(timer);
          timer = null;
        }
      }, { passive: true });
      container.addEventListener('touchend', () => {
        if (timer) { clearTimeout(timer); timer = null; }
      });
      container.addEventListener('touchcancel', () => {
        if (timer) { clearTimeout(timer); timer = null; }
      });
    }

    // Paced batch operation runner. Used by all three bulk actions.
    // ids: array of issue id/number strings
    // label: progress prefix ('Deleting' / 'Updating' / 'Tagging')
    // operation: async fn called per id; throws on failure
    async function runBatchOperation(ids, label, operation) {
      const total = ids.length;
      if (!total) return { done: 0, failed: 0 };
      const DELAY_MS = 3500; // ~17/min, safely under Pylon's 20/min limit
      let done = 0, failed = 0;
      const show = () => {
        const msg = label + ' ' + (done + failed) + '/' + total +
          (failed ? ' (' + failed + ' failed)' : '');
        try { toast(msg, failed && !done ? 'error' : 'success'); } catch {}
      };
      show();
      for (let i = 0; i < ids.length; i++) {
        try {
          await operation(ids[i]);
          done++;
        } catch (e) {
          failed++;
          if (e && e.status === 429) {
            // Wait out the rate-limit window before continuing.
            await new Promise(r => setTimeout(r, 60_000));
          }
        }
        show();
        if (i < ids.length - 1) {
          await new Promise(r => setTimeout(r, DELAY_MS));
        }
      }
      const finalMsg = label + ' done: ' + done + ' succeeded' +
        (failed ? ', ' + failed + ' failed' : '');
      try { toast(finalMsg, failed ? 'error' : 'success'); } catch {}
      return { done, failed };
    }

    // ---------- Bulk Delete ----------
    async function bulkDeleteSelected() {
      const ids = Array.from(state.selectedIssueIds);
      const count = ids.length;
      if (!count) return;
      const ok = await confirmAction({
        title: 'Delete ' + count + ' ticket' + (count === 1 ? '' : 's') + '?',
        message: 'Permanently deletes ' + count + ' ticket' + (count === 1 ? '' : 's') +
          ' from Pylon. This cannot be undone.\n\n' +
          'At Pylon\'s rate limit this will take about ' + Math.ceil(count * 3.5) + ' seconds.',
        confirmLabel: 'Delete ' + count,
        danger: true,
      });
      if (!ok) return;
      await runBatchOperation(ids, 'Deleting', async (id) => {
        await Pylon.deleteIssue(id);
        const match = (i) => String(i.id || i.number) === String(id);
        state.allIssues = state.allIssues.filter(i => !match(i));
        state.issues = state.issues.filter(i => !match(i));
      });
      exitSelectionMode();
      try { reapplyFilters(); saveIssuesCache(); } catch {}
    }

    // ---------- Bulk Change Status ----------
    function bulkChangeStatus() {
      const count = state.selectedIssueIds.size;
      if (!count) return;
      const statuses = [
        { value: 'new', label: 'New' },
        { value: 'waiting_on_you', label: 'Waiting on you' },
        { value: 'waiting_on_customer', label: 'Waiting on customer' },
        { value: 'on_hold', label: 'On hold' },
        { value: 'closed', label: 'Closed' },
      ];
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML =
        '<div class="confirm-modal filter-sheet" role="dialog">' +
          '<h3>Change status for ' + count + ' ticket' + (count === 1 ? '' : 's') + '</h3>' +
          '<p class="date-hint">Roughly ' + Math.ceil(count * 3.5) + 's at Pylon\'s rate limit.</p>' +
          '<ul class="filter-list">' +
            statuses.map(s =>
              '<li><button type="button" class="filter-row-btn" data-status="' + s.value + '">' +
                '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
                '<span class="filter-row-label">' + escapeHtml(s.label) + '</span>' +
              '</button></li>'
            ).join('') +
          '</ul>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="confirm-cancel" data-action="cancel">Cancel</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('is-open'));
      const close = () => {
        overlay.classList.remove('is-open');
        setTimeout(() => overlay.remove(), 160);
      };
      overlay.querySelector('[data-action="cancel"]').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelectorAll('.filter-row-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const target = btn.dataset.status;
          close();
          const ids = Array.from(state.selectedIssueIds);
          await runBatchOperation(ids, 'Updating status', async (id) => {
            await Pylon.updateIssue(id, { state: target });
            const issue = state.allIssues.find(i => String(i.id || i.number) === String(id));
            if (issue) issue.state = target;
          });
          exitSelectionMode();
          try { reapplyFilters(); saveIssuesCache(); } catch {}
        });
      });
    }

    // ---------- Bulk Add Tag ----------
    async function bulkAddTag() {
      const count = state.selectedIssueIds.size;
      if (!count) return;
      // Make sure the tag list is loaded so the picker has options.
      try { await ensureTagsLoaded(); } catch {}
      const existing = Array.isArray(tagCache.tags) ? tagCache.tags : [];

      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML =
        '<div class="confirm-modal filter-sheet" role="dialog">' +
          '<h3>Add tag to ' + count + ' ticket' + (count === 1 ? '' : 's') + '</h3>' +
          '<p class="date-hint">Roughly ' + Math.ceil(count * 3.5) + 's at Pylon\'s rate limit.</p>' +
          '<input type="search" class="filter-search" id="bulkTagSearch" placeholder="Pick or type a new tag…" autocomplete="off"/>' +
          '<ul class="filter-list" id="bulkTagList">' +
            existing.map(t => {
              const name = tagNameOf(t) || '';
              return '<li><button type="button" class="filter-row-btn" data-tag="' + escapeAttr(name) + '">' +
                '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
                '<span class="filter-row-label">' + escapeHtml(name) + '</span>' +
              '</button></li>';
            }).join('') +
          '</ul>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="confirm-cancel" data-action="cancel">Cancel</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('is-open'));
      const $search = overlay.querySelector('#bulkTagSearch');
      const $list = overlay.querySelector('#bulkTagList');
      const close = () => {
        overlay.classList.remove('is-open');
        setTimeout(() => overlay.remove(), 160);
      };
      overlay.querySelector('[data-action="cancel"]').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

      // Filter list as user types; also show a "Create new tag" row if the
      // typed value doesn't match an existing tag.
      $search.addEventListener('input', () => {
        const q = $search.value.trim().toLowerCase();
        const filtered = !q ? existing : existing.filter(t =>
          (tagNameOf(t) || '').toLowerCase().includes(q));
        const matchesExact = filtered.some(t => (tagNameOf(t) || '').toLowerCase() === q);
        $list.innerHTML = filtered.map(t => {
          const name = tagNameOf(t) || '';
          return '<li><button type="button" class="filter-row-btn" data-tag="' + escapeAttr(name) + '">' +
            '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
            '<span class="filter-row-label">' + escapeHtml(name) + '</span>' +
          '</button></li>';
        }).join('') + (q && !matchesExact
          ? '<li><button type="button" class="filter-row-btn" data-tag="' + escapeAttr($search.value.trim()) + '" data-new="1">' +
              '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>' +
              '<span class="filter-row-label">Create new tag &ldquo;' + escapeHtml($search.value.trim()) + '&rdquo;</span>' +
            '</button></li>'
          : '');
      });

      $list.addEventListener('click', async (e) => {
        const btn = e.target.closest('.filter-row-btn');
        if (!btn) return;
        const tagName = btn.dataset.tag;
        if (!tagName) return;
        close();
        const ids = Array.from(state.selectedIssueIds);
        await runBatchOperation(ids, 'Tagging', async (id) => {
          const issue = state.allIssues.find(i => String(i.id || i.number) === String(id));
          const tags = Array.isArray(issue && issue.tags) ? issue.tags : [];
          const names = tags.map(t => typeof t === 'string' ? t : (t && (t.name || t.value || t.label))).filter(Boolean);
          if (names.includes(tagName)) return; // already tagged
          names.push(tagName);
          await Pylon.updateIssue(id, { tags: names });
          if (issue) issue.tags = names.slice();
        });
        exitSelectionMode();
        try { reapplyFilters(); saveIssuesCache(); } catch {}
      });
    }

    // ============ Image lightbox ============
    // Single delegated click handler — any tap on an image inside a message
    // body or an attachment thumbnail opens the lightbox.
    document.addEventListener('click', function (e) {
      const img = e.target && e.target.closest
        ? e.target.closest('.msg-body img, .att-image img')
        : null;
      if (!img) return;
      // Suppress any wrapping <a href="...tracker..."> link
      e.preventDefault();
      e.stopPropagation();
      openLightbox(img.currentSrc || img.src, img.alt || '');
    }, true);

    let lightboxEl = null;
    let lightboxPrevOverflow = '';
    function openLightbox(src, alt) {
      if (!src) return;
      closeLightbox(); // close any previous instance first
      const wrap = document.createElement('div');
      wrap.className = 'lightbox';
      wrap.setAttribute('role', 'dialog');
      wrap.setAttribute('aria-modal', 'true');
      wrap.setAttribute('aria-label', 'Image preview');
      wrap.innerHTML =
        '<button type="button" class="lightbox-close" aria-label="Close">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
        ' stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
        '<div class="lightbox-img-wrap">' +
          '<img alt="' + escapeAttr(alt) + '" draggable="false" />' +
        '</div>' +
        '<a class="lightbox-open-orig" href="' + escapeAttr(src) + '"' +
        ' target="_blank" rel="noopener noreferrer">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
        ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>' +
        '<polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        '<span>Open in browser</span></a>';
      const imgWrap = wrap.querySelector('.lightbox-img-wrap');
      const img = wrap.querySelector('img');
      img.src = src;
      document.body.appendChild(wrap);
      lightboxEl = wrap;
      lightboxPrevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';

      // ----- Pinch zoom + pan + double-tap -----
      let scale = 1, tx = 0, ty = 0;
      let startScale = 1, startTx = 0, startTy = 0;
      let startDist = 0, startMid = { x: 0, y: 0 };
      let panAnchor = null;
      let lastTapAt = 0;

      function applyT() {
        img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      }
      function snapReset(animate) {
        scale = 1; tx = 0; ty = 0;
        if (animate) {
          img.style.transition = 'transform .22s ease';
          applyT();
          setTimeout(function () { img.style.transition = ''; }, 240);
        } else {
          applyT();
        }
      }
      function distOf(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }
      function midOf(t1, t2) {
        return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      }

      imgWrap.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) {
          e.preventDefault();
          startScale = scale;
          startTx = tx; startTy = ty;
          startDist = distOf(e.touches[0], e.touches[1]);
          startMid  = midOf(e.touches[0], e.touches[1]);
          panAnchor = null;
        } else if (e.touches.length === 1 && scale > 1) {
          panAnchor = { x: e.touches[0].clientX - tx, y: e.touches[0].clientY - ty };
        }
      }, { passive: false });

      imgWrap.addEventListener('touchmove', function (e) {
        if (e.touches.length === 2 && startDist > 0) {
          e.preventDefault();
          const d = distOf(e.touches[0], e.touches[1]);
          const m = midOf(e.touches[0], e.touches[1]);
          // Scale clamped to [1, 6]
          scale = Math.max(1, Math.min(6, startScale * (d / startDist)));
          // Pan by midpoint movement so the gesture feels anchored under fingers
          tx = startTx + (m.x - startMid.x);
          ty = startTy + (m.y - startMid.y);
          applyT();
        } else if (e.touches.length === 1 && scale > 1 && panAnchor) {
          e.preventDefault();
          tx = e.touches[0].clientX - panAnchor.x;
          ty = e.touches[0].clientY - panAnchor.y;
          applyT();
        }
      }, { passive: false });

      imgWrap.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) startDist = 0;
        if (e.touches.length > 0) return;
        panAnchor = null;
        // If barely zoomed (e.g. accidental pinch), snap back
        if (scale < 1.05) {
          snapReset(true);
          lastTapAt = 0;
          return;
        }
        // Double-tap toggle: zoom out if zoomed, zoom in if not
        const now = Date.now();
        if (now - lastTapAt < 280 && e.changedTouches.length === 1) {
          img.style.transition = 'transform .22s ease';
          if (scale > 1) { scale = 1; tx = 0; ty = 0; }
          else { scale = 2.5; tx = 0; ty = 0; }
          applyT();
          setTimeout(function () { img.style.transition = ''; }, 240);
          lastTapAt = 0;
        } else {
          lastTapAt = now;
        }
      });

      // Desktop: scroll wheel zooms (handy for testing in a browser)
      imgWrap.addEventListener('wheel', function (e) {
        if (!e.ctrlKey && Math.abs(e.deltaY) < 5) return;
        e.preventDefault();
        const delta = -e.deltaY * 0.004;
        scale = Math.max(1, Math.min(6, scale + delta));
        if (scale === 1) { tx = 0; ty = 0; }
        applyT();
      }, { passive: false });

      // Tap-to-close — only when not zoomed; never closes when tapping the
      // image itself or the open-in-browser link.
      wrap.addEventListener('click', function (ev) {
        if (ev.target.closest('.lightbox-close')) { closeLightbox(); return; }
        if (ev.target.closest('img') || ev.target.closest('.lightbox-open-orig')) return;
        if (scale > 1) return;
        closeLightbox();
      });

      // Escape closes (mainly for desktop / keyboard users)
      document.addEventListener('keydown', onLightboxKey);

      // Fade in
      requestAnimationFrame(function () { wrap.classList.add('is-open'); });
    }

    function closeLightbox() {
      if (!lightboxEl) return;
      const el = lightboxEl;
      lightboxEl = null;
      document.removeEventListener('keydown', onLightboxKey);
      document.body.style.overflow = lightboxPrevOverflow;
      el.classList.remove('is-open');
      // Wait for fade-out, then remove
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
    }
    function onLightboxKey(e) { if (e.key === 'Escape') closeLightbox(); }

    // ============ Local cache (localStorage) ============
    // Persist the heaviest API responses across sessions so the inbox can
    // render in <100ms on relaunch instead of waiting for slow network
    // round-trips. The CORS proxy and Pylon itself sometimes take 30-100s
    // for /contacts and /accounts pages — caching turns that into a one-time
    // cost per ~day rather than every cold start.
    const CACHE_KEYS = {
      issues:   'pylonMobile.cache.issues.v1',
      accounts: 'pylonMobile.cache.accounts.v1',
      people:   'pylonMobile.cache.people.v1',
      previews: 'pylonMobile.cache.previews.v1',
      me:       'pylonMobile.cache.me.v1',
    };
    // Per-cache TTL. Accounts, contacts and /me change rarely (you don't add
    // new customers every day), so we let them live for a week between forced
    // refreshes. Issues and body previews change constantly so they're 24h.
    const CACHE_TTL_DAY = 24 * 60 * 60 * 1000;
    const CACHE_TTL_WEEK = 7 * 24 * 60 * 60 * 1000;
    const CACHE_TTL_BY_KEY = {
      [CACHE_KEYS.issues]:   CACHE_TTL_DAY,
      [CACHE_KEYS.accounts]: CACHE_TTL_WEEK,
      [CACHE_KEYS.people]:   CACHE_TTL_WEEK,
      [CACHE_KEYS.me]:       CACHE_TTL_WEEK,
      [CACHE_KEYS.previews]: CACHE_TTL_DAY,
    };

    function _writeCache(key, payload) {
      try {
        localStorage.setItem(key, JSON.stringify({ at: Date.now(), data: payload }));
      } catch {
        // Quota exceeded / disabled — silent fail.
      }
    }
    function _readCache(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        const ttl = CACHE_TTL_BY_KEY[key] || CACHE_TTL_DAY;
        if (!parsed || (Date.now() - (parsed.at || 0)) > ttl) return null;
        return parsed.data;
      } catch { return null; }
    }

    // ============ Cache inspection + clearing ============
    // Used by Settings → Advanced. Reports total localStorage bytes used by
    // our cache keys so the user can see whether caches are bloating.
    function cacheStats() {
      const out = { keys: [], totalBytes: 0 };
      for (const [name, key] of Object.entries(CACHE_KEYS)) {
        let bytes = 0, age = null;
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            bytes = raw.length;
            try {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.at) age = Date.now() - parsed.at;
            } catch {}
          }
        } catch {}
        out.keys.push({ name, key, bytes, age });
        out.totalBytes += bytes;
      }
      return out;
    }
    function clearAllCaches() {
      for (const key of Object.values(CACHE_KEYS)) {
        try { localStorage.removeItem(key); } catch {}
      }
      // Also nuke in-memory state so the next render is truly cold.
      state.allIssues = [];
      state.issues = [];
      state.accounts = [];
      state.people = [];
      try { localStorage.removeItem('pylonMobile.netlog.v1'); } catch {}
    }
    function fmtBytes(n) {
      if (!n) return '0 B';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(2) + ' MB';
    }
    function fmtAge(ms) {
      if (ms == null) return 'empty';
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      const d = Math.floor(h / 24);
      return d + 'd ago';
    }

    // Strip an issue record down to the fields the inbox actually reads.
    // Pylon's full /issues response includes things like body_html (kilobytes
    // per ticket), full attachment lists, etc. — none of which are used in
    // the cards. Trimming before caching cuts the issues cache by ~70%.
    // When the user opens a ticket, loadIssueDetail() fetches the full record
    // fresh anyway, so nothing is lost.
    function _slimIssue(i) {
      if (!i || typeof i !== 'object') return i;
      return {
        id: i.id,
        number: i.number,
        title: i.title,
        subject: i.subject,
        state: i.state,
        status: i.status,
        created_at: i.created_at,
        updated_at: i.updated_at,
        // requester/account/contact: keep only id+name+email so cards can show
        // them and filters still work; drop nested heavy fields.
        requester: i.requester ? {
          id: i.requester.id,
          name: i.requester.name,
          email: i.requester.email,
        } : undefined,
        contact: i.contact ? {
          id: i.contact.id,
          name: i.contact.name,
          email: i.contact.email,
        } : undefined,
        account: i.account ? {
          id: i.account.id,
          name: i.account.name,
          title: i.account.title,
        } : undefined,
        account_id: i.account_id,
        requester_id: i.requester_id,
        assignee_id: i.assignee_id,
        assignee: i.assignee ? {
          id: i.assignee.id,
          name: i.assignee.name,
          email: i.assignee.email,
        } : undefined,
        tags: Array.isArray(i.tags)
          ? i.tags.map(t => typeof t === 'string' ? t : { name: t.name, id: t.id })
          : undefined,
      };
    }

    // Cap on the serialized cache size. localStorage on iOS is typically
    // 5MB per origin; we stay well under to leave room for other caches
    // and avoid edge-case quota errors.
    const ISSUES_CACHE_MAX_BYTES = 2_500_000; // ~2.5 MB

    function saveIssuesCache() {
      let issues = (state.allIssues || []).map(_slimIssue);
      let payload = JSON.stringify({
        issues,
        dateFrom: state.filter.dateFrom,
        dateTo: state.filter.dateTo,
      });
      // If the payload would exceed our cap, drop oldest issues until it fits.
      // Issues are sorted newest-first elsewhere; we trim from the tail.
      let dropped = 0;
      while (payload.length > ISSUES_CACHE_MAX_BYTES && issues.length > 50) {
        const trimTo = Math.max(50, Math.floor(issues.length * 0.8));
        dropped += issues.length - trimTo;
        issues = issues.slice(0, trimTo);
        payload = JSON.stringify({
          issues,
          dateFrom: state.filter.dateFrom,
          dateTo: state.filter.dateTo,
        });
      }
      _writeCache(CACHE_KEYS.issues, { issues, dateFrom: state.filter.dateFrom, dateTo: state.filter.dateTo });
      if (dropped > 0) {
        // Surface in the net log so the user can see if the cache is being
        // trimmed. Not a toast — this is informational.
        try {
          logCall({
            method: 'CACHE', path: 'issues',
            status: 200, ok: true, ms: 0,
            excerpt: 'trimmed ' + dropped + ' older issues to fit ' +
              Math.round(ISSUES_CACHE_MAX_BYTES / 1024) + ' KB cap',
          });
        } catch {}
      }
    }
    function loadIssuesCache() {
      const c = _readCache(CACHE_KEYS.issues);
      if (!c || !Array.isArray(c.issues) || !c.issues.length) return false;
      // Only use if the date window matches the current filter, otherwise the
      // user would see issues that don't belong in their window.
      if (c.dateFrom !== state.filter.dateFrom || c.dateTo !== state.filter.dateTo) return false;
      state.allIssues = c.issues;
      return true;
    }

    // Pylon returns ~30-50 fields per account but we only use 4-5 of them in
    // the UI (account name in cards, domain in filter). Stripping the rest
    // before caching cuts localStorage usage by ~80% without losing anything
    // the app actually reads. Pylon doesn't support server-side field
    // selection so the wire payload is unchanged — this is purely about
    // what we persist.
    function _slimAccount(a) {
      if (!a || typeof a !== 'object') return a;
      return {
        id: a.id,
        name: a.name,
        title: a.title,
        display_name: a.display_name,
        domain: a.domain,
      };
    }
    function _slimContact(c) {
      if (!c || typeof c !== 'object') return c;
      return { id: c.id, name: c.name, email: c.email };
    }
    function _slimUser(u) {
      if (!u || typeof u !== 'object') return u;
      return { id: u.id, name: u.name, email: u.email };
    }

    function saveAccountsCache() {
      const slim = {};
      for (const id in accountCache.byId) slim[id] = _slimAccount(accountCache.byId[id]);
      _writeCache(CACHE_KEYS.accounts, slim);
    }
    function loadAccountsCache() {
      const c = _readCache(CACHE_KEYS.accounts);
      if (!c || typeof c !== 'object') return false;
      accountCache.byId = c;
      accountCache.loaded = true;
      return true;
    }

    function savePeopleCache() {
      const slimUsers = {};
      for (const id in peopleCache.users) slimUsers[id] = _slimUser(peopleCache.users[id]);
      const slimContacts = {};
      for (const id in peopleCache.contacts) slimContacts[id] = _slimContact(peopleCache.contacts[id]);
      _writeCache(CACHE_KEYS.people, { users: slimUsers, contacts: slimContacts });
    }
    function loadPeopleCache() {
      const c = _readCache(CACHE_KEYS.people);
      if (!c) return false;
      peopleCache.users = c.users || {};
      peopleCache.contacts = c.contacts || {};
      peopleCache.loaded = true;
      return true;
    }

    function savePreviewsCache() {
      // issueBodyPreviewCache can be large; trim oldest entries before saving.
      const keys = Object.keys(issueBodyPreviewCache || {});
      const trimmed = {};
      // Save at most the last 500 previews — bounded localStorage usage.
      for (const k of keys.slice(-500)) trimmed[k] = issueBodyPreviewCache[k];
      _writeCache(CACHE_KEYS.previews, trimmed);
    }
    function loadPreviewsCache() {
      const c = _readCache(CACHE_KEYS.previews);
      if (!c || typeof c !== 'object') return false;
      Object.assign(issueBodyPreviewCache, c);
      return true;
    }

    // /me caching — state.me is used for the "Me" assignee filter and the
    // settings page. Caching it lets subsequent launches skip the /me call
    // entirely (a fresh one runs in background to update).
    function saveMeCache() { if (state.me) _writeCache(CACHE_KEYS.me, state.me); }
    function loadMeCache() {
      const c = _readCache(CACHE_KEYS.me);
      if (!c) return false;
      state.me = c;
      return true;
    }

    // ============ Boot ============
    if (!cfg.apiKey) {
      render();
    } else {
      // Restore caches FIRST so the first paint shows real data instead of a
      // blank screen. Everything below runs in the background.
      const haveIssues = loadIssuesCache();
      loadAccountsCache();
      loadPeopleCache();
      loadPreviewsCache();
      loadMeCache();
      if (haveIssues) {
        try { reapplyFilters(); } catch {}
      } else {
        // No cache — set the loading flag so renderList shows a spinner
        // immediately rather than flashing "No issues found" before
        // loadIssues' first network call fires.
        state.loading = true;
      }
      // Render IMMEDIATELY — don't block on /me. Previously this code waited
      // for Pylon.me() to resolve before calling render(), which meant a 27s
      // /me request (slow proxy / cold network) left the user staring at a
      // blank screen for 27s before even seeing the loading spinner.
      render();
      // Now fire /me in background. It updates state.me when it resolves and
      // re-renders — but the inbox is already showing by then.
      Pylon.me().then(me => {
        state.me = (me && (me.data || me)) || state.me || null;
        try { saveMeCache(); } catch {}
        // Only re-render if something visible depends on /me changing.
        if (state.view === 'settings') render();
      }).catch(() => {});
      // Use silent refresh if we already restored data — that's a single API
      // call (first page only) instead of a full pagination, so we don't
      // re-burn the rate-limit budget every cold start.
      loadIssues({ silent: haveIssues });
    }

    // ============ PWA: service worker + install handling ============
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.navigator.standalone === true;

    // Add a class so we can hide install hints when already installed
    if (isStandalone) document.documentElement.classList.add('is-standalone');

    // Register service worker (file:// won't allow this — only when served over http(s))
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Detect new versions and offer to refresh
          function watchForUpdate(installing) {
            if (!installing) return;
            installing.addEventListener('statechange', () => {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(reg);
              }
            });
          }
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg);
          reg.addEventListener('updatefound', () => watchForUpdate(reg.installing));
        }).catch(() => {});

        // When the active SW changes, reload to pick up the new shell.
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }

    function showUpdateBanner(reg) {
      // Build a small bottom banner so the user can choose to refresh
      let bar = document.getElementById('pwa-update-bar');
      if (bar) return;
      bar = document.createElement('div');
      bar.id = 'pwa-update-bar';
      bar.className = 'pwa-update-bar';
      bar.innerHTML = `
        <span>A new version is available.</span>
        <button type="button" id="pwa-update-refresh">Refresh</button>
        <button type="button" id="pwa-update-dismiss" aria-label="Dismiss">×</button>
      `;
      document.body.appendChild(bar);
      document.getElementById('pwa-update-refresh').onclick = () => {
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      };
      document.getElementById('pwa-update-dismiss').onclick = () => bar.remove();
    }

    // Android / desktop Chrome: capture the install prompt and offer it ourselves
    let deferredInstall = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      maybeShowAndroidInstallBanner();
    });
    window.addEventListener('appinstalled', () => {
      deferredInstall = null;
      const b = document.getElementById('pwa-install-bar');
      if (b) b.remove();
    });

    function maybeShowAndroidInstallBanner() {
      if (!deferredInstall) return;
      if (isStandalone) return;
      if (sessionStorage.getItem('pwa-install-dismissed') === '1') return;
      let bar = document.getElementById('pwa-install-bar');
      if (bar) return;
      bar = document.createElement('div');
      bar.id = 'pwa-install-bar';
      bar.className = 'pwa-install-bar';
      bar.innerHTML = `
        <span>Install Pylon Mobile to your home screen for a faster experience.</span>
        <button type="button" id="pwa-install-yes">Install</button>
        <button type="button" id="pwa-install-no" aria-label="Dismiss">×</button>
      `;
      document.body.appendChild(bar);
      document.getElementById('pwa-install-yes').onclick = async () => {
        const e = deferredInstall;
        deferredInstall = null;
        bar.remove();
        if (e) e.prompt();
      };
      document.getElementById('pwa-install-no').onclick = () => {
        sessionStorage.setItem('pwa-install-dismissed', '1');
        bar.remove();
      };
    }

    // iOS Safari: no beforeinstallprompt — show a one-off hint banner
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent || '') && !/crios|fxios|edgios/i.test(navigator.userAgent || '');
    if (isIos && !isStandalone && !localStorage.getItem('pwa-ios-hint-dismissed')) {
      window.addEventListener('load', () => {
        const bar = document.createElement('div');
        bar.id = 'pwa-ios-hint';
        bar.className = 'pwa-install-bar';
        bar.innerHTML = `
          <span>
            Install: tap
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            then <strong>Add to Home Screen</strong>.
          </span>
          <button type="button" id="pwa-ios-hint-dismiss" aria-label="Dismiss">×</button>
        `;
        document.body.appendChild(bar);
        document.getElementById('pwa-ios-hint-dismiss').onclick = () => {
          localStorage.setItem('pwa-ios-hint-dismissed', '1');
          bar.remove();
        };
      });
    }

    // Light haptic feedback on key actions for native feel (Android only — iOS Safari ignores)
    window.__buzz = function (ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch {}
    };

    // Keyboard tracking — iOS 16.4+/Chrome 108+ honour
    // <meta viewport interactive-widget=resizes-content> and 100dvh shrinks for
    // the keyboard automatically. For older iOS we fall back to visualViewport
    // and expose --kb-inset (keyboard height) so the composer and main padding
    // can adjust. Without this the composer stays anchored to the layout-
    // viewport bottom, leaving dead space between it and the keyboard.
    (function trackKeyboard() {
      const vv = window.visualViewport;
      if (!vv) return;
      function update() {
        // Keyboard inset = the difference between the layout viewport bottom
        // and the visual viewport bottom (offsetTop accounts for any visual
        // viewport scroll/pan caused by focused inputs).
        const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty('--kb-inset', inset + 'px');
      }
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
      window.addEventListener('orientationchange', function () {
        // Defer until after iOS finishes the rotation
        setTimeout(update, 200);
      });
      update();
    })();

    // ============ Pull-to-refresh + background auto-refresh ============
    (function setupRefresh() {
      const PULL_THRESHOLD = 70;   // px past which release triggers refresh
      const MAX_PULL = 140;        // px ceiling on visible pull
      const POLL_MS = 30000;       // 30s background poll interval

      // Indicator UI
      const indicator = document.createElement('div');
      indicator.id = 'ptrIndicator';
      indicator.setAttribute('aria-hidden', 'true');
      indicator.innerHTML =
        '<svg class="ptr-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"' +
        ' stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>' +
        '<span class="ptr-spinner"></span>';
      document.body.appendChild(indicator);

      let startY = 0;
      let pulling = false;
      let refreshing = false;
      let currentPull = 0;

      function getScrollTop() {
        return (document.scrollingElement || document.documentElement).scrollTop ||
               document.body.scrollTop || 0;
      }

      function setIndicator(pull) {
        currentPull = pull;
        // -64px = hidden above viewport; 0px = at rest position; +N = pulled down
        const ty = Math.min(pull, MAX_PULL) - 64;
        indicator.style.transform = 'translate(-50%, ' + ty + 'px)';
        indicator.classList.toggle('ptr-ready', pull >= PULL_THRESHOLD);
      }

      function resetIndicator(animate) {
        indicator.style.transition = animate ? 'transform .2s ease' : 'none';
        setIndicator(0);
        if (animate) {
          setTimeout(function () { indicator.style.transition = 'none'; }, 220);
        }
      }

      // Allow refresh only on views that have data to refresh
      function canRefresh() {
        if (refreshing) return false;
        // Don't refresh while the user is mid-reply — silent refresh would wipe
        // their typed content.
        if (typeof isComposingActively === 'function' && isComposingActively()) return false;
        return state.view === 'list' ||
               (state.view === 'detail' && state.issue && state.issue.id);
      }

      async function triggerRefresh() {
        if (!canRefresh()) { resetIndicator(true); return; }
        refreshing = true;
        indicator.classList.add('ptr-refreshing');
        indicator.style.transition = 'transform .2s ease';
        indicator.style.transform = 'translate(-50%, ' + (PULL_THRESHOLD - 64) + 'px)';
        try {
          if (state.view === 'list') {
            await loadIssues({ silent: true });
          } else if (state.view === 'detail') {
            await loadIssueDetail(state.issue.id, { silent: true });
          }
        } catch (e) {
          // Errors are surfaced by the load functions themselves via state.error.
        } finally {
          refreshing = false;
          indicator.classList.remove('ptr-refreshing');
          resetIndicator(true);
        }
      }

      // Expose so other code paths can trigger a refresh too
      window.__refresh = triggerRefresh;

      document.addEventListener('touchstart', function (e) {
        if (refreshing) return;
        // Don't activate pull-to-refresh while the lightbox is open
        if (document.querySelector('.lightbox')) { pulling = false; return; }
        if (e.touches.length !== 1) { pulling = false; return; }
        if (getScrollTop() > 0) { pulling = false; return; }
        if (!canRefresh()) { pulling = false; return; }
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.style.transition = 'none';
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!pulling || refreshing) return;
        if (getScrollTop() > 0) {
          pulling = false;
          resetIndicator(true);
          return;
        }
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) {
          // Direction reversed; cancel pull
          resetIndicator(false);
          return;
        }
        // Suppress native iOS rubber-band so our indicator drives the motion
        if (e.cancelable) e.preventDefault();
        // Rubber-band damping so the pull feels resistive past the threshold
        const damped = dy <= PULL_THRESHOLD
          ? dy
          : PULL_THRESHOLD + (dy - PULL_THRESHOLD) * 0.4;
        setIndicator(damped);
      }, { passive: false });

      document.addEventListener('touchend', function () {
        if (!pulling || refreshing) return;
        pulling = false;
        if (currentPull >= PULL_THRESHOLD) {
          // Light haptic confirmation that refresh was triggered
          if (window.__buzz) window.__buzz(6);
          triggerRefresh();
        } else {
          resetIndicator(true);
        }
      });

      // Background auto-refresh — silent poll every 30s while the app is visible
      let pollTimer = null;
      function startPolling() {
        stopPolling();
        pollTimer = setInterval(function () {
          if (document.visibilityState !== 'visible') return;
          if (refreshing) return;
          if (!cfg.apiKey) return;
          // Skip polling while rate-limited — we already busted our budget,
          // hitting Pylon again would just refresh the 429 window.
          if (isRateLimited()) return;
          // Never poll while the user is mid-reply — avoiding the API call
          // saves rate-limit budget and avoids the editor wipe risk.
          if (isComposingActively()) return;
          if (state.view === 'list') {
            loadIssues({ silent: true }).catch(function () {});
          } else if (state.view === 'detail' && state.issue && state.issue.id) {
            loadIssueDetail(state.issue.id, { silent: true }).catch(function () {});
          }
        }, POLL_MS);
      }
      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          startPolling();
          // Also fire one immediate refresh when the app returns to foreground,
          // unless rate-limited / composing.
          if (cfg.apiKey && !refreshing && !isComposingActively() && !isRateLimited()) {
            if (state.view === 'list') loadIssues({ silent: true }).catch(function () {});
            else if (state.view === 'detail' && state.issue && state.issue.id) {
              loadIssueDetail(state.issue.id, { silent: true }).catch(function () {});
            }
          }
        } else {
          stopPolling();
        }
      });

      // Kick off polling once the page is ready
      if (cfg.apiKey) startPolling();
    })();

  })();
  </script>
</body>
</html>
