        root.innerHTML = `<div class="card" style="border-color: var(--danger-soft); background: var(--danger-soft); color: var(--danger);">
          <div style="font-weight: 600; margin-bottom: 6px;">Couldn't load this issue</div>
          <div class="small">${escapeHtml(state.error)}</div>
        </div>`;
        return;
      }
      const issue = state.issue || {};
      const title = issue.title || issue.subject || '(no subject)';
      const num = issue.number != null ? `#${issue.number}` : (issue.id || '').slice(0, 8);
      const stateStr = (issue.state || issue.status || '').toString();
      const requester = (issue.requester && (issue.requester.name || issue.requester.email))
        || (issue.contact && (issue.contact.name || issue.contact.email)) || '';
      const account = resolveAccountName(issue);
      const created = issue.created_at;

      const stateChips = ['new','waiting_on_you','waiting_on_customer','on_hold','closed'];
      root.innerHTML = `
        <div class="detail-header">
          <div class="issue-top" style="margin-bottom: 4px;">
            <span class="issue-num">${escapeHtml(num)}</span>
            ${stateStr ? renderStateBadge(stateStr) : ''}
          </div>
          <h1 class="detail-title">${escapeHtml(title)}</h1>
          <div class="detail-meta">
            ${requester ? `<span><strong>${escapeHtml(requester)}</strong></span>` : ''}
            ${account ? `<span>${escapeHtml(account)}</span>` : ''}
            ${created ? `<span>${escapeHtml(formatDate(created))}</span>` : ''}
          </div>

          <button type="button" class="ai-overview-btn" id="aiOverviewBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/>
              <path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>
            </svg>
            <span>Get AI Overview</span>
          </button>

          <div class="state-row-label">Change status</div>
          <div class="filter-bar" id="stateChips" style="margin-top:6px;">
            ${stateChips.map(s => `
              <button class="chip" data-state="${s}" aria-pressed="${stateStr === s}">${escapeHtml(prettyState(s))}</button>
            `).join('')}
          </div>

          <div class="state-row-label" style="margin-top:14px;">Tags</div>
          <div id="tagsSection" class="tags-section">${renderTagsSection()}</div>
        </div>

        <ul class="thread" id="thread">
          ${state.messages.map(renderMessage).join('') || `<div class="state-row faint">No messages yet</div>`}
        </ul>

        <div class="composer" id="composerWrap" data-open="false">
          <button type="button" class="composer-pill" id="composerOpenBtn">
            <span class="composer-pill-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </span>
            <span class="composer-pill-text" id="composerPillText">Write a reply…</span>
            <span class="composer-pill-draft" id="composerPillDraft" hidden>Draft</span>
          </button>
          <div class="composer-card card" id="composerCard" style="padding:0;" hidden>
            <div class="composer-header">
              <span class="composer-header-title" id="composerHeaderTitle">Reply</span>
              <button type="button" class="composer-close" id="composerCloseBtn" aria-label="Minimize composer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
            </div>
            <div id="recipientsBox" class="recipients-box" hidden></div>
            <div class="editor-toolbar" role="toolbar" aria-label="Formatting">
              <button type="button" class="tbtn" data-cmd="bold" title="Bold (Ctrl/⌘+B)"><b>B</b></button>
              <button type="button" class="tbtn" data-cmd="italic" title="Italic (Ctrl/⌘+I)"><i>I</i></button>
              <button type="button" class="tbtn" data-cmd="underline" title="Underline (Ctrl/⌘+U)"><span style="text-decoration:underline;">U</span></button>
              <button type="button" class="tbtn" data-cmd="strikeThrough" title="Strikethrough"><span style="text-decoration:line-through;">S</span></button>
              <span class="tbtn-divider"></span>
              <button type="button" class="tbtn" data-cmd="insertUnorderedList" title="Bulleted list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </button>
              <button type="button" class="tbtn" data-cmd="insertOrderedList" title="Numbered list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
              </button>
              <span class="tbtn-divider"></span>
              <button type="button" class="tbtn" data-action="link" title="Insert link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              </button>
              <button type="button" class="tbtn" data-cmd="formatBlock" data-arg="blockquote" title="Quote">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2-1 0-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 .999 0 1 0 1 1v1c0 1-1 2-2 2-1 0-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
              </button>
              <button type="button" class="tbtn" data-action="clear" title="Clear formatting">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><line x1="5" y1="20" x2="19" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
              </button>
            </div>
            <div id="replyEditor" class="editor" contenteditable="true" data-placeholder="Write a reply… (try Ctrl/⌘+B for bold)"></div>
            <div class="composer-actions">
              <button type="button" class="toggle" id="internalToggle" data-on="false" title="Internal note (visible to your team only)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span id="internalLabel">Public reply</span>
                <input type="checkbox" id="internalCheck" style="display:none" />
              </button>
              <button type="button" class="thread-chip" id="threadPickerBtn" hidden title="Choose which internal thread">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span id="threadPickerLabel">Default thread</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button type="button" class="composer-ai" id="aiRefineBtn" title="Refine with AI" aria-label="Refine draft with AI">
                <svg class="ai-sparkle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/>
                  <path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>
                </svg>
                <span class="ai-spinner" aria-hidden="true"></span>
              </button>
              <button type="button" class="composer-send" id="sendReply" disabled aria-label="Send reply">
                <span id="sendLabel">Send</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div id="threadPickerPanel" class="thread-picker" hidden></div>
          </div>
        </div>
      `;

      // State chips click handler
      const $stateChips = document.getElementById('stateChips');
      if ($stateChips) {
        $stateChips.addEventListener('click', (e) => {
          const btn = e.target.closest('.chip');
          if (!btn) return;
          const ns = btn.dataset.state;
          if (ns && ns !== stateStr) changeIssueState(ns);
        });
      }

      // AI Overview button — runs the whole thread through Groq for a summary
      const $aiOverview = document.getElementById('aiOverviewBtn');
      if ($aiOverview) $aiOverview.addEventListener('click', getAiOverview);

      // Tags section
      bindTagsSection();
      // Lazy-load the list of available tags in the background
      ensureTagsLoaded().then(() => { if (state.view === 'detail') patchTagsSection(); });

      const $composerWrap = document.getElementById('composerWrap');
      const $composerCard = document.getElementById('composerCard');
      const $composerOpenBtn = document.getElementById('composerOpenBtn');
      const $composerCloseBtn = document.getElementById('composerCloseBtn');
      const $composerPillText = document.getElementById('composerPillText');
      const $composerPillDraft = document.getElementById('composerPillDraft');
      const $composerHeaderTitle = document.getElementById('composerHeaderTitle');
      const $editor = document.getElementById('replyEditor');
      const $send = document.getElementById('sendReply');
      const $aiRefine = document.getElementById('aiRefineBtn');
      if ($aiRefine) $aiRefine.addEventListener('click', refineDraftWithAi);
      const $toggle = document.getElementById('internalToggle');
      const $check = document.getElementById('internalCheck');
      const $internalLabel = document.getElementById('internalLabel');
      const $sendLabel = document.getElementById('sendLabel');

      // Collapse / expand the composer. Default = collapsed pill at the bottom.
      function setComposerOpen(open) {
        $composerWrap.dataset.open = open ? 'true' : 'false';
        $composerCard.hidden = !open;
        $composerOpenBtn.hidden = open;
        if (open) {
          // Focus the editor a beat after the card appears
          setTimeout(() => $editor.focus(), 30);
          // Scroll the composer fully into view
          setTimeout(() => $composerCard.scrollIntoView({ block: 'end', behavior: 'smooth' }), 60);
        }
      }
      function updatePillText() {
        const isInternal = !!$check.checked;
        $composerPillText.textContent = isInternal ? 'Add internal note…' : 'Write a reply…';
        $composerHeaderTitle.textContent = isInternal ? 'Internal note' : 'Public reply';
        // Show draft indicator if there's any non-whitespace content
        const hasDraft = (($editor.innerText || '').replace(/​|\s/g, '').length > 0);
        $composerPillDraft.hidden = !hasDraft;
      }
      $composerOpenBtn.addEventListener('click', () => setComposerOpen(true));
      $composerCloseBtn.addEventListener('click', () => {
        setComposerOpen(false);
        updatePillText();
      });

      // Wire toolbar
      const $toolbar = document.querySelector('.editor-toolbar');
      $toolbar.addEventListener('mousedown', (e) => {
        // Prevent the editor from losing focus when clicking buttons
        if (e.target.closest('.tbtn')) e.preventDefault();
      });
      $toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('.tbtn');
        if (!btn) return;
        $editor.focus();
        const cmd = btn.dataset.cmd;
        const arg = btn.dataset.arg;
        const action = btn.dataset.action;
        if (action === 'link') {
          const url = window.prompt('Link URL', 'https://');
          if (url) document.execCommand('createLink', false, url);
        } else if (action === 'clear') {
          document.execCommand('removeFormat');
          document.execCommand('formatBlock', false, 'p');
        } else if (cmd) {
          document.execCommand(cmd, false, arg || null);
        }
        syncSendEnabled();
      });

      const $threadPickerBtn = document.getElementById('threadPickerBtn');
      const $threadPickerLabel = document.getElementById('threadPickerLabel');
      const $threadPickerPanel = document.getElementById('threadPickerPanel');
      const $recipientsBox = document.getElementById('recipientsBox');
      // Composer thread state: either null (default thread), an existing thread id, or { newName: '...' }
      let threadChoice = { kind: 'default' }; // 'default' | 'existing'(id, name) | 'new'(name)
      let recipients = gatherDefaultRecipients(issue, state.messages || []);
      let showCc = recipients.cc.length > 0;
      let showBcc = recipients.bcc.length > 0;

      function renderRecipients() {
        const isInternal = !!$check.checked;
        // Internal notes never need recipients
        $recipientsBox.hidden = isInternal;
        if (isInternal) return;

        const row = (label, key, list, visible, addLabel) => {
          if (!visible) return '';
          const chips = list.map((r, idx) => `
            <span class="rcpt-chip" title="${escapeAttr(r.email)}">
              <span class="rcpt-name">${escapeHtml(r.name || r.email)}</span>
              <button type="button" class="rcpt-remove" data-key="${key}" data-idx="${idx}" aria-label="Remove ${escapeAttr(r.email)}">×</button>
            </span>`).join('');
          return `
            <div class="rcpt-row">
              <span class="rcpt-label">${label}</span>
              <div class="rcpt-chips">
                ${chips}
                <button type="button" class="rcpt-add" data-key="${key}" title="Add recipient">+ Add</button>
              </div>
            </div>`;
        };

        const showLinks = !showCc || !showBcc
          ? `<div class="rcpt-toggles">
               ${!showCc ? '<button type="button" class="rcpt-toggle" data-toggle="cc">+ Cc</button>' : ''}
               ${!showBcc ? '<button type="button" class="rcpt-toggle" data-toggle="bcc">+ Bcc</button>' : ''}
             </div>` : '';

        $recipientsBox.innerHTML = `
          ${row('To', 'to', recipients.to, true)}
          ${row('Cc', 'cc', recipients.cc, showCc)}
          ${row('Bcc', 'bcc', recipients.bcc, showBcc)}
          ${showLinks}
        `;

        // Bind handlers
        $recipientsBox.querySelectorAll('.rcpt-remove').forEach(btn => {
          btn.onclick = (e) => {
            e.preventDefault();
            const key = btn.dataset.key;
            const idx = parseInt(btn.dataset.idx, 10);
            recipients[key].splice(idx, 1);
            renderRecipients();
          };
        });
        $recipientsBox.querySelectorAll('.rcpt-add').forEach(btn => {
          btn.onclick = (e) => {
            e.preventDefault();
            const key = btn.dataset.key;
            const v = window.prompt(`Add ${key.toUpperCase()} email address:`, '');
            if (!v) return;
            // Accept multiple separated by commas
            for (const part of v.split(/[,;]/)) {
              const email = part.trim();
              if (!email) continue;
              // Naive validation
              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) continue;
              if (!recipients[key].find(r => r.email.toLowerCase() === email.toLowerCase())) {
                recipients[key].push({ email, name: '' });
              }
            }
            renderRecipients();
          };
        });
        $recipientsBox.querySelectorAll('.rcpt-toggle').forEach(btn => {
          btn.onclick = (e) => {
            e.preventDefault();
            const k = btn.dataset.toggle;
            if (k === 'cc') showCc = true;
            if (k === 'bcc') showBcc = true;
            renderRecipients();
          };
        });
      }

      function threadChoiceLabel() {
        if (threadChoice.kind === 'existing') return threadChoice.name || 'Thread';
        if (threadChoice.kind === 'new') return `New: ${threadChoice.name}`;
        return 'Default thread';
      }

      function syncToggle() {
        const on = $check.checked;
        $toggle.dataset.on = on ? 'true' : 'false';
        $internalLabel.textContent = on ? 'Internal note' : 'Public reply';
        $sendLabel.textContent = on
          ? (threadChoice.kind === 'new' ? 'Post in new thread' : 'Post note')
          : 'Send';
        $threadPickerBtn.hidden = !on;
        $threadPickerLabel.textContent = threadChoiceLabel();
        $threadPickerBtn.dataset.on = (threadChoice.kind !== 'default') ? 'true' : 'false';
        if (!on) {
          $threadPickerPanel.hidden = true;
        }
        if (typeof updatePillText === 'function') updatePillText();
      }

      function renderThreadPicker() {
        const issueId = issue.id || issue.number;
        const threads = threadsByIssue[issueId] || [];
        const items = [
          `<button type="button" class="thread-option" data-thread-kind="default" aria-pressed="${threadChoice.kind === 'default'}">
             <span class="thread-dot"></span>
             <span>Default thread</span>
             <span class="thread-hint">posts to the issue's default internal thread</span>
           </button>`,
          ...threads.map(t => `
             <button type="button" class="thread-option" data-thread-kind="existing" data-thread-id="${escapeAttr(t.id || '')}" data-thread-name="${escapeAttr(t.name || 'Untitled')}" aria-pressed="${threadChoice.kind === 'existing' && threadChoice.id === t.id}">
               <span class="thread-dot"></span>
               <span>${escapeHtml(t.name || 'Untitled')}</span>
             </button>`),
          `<button type="button" class="thread-option thread-option-new" data-thread-kind="new" aria-pressed="${threadChoice.kind === 'new'}">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
             <span>${threadChoice.kind === 'new' ? `New: ${escapeHtml(threadChoice.name)}` : 'New thread…'}</span>
           </button>`,
        ];
        $threadPickerPanel.innerHTML = items.join('');
        $threadPickerPanel.querySelectorAll('.thread-option').forEach(btn => {
          btn.onclick = () => {
            const kind = btn.dataset.threadKind;
            if (kind === 'default') {
              threadChoice = { kind: 'default' };
            } else if (kind === 'existing') {
              threadChoice = { kind: 'existing', id: btn.dataset.threadId, name: btn.dataset.threadName };
            } else if (kind === 'new') {
              const name = window.prompt('Name this new internal thread:', threadChoice.kind === 'new' ? threadChoice.name : '');
              if (!name || !name.trim()) return;
              threadChoice = { kind: 'new', name: name.trim() };
            }
            $threadPickerPanel.hidden = true;
            syncToggle();
          };
        });
      }

      // Load threads in the background so the picker opens fast
      const issueIdForThreads = issue.id || issue.number;
      ensureThreadsLoaded(issueIdForThreads).then(() => {
        if ($threadPickerPanel && !$threadPickerPanel.hidden) renderThreadPicker();
      });
      function editorIsEmpty() {
        const text = ($editor.innerText || '').replace(/​|\s/g, '');
        return text.length === 0;
      }
      function syncSendEnabled() {
        $send.disabled = editorIsEmpty();
      }
      $toggle.addEventListener('click', (e) => {
        e.preventDefault();
        $check.checked = !$check.checked;
        if (!$check.checked) {
          threadChoice = { kind: 'default' };
          $threadPickerPanel.hidden = true;
        }
        syncToggle();
        renderRecipients();
      });
      $threadPickerBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const willShow = $threadPickerPanel.hidden;
        if (willShow) renderThreadPicker();
        $threadPickerPanel.hidden = !willShow;
      });
      $editor.addEventListener('input', () => { syncSendEnabled(); updatePillText(); });
      $editor.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $send.click(); }
      });
      syncToggle(); syncSendEnabled(); renderRecipients(); updatePillText();

      // If TO is still empty, async-resolve the customer contact and fill in.
      if (recipients.to.length === 0) {
        fillToFromContactIfMissing(state.messages || [], ({ email, name }) => {
          // Re-collect — recipients may have been populated meanwhile
          if (recipients.to.length === 0) {
            recipients.to.push({ email, name });
            renderRecipients();
          }
        });
      }

      // Pre-fill signature for email/widget public replies (skip chat-source issues)
      function shouldAddSignature() {
        const src = String((issue && issue.source) || '').toLowerCase();
        // Don't include if user is in internal note mode OR if source is a chat channel
        if ($check.checked) return false;
        if (src.includes('chat') || src.includes('slack') || src.includes('discord') || src.includes('teams')) return false;
        return true;
      }
      function installSignature() {
        const sig = (cfg.signature || '').trim();
        if (!sig) return;
        if (!shouldAddSignature()) return;
        // Only install once per composer open and only if editor is empty
        if (($editor.innerHTML || '').trim()) return;
        $editor.innerHTML = `<p><br></p><p>--</p>${sig}`;
        // Move caret to the very top
        const range = document.createRange();
        const sel = window.getSelection();
        range.setStart($editor.firstChild || $editor, 0);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      installSignature();

      $send.addEventListener('click', async () => {
        if (editorIsEmpty()) return;
        const body_html = $editor.innerHTML.trim();
        $send.disabled = true;
        const originalLabel = $sendLabel.textContent;
        $sendLabel.innerHTML = '<span class="spinner"></span>';
        try {
          const id = issue.id || issue.number;
          const isInternal = !!$check.checked;
          const result = await postReply(id, {
            body_html,
            isInternal,
            threadId: (isInternal && threadChoice.kind === 'existing') ? threadChoice.id : null,
            newThreadName: (isInternal && threadChoice.kind === 'new') ? threadChoice.name : '',
            recipients: isInternal ? null : recipients,
          });
          $editor.innerHTML = '';
          $check.checked = false;
          threadChoice = { kind: 'default' };
          $threadPickerPanel.hidden = true;
          syncToggle(); syncSendEnabled();
          // Collapse the composer after a successful send
          setComposerOpen(false);
          updatePillText();
          if (window.__buzz) window.__buzz(10);
          toast(
            result.kind === 'note'
              ? (result.threadId ? 'Note posted to thread' : 'Internal note posted')
              : 'Reply sent',
            'success'
          );
          await loadIssueDetail(id, { silent: true });
        } catch (e) {
          toast(friendlyError(e), 'error');
        } finally {
          $sendLabel.textContent = originalLabel;
          syncSendEnabled();
        }
      });
    }

    function renderMessage(m) {
      // Resolve author. Pylon /messages returns author_id + author_type.
      // Some endpoints/payloads return a nested author object. We accept both.
      let author = '';
      if (m.author && typeof m.author === 'object') {
        author = m.author.name || m.author.email || '';
      }
      if (!author && (m.from && typeof m.from === 'object')) {
        author = m.from.name || m.from.email || '';
      }
      if (!author && m.author_id) {
        const person = resolvePerson(m.author_id, m.author_type);
        if (person) author = person.name || person.email || '';
      }
      if (!author) author = m.author_name || m.from_name || (m.author_type === 'system' ? 'System' : '—');

      const when = m.sent_at || m.created_at || m.timestamp || m.updated_at;
      // Pylon uses is_private for internal notes; some payloads use is_internal/internal
      const isInternal = !!(m.is_private ?? m.is_internal ?? m.internal);
      const fromCustomer = m.from_customer === true;

      // Hunt for body content across every reasonable field name
      let html = '';
      const htmlSrc = m.body_html ?? m.html_body ?? m.content_html ?? m.html ?? m.message_html ?? '';
      const textSrc = m.body_text ?? m.text_body ?? m.content_text ?? m.text ?? m.body ?? m.content ?? '';
      if (htmlSrc) {
        html = sanitizeHtml(htmlSrc);
      } else if (textSrc) {
        html = escapeHtml(String(textSrc)).replace(/\n/g, '<br>');
      } else {
        html = '<span class="faint">(no body in API response — open in Pylon to view)</span>';
      }

      const sourceBadge = m.source && m.source !== 'email'
        ? `<span class="badge tiny">${escapeHtml(m.source)}</span>` : '';

      const isSystem = (m.author_type === 'system') || author === 'System';
      const avatar = renderAvatar(author === '—' ? '?' : author, {
        seed: m.author_id || author,
        size: 'sm',
        system: isSystem,
      });

      // Attachments: Pylon returns these as message.file_urls (per its OpenAPI).
      // Fall back to a few other common shapes just in case different endpoints
      // wrap things differently.
      const fileUrls = []
        .concat(Array.isArray(m.file_urls) ? m.file_urls : [])
        .concat(Array.isArray(m.attachment_urls) ? m.attachment_urls : [])
        .concat(Array.isArray(m.attachments)
          ? m.attachments.map(a => (typeof a === 'string' ? a : (a.url || a.download_url || a.href || ''))).filter(Boolean)
          : [])
        .filter(Boolean);
      // Hide any URL that's already shown inline as <img src> in the body, so we
      // don't duplicate inline images as both <img> and as a thumbnail chip.
      const inlineSrcs = new Set();
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        tmp.querySelectorAll('img[src]').forEach(img => inlineSrcs.add(img.getAttribute('src')));
      } catch {}
      const uniqueFiles = Array.from(new Set(fileUrls)).filter(u => !inlineSrcs.has(u));
      const attachmentsHtml = uniqueFiles.length ? renderAttachments(uniqueFiles) : '';

      return `
        <li class="msg ${isInternal ? 'msg-internal' : ''}">
          ${avatar}
          <div class="msg-content">
            <div class="msg-header">
              <span class="msg-author">${escapeHtml(author)}</span>
              ${fromCustomer ? '<span class="badge badge-snoozed">Customer</span>' : ''}
              ${isInternal ? '<span class="badge badge-pending">Internal</span>' : ''}
              ${sourceBadge}
              <span class="msg-time" style="margin-left:auto;">${when ? escapeHtml(formatDateTime(when)) : ''}</span>
            </div>
            <div class="msg-body">${html}</div>
            ${attachmentsHtml}
          </div>
        </li>
      `;
    }

    // Build the attachment strip for a message. Images render as tap-to-open
    // thumbnails; everything else as a chip with filename + icon.
    function renderAttachments(urls) {
      const items = urls.map(u => describeAttachment(u));
      const images = items.filter(it => it.kind === 'image');
      const files  = items.filter(it => it.kind !== 'image');
      let out = '<div class="attachments">';
      if (images.length) {
        out += '<div class="att-images">' + images.map(it =>
          `<a class="att-image" href="${escapeAttr(it.url)}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(it.name)}">
             <img src="${escapeAttr(it.url)}" alt="${escapeAttr(it.name)}" loading="lazy" />
           </a>`
        ).join('') + '</div>';
      }
      if (files.length) {
        out += '<ul class="att-files">' + files.map(it =>
          `<li><a class="att-file" href="${escapeAttr(it.url)}" target="_blank" rel="noopener noreferrer" download>
             <span class="att-file-icon">${attachmentIconSvg(it.ext)}</span>
             <span class="att-file-meta">
               <span class="att-file-name">${escapeHtml(it.name)}</span>
               <span class="att-file-ext">${escapeHtml((it.ext || 'file').toUpperCase())}</span>
             </span>

    // Pull a friendly filename + extension out of an attachment URL.
    function describeAttachment(url) {
      let name = '';
      let ext = '';
      try {
        const u = new URL(url, location.href);
        const last = (u.pathname.split('/').pop() || '').trim();
        name = decodeURIComponent(last) || 'Attachment';
      } catch {
        name = (url.split('/').pop() || 'Attachment').split('?')[0];
      }
      const dot = name.lastIndexOf('.');
      if (dot > 0 && dot < name.length - 1) ext = name.slice(dot + 1).toLowerCase();
      const imageExts = ['png','jpg','jpeg','gif','webp','svg','heic','heif','bmp','tiff'];
      const kind = imageExts.includes(ext) ? 'image' : 'file';
      return { url, name, ext, kind };
    }

    function attachmentIconSvg(ext) {
      const e = (ext || '').toLowerCase();
      const docExts = ['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','rtf','odt','ods','odp'];
      const archiveExts = ['zip','rar','7z','tar','gz','tgz'];
      const codeExts = ['js','ts','json','xml','html','css','py','rb','go','java','c','cpp','sh'];
      const mediaExts = ['mp4','mov','avi','mkv','webm','mp3','wav','m4a','aac','ogg'];
      const base = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
      if (docExts.includes(e)) {
        return base + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>';
      }
      if (archiveExts.includes(e)) {
        return base + '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M12 7v10M9 9h6M9 12h6M9 15h6"/></svg>';
      }
      if (codeExts.includes(e)) {
        return base + '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      }
      if (mediaExts.includes(e)) {
        return base + '<polygon points="5 3 19 12 5 21 5 3"/></svg>';
      }
      // Generic file
      return base + '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>';

    // ============ Data loading ============

    // Merge a fresh page of issues into state.allIssues, keyed by id. Newer
    // records overwrite older ones with the same id; never drops anything we
    // had before. Used by silent refreshes so they don't blow away existing
    // data when only a single page is fetched.
    function mergeIntoAllIssues(items) {
      if (!items || !items.length) return;
      const keyOf = (i) => String(i.id || i.number || '');
      const map = new Map();
      for (const i of (state.allIssues || [])) {
        const k = keyOf(i);
        if (k) map.set(k, i);
      }
      for (const i of items) {
        const k = keyOf(i);
        if (k) map.set(k, i);
      }
      // Sort by created_at desc (newest first) to keep ordering stable.
      state.allIssues = Array.from(map.values()).sort((a, b) => {
        const ta = new Date(a.created_at || 0).getTime();
        const tb = new Date(b.created_at || 0).getTime();
        return tb - ta;
      });
    }

    async function loadIssues({ silent } = {}) {
      // Skip silent refreshes entirely while we're rate-limited so we don't
      // re-trigger the 429.
      if (silent && isRateLimited()) return;

      // Silent loads (pull-to-refresh, background poll, foreground resume)
      // don't flicker the list and only fetch the FIRST PAGE — that's the
      // newest 100 issues. Full pagination is reserved for user-initiated
      // first loads. Result: a single API call per silent refresh instead
      // of ~10-30. Pylon's 20 req/min budget no longer evaporates on every
      // tab switch.
      if (!silent) {
        state.loading = true;
        state.error = null;
        patchView();
      }
      // Account + contact pagination used to fire here on every loadIssues
      // call. That cost 5-30 API calls per cold start even though most users
      // never open the assignee or account filter. Moved to be lazy — those
      // ensure* functions are now called from openAssigneeFilterSheet and
      // openAccountFilterSheet only.
      //
      // If we've already loaded them in a previous session (cache restored
      // on boot), refresh card names once now since the cache TTL is 7 days.
      if (peopleCache.loaded || accountCache.loaded) {
        try { reapplyFilters(); } catch { patchView(); }
      }

      try {
        const fromStr = state.filter.dateFrom || defaultDateWindow().dateFrom;
        const toStr   = state.filter.dateTo   || defaultDateWindow().dateTo;
        const start = new Date(fromStr + 'T00:00:00');
        const endIncl = new Date(toStr + 'T00:00:00');
        const end = new Date(endIncl.getTime() + 24 * 60 * 60 * 1000);
        const baseQuery = {
          start_time: start.toISOString(),
          end_time: end.toISOString(),
          limit: 100,
        };

        if (silent) {
          // First page only. Merge into existing state so older tickets we
          // already loaded aren't lost just because they didn't appear in
          // this slice.
          const resp = await Pylon.listIssues(baseQuery);
          const items = extractList(resp);
          mergeIntoAllIssues(items);
          reapplyFilters();
          try { saveIssuesCache(); } catch {}
          return;
        }

        // Non-silent (user-initiated first load): full pagination with a small
        // delay between pages so we stay under Pylon's 20 req/min limit. With
        // 3.5s between pages, the steady-state rate is 17/min — safe headroom.
        // The first page goes through immediately so the inbox renders fast.
        const PAGE_DELAY_MS = 3500;
        let all = [];
        let cursor = null;
        let pages = 0;
        const MAX_PAGES = 30;
        do {
          if (pages > 0) {
            // Pace remaining pages so we don't burst past Pylon's rate limit.
            await new Promise(r => setTimeout(r, PAGE_DELAY_MS));
          }
          // If something else 429'd us in the meantime, stop paginating —
          // we already have the first page or two, which is enough for the
          // user to start working.
          if (isRateLimited()) break;
          const q = cursor ? Object.assign({}, baseQuery, { cursor }) : baseQuery;
          const resp = await Pylon.listIssues(q);
          const items = extractList(resp);
          all = all.concat(items);
          state.allIssues = all;
          if (pages === 0) reapplyFilters();
          const pg = resp && (resp.pagination || resp.meta || resp);
          const hasNext = pg && (pg.has_next_page === true || (pg.next_cursor && pg.has_next_page !== false));
          cursor = hasNext ? (pg.cursor || pg.next_cursor || null) : null;
          pages += 1;
        } while (cursor && pages < MAX_PAGES);
        state.allIssues = all;
        reapplyFilters();
        try { saveIssuesCache(); } catch {}
        return;
      } catch (e) {
        const status = e && e.status;
        // 429: preserve any cached data instead of wiping the UI. Show a
        // soft toast and auto-retry once the back-off expires.
        if (status === 429) {
          // mergeIntoAllIssues + saveIssuesCache already ran for any pages we
          // got before the 429, so the inbox still shows what we have. No
          // need to set state.error and blank the screen.
          state.loading = false;
          // Schedule a silent retry once the rate-limit window elapses.
          const waitMs = Math.max(1000, (state._rateLimitedUntil || 0) - Date.now() + 500);
          setTimeout(() => {
            if (state.view === 'list' && !isRateLimited()) {
              loadIssues({ silent: true }).catch(() => {});
            }
          }, waitMs);
          // Only show the hard error if we have absolutely nothing to display.
          if (!silent && (!state.allIssues || state.allIssues.length === 0)) {
            state.error = 'Rate limited — auto-retry in ' + Math.ceil(waitMs / 1000) + 's.';
          }
          patchView();
          return;
        }
        // Other errors: only clear state if we had nothing cached anyway.
        if (!silent) {
          if (!state.allIssues || state.allIssues.length === 0) {
            state.stateCounts = {};
            state.assigneeStats = [];
            state.error = friendlyError(e);
          }
        }
      } finally {
        if (!silent) {
          state.loading = false;
          patchView();
        }
      }
    }

    // Filter pipeline. `skip` is a Set of dimensions to bypass:
    //   'state', 'assignee', 'q'. Used so the status chips can compute "if I
    //   picked this state" counts while still respecting the assignee filter.
    function applyClientFilters(issues, skip = new Set()) {
      const meId = state.me && (state.me.id || state.me.user_id);
      return issues.filter(i => {
        if (!skip.has('state') && state.filter.state) {
          const s = (i.state || i.status || '').toLowerCase();
          if (s !== state.filter.state) return false;
        }
        if (!skip.has('assignee') && Array.isArray(state.filter.assignees) && state.filter.assignees.length) {
          const aId = i.assignee_id || (i.assignee && i.assignee.id) || '';
          // Multi-select: ticket passes if its assignee matches ANY selected filter.
          const matches = state.filter.assignees.some(filt => {
            if (filt === 'me') return meId && aId === meId;
            if (filt === 'unassigned') return !aId;
            return aId === filt;
          });
          if (!matches) return false;
        }
        if (!skip.has('account') && Array.isArray(state.filter.accounts) && state.filter.accounts.length) {
          const acctId = i.account_id || (i.account && i.account.id) || '';
          const matches = state.filter.accounts.some(filt => {
            if (filt === '__none__') return !acctId;
            return acctId === filt;
          });
          if (!matches) return false;
        }
        // AI search filter — when active, only tickets in the AI's match set pass.
        if (!skip.has('ai') && state.aiSearchMatches) {
          const id = i.id || '';
          const num = i.number != null ? String(i.number) : '';
          if (!state.aiSearchMatches.has(id) && !state.aiSearchMatches.has(num)) return false;
        }
        if (!skip.has('q') && state.filter.q) {
          const needle = state.filter.q.toLowerCase();
          const id = i.id || '';
          // Include the body preview (lazy-loaded first-message snippet, cached
          // per ticket) so the search input matches text *inside* the ticket,
          // not just metadata. No extra API cost — the preview is already
          // fetched when the card is rendered.
          const preview = issueBodyPreviewCache[id] || '';
          const hay = [
            i.title, i.subject,
            i.requester && (i.requester.name || i.requester.email),
            i.account && i.account.name,
            assigneeNameOf(i),
            i.number, i.id,
            preview,
          ].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(needle)) return false;
        }
        return true;
      });
    }

    function reapplyFilters() {
      // Final displayed list — every filter applied
      state.issues = applyClientFilters(state.allIssues);
      // State chip counts — apply every filter EXCEPT state
      state.stateCounts = countByState(applyClientFilters(state.allIssues, new Set(['state'])));
      // Each dimension's stats are computed by applying every OTHER filter, so
      // the counts a user sees in the popover reflect what they'd see if they
      // picked that option (without losing the rest of their filters).
      state.assigneeStats  = topAssignees(applyClientFilters(state.allIssues, new Set(['assignee'])));
      state.accountStats   = topAccounts(applyClientFilters(state.allIssues, new Set(['account'])));
      patchView();
    }

    function countByState(issues) {
      const c = { _total: issues.length };
      for (const i of issues) {
        const s = (i.state || i.status || '').toLowerCase();
        if (!s) continue;
        c[s] = (c[s] || 0) + 1;
      }
      return c;
    }

    function assigneeNameOf(issue) {
      const aId = issue.assignee_id || (issue.assignee && issue.assignee.id);
      if (!aId) return '';
      if (issue.assignee && (issue.assignee.name || issue.assignee.email)) {
        return issue.assignee.name || issue.assignee.email;
      }
      const p = resolvePerson(aId, 'user');
      return p ? (p.name || p.email || '') : '';
    }

    function topAssignees(issues) {
      const map = new Map();
      for (const i of issues) {
        const aId = i.assignee_id || (i.assignee && i.assignee.id);
        if (!aId) continue;
        const cur = map.get(aId) || { id: aId, count: 0, name: '' };
        cur.count += 1;
        if (!cur.name) cur.name = assigneeNameOf(i);
        map.set(aId, cur);
      }
      // Resolve names again now that peopleCache may have arrived
      for (const v of map.values()) {
        if (!v.name) {
          const p = resolvePerson(v.id, 'user');
          if (p) v.name = p.name || p.email || '';
        }
      }
      return Array.from(map.values()).sort((a, b) => b.count - a.count).slice(0, 6);
    }

    // Build account stats from the current issue list. Empty account_id is
    // bucketed under a special '__none__' key so the user can filter to
    // "No account" tickets explicitly.
    function topAccounts(issues) {
      const map = new Map();
      for (const i of issues) {
        const acctId = i.account_id || (i.account && i.account.id) || '__none__';
        const cur = map.get(acctId) || { id: acctId, count: 0, name: '' };
        cur.count += 1;
        if (!cur.name) cur.name = resolveAccountName(i) || (acctId === '__none__' ? 'No account' : '');
        map.set(acctId, cur);
      }
      // Resolve names once more in case accountCache caught up.
      for (const v of map.values()) {
        if (!v.name && v.id && v.id !== '__none__') {
          const cached = accountCache.byId && accountCache.byId[v.id];
          if (cached) v.name = cached.name || cached.title || cached.display_name || '';
        }
      }
      return Array.from(map.values())
        .sort((a, b) => b.count - a.count);
    }

    // Build requester stats. Picks the first non-empty (name | email | id) as
    // the display label.
    function topRequesters(issues) {
      const map = new Map();
      for (const i of issues) {
        const r = i.requester || i.contact || {};
        const rId = r.id || i.requester_id;
        if (!rId) continue;
        const cur = map.get(rId) || { id: rId, count: 0, name: '', email: '' };
        cur.count += 1;
        if (!cur.name) cur.name = r.name || '';
        if (!cur.email) cur.email = r.email || '';
        map.set(rId, cur);
      }
      // Try to fill missing names from peopleCache (contacts).
      for (const v of map.values()) {
        if (!v.name) {
          const p = resolvePerson(v.id, 'contact');
          if (p) { v.name = p.name || ''; v.email = v.email || p.email || ''; }
        }
      }
      return Array.from(map.values())
        .sort((a, b) => b.count - a.count);
    }

    async function loadIssueDetail(id, { silent } = {}) {
      // Use a SEPARATE loading flag for the detail view so we don't trigger
      // the inbox's bottom-of-list "Loading…" indicator while opening a
      // ticket. Bug noticed in split-pane mode: tapping a ticket showed a
      // spinner at the bottom of the inbox list as well as inside the
      // detail pane. state.loading is for inbox-fetch; state.detailLoading
      // is for ticket-fetch.
      if (!silent) {
        state.detailLoading = true;
        state.error = null;
        state.messages = [];
        // In split mode, render just the detail pane so the inbox isn't
        // touched. In single mode, re-render the whole view normally.
        if (isSplitLayout()) {
          const detailEl = document.getElementById('detailPaneContent');
          if (detailEl) renderDetail(detailEl);
        } else {
          render();
        }
      }
      // Fire people-loading in the background — it's only used to label authors.
      ensurePeopleLoaded();
      try {
        // Issue details
        const issueResp = await Pylon.getIssue(id).catch(e => { console.warn('getIssue failed', e); return null; });
        if (issueResp) {
          const issue = issueResp.data || issueResp.issue || issueResp;
          state.issue = Object.assign({}, state.issue, issue);
        }

        // Messages — try /issues/{id}/messages first (matches MCP shape), then /messages
        let msgResp = await Pylon.listMessages(id).catch(() => null);
        if (!msgResp || (extractList(msgResp).length === 0 && !Array.isArray(msgResp.messages))) {
          msgResp = await Pylon.listMessagesAlt(id).catch(() => null);
        }
        if (msgResp) state.messages = extractList(msgResp);
      } catch (e) {
        state.error = friendlyError(e);
      } finally {
        state.detailLoading = false;
        // Find the right target to render into:
        //  - Split mode: the detail pane on the right (#detailPane).
        //  - Single mode + state.view === 'detail': the main element.
        //  - Otherwise (split layout but no #detailPane yet, or single mode
        //    where the user navigated away): don't render.
        const splitDetailEl = isSplitLayout() ? document.getElementById('detailPaneContent') : null;
        const target = splitDetailEl || (state.view === 'detail' ? main : null);
        if (target) {
          // Silent refreshes (background poll, foreground-resume, pull-to-refresh)
          // must NOT re-render while the user is mid-reply, or the renderDetail()
          // call wipes the contenteditable and closes the composer.
          if (silent && isComposingActively()) {
            // Skip — fresh data is already in state and will surface on the
            // user's next manual interaction (send, navigate, etc.).
          } else {
            renderDetail(target);
          }
        }
      }
    }

    // Try a list of (endpoint, payload) candidates until one succeeds.
    // Pylon's actual reply endpoint isn't in the docs I can read from here;
    // this brute-forces the most common patterns so the app works while we
    // pin down the real path from the network log on first success.
    // Reply / note / thread per Pylon docs:
    //   POST /issues/{id}/reply  →  customer-facing reply  (body_html, message_id)
    //   POST /issues/{id}/note   →  internal note           (body_html, thread_id?)
    //   POST /issues/{id}/threads → new internal thread     (name)
    async function postReply(id, { body_html, isInternal, threadId, newThreadName, recipients }) {
      if (isInternal) {
        let targetThreadId = threadId || null;
        if (newThreadName) {
          const t = await Pylon.createThread(id, { name: newThreadName });
          const created = (t && (t.data || t)) || {};
          // Per docs: use the `id` field (not thread_id) from the response
          targetThreadId = created.id || created.thread_id || null;
          // Refresh thread list cache for this issue
          delete threadsByIssue[id];
        }
        const body = { body_html };
        if (targetThreadId) body.thread_id = targetThreadId;
        await Pylon.postNote(id, body);
        return { kind: 'note', threadId: targetThreadId };
      } else {
        // Public reply
        const msgs = state.messages || [];
        let messageId = null;
        for (let i = msgs.length - 1; i >= 0; i--) {
          const m = msgs[i];
          const isPrivate = !!(m && (m.is_private ?? m.is_internal ?? m.internal));
          if (!isPrivate && m && m.id) { messageId = m.id; break; }
        }
        const body = { body_html };
        if (messageId) body.message_id = messageId;
        // email_info: { to_emails, cc_emails, bcc_emails } — required when issue.source is email
        if (recipients && (recipients.to.length || recipients.cc.length || recipients.bcc.length)) {
          body.email_info = {
            to_emails: recipients.to.map(r => r.email).filter(Boolean),
            cc_emails: recipients.cc.map(r => r.email).filter(Boolean),
            bcc_emails: recipients.bcc.map(r => r.email).filter(Boolean),
          };
        }
        await Pylon.replyPublic(id, body);
        return { kind: 'reply' };
      }
    }

    // Build the default recipient lists for a reply.
    //
    // The TO field should be the original customer/sender. We try, in order:
    //   1. issue.requester.email           (most reliable when set)
    //   2. From the latest customer message: lookup author_id in peopleCache
    //   3. The latest non-internal message's email_info.from_email field
    //
    // CC/BCC come from the latest non-internal message's email_info, minus
    // anyone already in TO and minus the signed-in user.
    function gatherDefaultRecipients(issue, messages) {
      const me = state.me || {};
      const myEmails = new Set([me.email].filter(Boolean).map(s => s.toLowerCase()));
      const seen = new Set();
      const out = { to: [], cc: [], bcc: [] };

      function pushUnique(target, email, name) {
        if (!email) return;
        const lower = String(email).toLowerCase();
        if (myEmails.has(lower)) return; // never auto-add self
        if (seen.has(lower)) return;
        target.push({ email, name: name || '' });
        seen.add(lower);
      }

      // 1. requester.email from the issue (most reliable when populated)
      if (issue && issue.requester && issue.requester.email) {
        pushUnique(out.to, issue.requester.email, issue.requester.name);
      }

      // 2. If TO is still empty, try resolving via the latest customer message's author
      if (out.to.length === 0) {
        const msgs = messages || [];
        for (let i = msgs.length - 1; i >= 0; i--) {
          const m = msgs[i];
          if (!m || !m.from_customer) continue;
          // First try peopleCache.contacts (populated by listContacts)
          if (m.author_id && peopleCache.contacts[m.author_id]) {
            const c = peopleCache.contacts[m.author_id];
            pushUnique(out.to, c.email, c.name);
            if (out.to.length > 0) break;
          }
          // Fallback to nested author/from objects on the message itself
          const nested = m.author || m.from || m.sender;
          if (nested && typeof nested === 'object' && nested.email) {
            pushUnique(out.to, nested.email, nested.name);
            if (out.to.length > 0) break;
          }
        }
      }

      // 3. Walk newest-first, find the latest non-internal message's email_info
      const msgs = messages || [];
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        const isPrivate = !!(m && (m.is_private ?? m.is_internal));
        if (isPrivate) continue;
        const info = m && (m.email_info || m.email || m.email_metadata);
        if (!info) continue;

        // If TO is still empty, the from_email of the latest customer email is the best guess
        if (out.to.length === 0) {
          const fromEmail = info.from_email || info.from || (info.from_address && info.from_address.email);
          const fromName = (info.from_address && info.from_address.name) || '';
          if (fromEmail) pushUnique(out.to, fromEmail, fromName);
        }

        const addList = (key, target) => {
          const arr = info[key + '_emails'] || info[key] || [];
          for (const raw of (Array.isArray(arr) ? arr : [])) {
            const email = typeof raw === 'string' ? raw : (raw && (raw.email || raw.address));
            const name = typeof raw === 'object' ? (raw.name || '') : '';
            pushUnique(target, email, name);
          }
        };
        // Pull cc/bcc; some Pylon payloads also have to_emails — if our TO is
        // still empty, use those as a last resort.
        addList('cc', out.cc);
        addList('bcc', out.bcc);
        if (out.to.length === 0) addList('to', out.to);

        break;
      }

      return out;
    }

    // Async helper: if a customer message's contact isn't in the cache, fetch it
    // and re-fill the composer recipients in place.
    async function fillToFromContactIfMissing(messages, onResolved) {
      const msgs = messages || [];
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        if (!m || !m.from_customer || !m.author_id) continue;
        if (peopleCache.contacts[m.author_id]) continue; // already had it
        try {
          const r = await Pylon.getContact(m.author_id);
          const c = (r && (r.data || r)) || null;
          if (c && c.id) {
            peopleCache.contacts[c.id] = c;
            if (c.email) onResolved({ email: c.email, name: c.name || '' });
          }
        } catch {}
        break;
      }
    }

    function recipientLabel(r) { return r.name ? `${r.name} <${r.email}>` : r.email; }

    // Thread list per issue (cached for the session)
    const threadsByIssue = {};
    async function ensureThreadsLoaded(issueId) {
      if (threadsByIssue[issueId]) return threadsByIssue[issueId];
      try {
        const r = await Pylon.listThreads(issueId);
        const list = extractList(r) || [];
        threadsByIssue[issueId] = list;
      } catch {
        threadsByIssue[issueId] = [];
      }
      return threadsByIssue[issueId];
    }

    async function changeIssueState(newState) {
      const issue = state.issue || {};
      const id = issue.id || issue.number;
      if (!id) return;
      try {
        const resp = await Pylon.updateIssue(id, { state: newState });
        const updated = (resp && (resp.data || resp.issue || resp)) || {};
        state.issue = Object.assign({}, state.issue, updated, { state: newState });
        toast(`State changed to ${prettyState(newState)}`, 'success');
        if (state.view === 'detail') renderDetail();
      } catch (e) {
        toast(friendlyError(e), 'error');
      }
    }

    // Whether the tag picker dropdown is open
    let tagPickerOpen = false;
    let tagPickerSearch = '';

    function currentTagNames() {
      const t = (state.issue && state.issue.tags) || [];
      return t.map(x => typeof x === 'string' ? x : tagNameOf(x)).filter(Boolean);
    }

    function renderTagsSection() {
      const current = currentTagNames();
      const currentSet = new Set(current.map(n => n.toLowerCase()));
      const allTags = (tagCache.tags || []).map(tagNameOf).filter(Boolean);
      // Available = not yet on this issue
      const needle = tagPickerSearch.toLowerCase();
      const filtered = allTags
        .filter(n => !currentSet.has(n.toLowerCase()))
        .filter(n => !needle || n.toLowerCase().includes(needle))
        .slice(0, 50);

      const pills = current.map(name => `
        <span class="tag-pill" style="background:${tagColor(name)}; color:${tagTextColor(name)};">
          ${escapeHtml(name)}
          <button class="tag-remove" data-tag="${escapeAttr(name)}" aria-label="Remove ${escapeAttr(name)}">×</button>
        </span>`).join('');

      const picker = !tagPickerOpen ? '' : `
        <div class="tag-picker">
          <input type="search" id="tagSearch" placeholder="Search tags…" value="${escapeAttr(tagPickerSearch)}" autocomplete="off" />
          <div class="tag-options" id="tagOptions">
            ${!tagCache.loaded
              ? '<div class="state-row faint" style="padding:14px;"><span class="spinner"></span> Loading tags…</div>'
              : (filtered.length === 0
                  ? `<div class="state-row faint" style="padding:14px;">${tagPickerSearch ? 'No matches.' : (allTags.length === 0 ? 'No tags available for this workspace.' : 'All tags already added.')}</div>`
                  : filtered.map(name => `
                    <button class="tag-option" data-tag="${escapeAttr(name)}">
                      <span class="tag-swatch" style="background:${tagColor(name)};"></span>
                      ${escapeHtml(name)}
                    </button>`).join(''))
            }
          </div>
        </div>`;

      return `
        <div class="tag-row">
          ${pills}
          <button class="tag-add" id="tagAddBtn">${tagPickerOpen ? '× Close' : '+ Add tag'}</button>
        </div>
        ${picker}
      `;
    }

    function patchTagsSection() {
      const node = document.getElementById('tagsSection');
      if (!node) return;
      node.innerHTML = renderTagsSection();
      bindTagsSection();
      if (tagPickerOpen) {
        const $s = document.getElementById('tagSearch');
        if ($s) $s.focus();
      }
    }

    function bindTagsSection() {
      const $add = document.getElementById('tagAddBtn');
      if ($add) {
        $add.onclick = async () => {
          tagPickerOpen = !tagPickerOpen;
          tagPickerSearch = '';
          patchTagsSection();
          if (tagPickerOpen && !tagCache.loaded) {
            await ensureTagsLoaded();
            if (tagPickerOpen) patchTagsSection();
          }
        };
      }
      const $section = document.getElementById('tagsSection');
      if (!$section) return;
      $section.querySelectorAll('.tag-remove').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          removeTag(btn.dataset.tag);
        };
      });
      $section.querySelectorAll('.tag-option').forEach(btn => {
        btn.onclick = () => addTag(btn.dataset.tag);
      });
      const $search = document.getElementById('tagSearch');
      if ($search) {
        $search.oninput = (e) => {
          tagPickerSearch = e.target.value;
          const $opts = document.getElementById('tagOptions');
          if ($opts) {
            const allTags = (tagCache.tags || []).map(tagNameOf).filter(Boolean);
            const currentSet = new Set(currentTagNames().map(n => n.toLowerCase()));
            const needle = tagPickerSearch.toLowerCase();
            const filtered = allTags
              .filter(n => !currentSet.has(n.toLowerCase()))
              .filter(n => !needle || n.toLowerCase().includes(needle))
              .slice(0, 50);
            $opts.innerHTML = filtered.length === 0
              ? `<div class="state-row faint" style="padding:14px;">${needle ? 'No matches.' : 'All tags already added.'}</div>`
              : filtered.map(name => `
                <button class="tag-option" data-tag="${escapeAttr(name)}">
                  <span class="tag-swatch" style="background:${tagColor(name)};"></span>
                  ${escapeHtml(name)}
                </button>`).join('');
            $opts.querySelectorAll('.tag-option').forEach(b => {
              b.onclick = () => addTag(b.dataset.tag);
            });
          }
        };
      }
    }

    async function setIssueTags(nextTags, optimisticPrev) {
      const issue = state.issue || {};
      const id = issue.id || issue.number;
      if (!id) return;
      try {
        const resp = await Pylon.updateIssue(id, { tags: nextTags });
        const updated = (resp && (resp.data || resp.issue || resp)) || {};
        state.issue = Object.assign({}, state.issue, updated, { tags: nextTags });
        // Also reflect in the list-cache so the list view doesn't drift
        const idx = state.allIssues.findIndex(i => (i.id || i.number) === (issue.id || issue.number));
        if (idx >= 0) state.allIssues[idx] = Object.assign({}, state.allIssues[idx], { tags: nextTags });
      } catch (e) {
        // Revert
        state.issue = Object.assign({}, state.issue, { tags: optimisticPrev });
        toast(friendlyError(e), 'error');
      } finally {
        patchTagsSection();
      }
    }

    async function addTag(name) {
      const prev = currentTagNames();
      if (prev.map(n => n.toLowerCase()).includes(name.toLowerCase())) return;
      const next = [...prev, name];
      // Optimistic
      state.issue = Object.assign({}, state.issue, { tags: next });
      patchTagsSection();
      await setIssueTags(next, prev);
      toast(`Added "${name}"`, 'success');
    }
    async function removeTag(name) {
      const prev = currentTagNames();
      const next = prev.filter(n => n.toLowerCase() !== name.toLowerCase());
      state.issue = Object.assign({}, state.issue, { tags: next });
      patchTagsSection();
      await setIssueTags(next, prev);
      toast(`Removed "${name}"`, 'success');
    }

    // Deterministic pastel-ish tag colors based on the tag name.
    const TAG_PALETTE = [
      ['#ece8ff','#5b46b8'], ['#ffe5e7','#b42318'], ['#d6f1e1','#176e3a'],
      ['#d8e6ff','#1f4faf'], ['#fff1d6','#9a5b00'], ['#ffe1f0','#a3185f'],
      ['#dff7f5','#066b5e'], ['#f5e1ff','#6b1a8c'], ['#fff0e0','#8a3a00'],
      ['#e7fde7','#236f23'],
    ];
    function tagColorIdx(name) {
      let h = 0;
      const s = String(name || '');
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h % TAG_PALETTE.length;
    }
    function tagColor(name) { return TAG_PALETTE[tagColorIdx(name)][0]; }
    function tagTextColor(name) { return TAG_PALETTE[tagColorIdx(name)][1]; }

    function extractList(resp) {
      if (!resp) return [];
      if (Array.isArray(resp)) return resp;
      if (Array.isArray(resp.data)) return resp.data;
      if (Array.isArray(resp.items)) return resp.items;
      if (Array.isArray(resp.results)) return resp.results;
      if (Array.isArray(resp.issues)) return resp.issues;
      if (Array.isArray(resp.messages)) return resp.messages;
      return [];
    }

    function patchView() {
      if (state.view !== 'list') return;
      const container = document.getElementById('listContainer');
      const row = document.getElementById('filterRow');
      if (!container || !row) { render(); return; }
      // Re-render filter chips so counts (status chip especially) stay fresh
      // when issues load in the background.
      row.innerHTML =
        renderStatusFilterChip() +
        renderAssigneeFilterChip() +
        renderAccountFilterChip() +
        renderDateChip();
      container.innerHTML = renderListBody();
      const retry = document.getElementById('retryBtn');
      if (retry) retry.addEventListener('click', loadIssues);
      attachBodyObservers();
      // Restore selection highlights after a re-render (background refresh,
      // filter change, etc. can blow away the .is-selected classes).
      if (state.selectionMode && state.selectedIssueIds && state.selectedIssueIds.size) {
        state.selectedIssueIds.forEach(id => {
          const card = container.querySelector('.issue-card[data-id="' + CSS.escape(String(id)) + '"]');
          if (card) card.classList.add('is-selected');
        });
      }
    }

    // ============ Header actions ============

    hdrLeft.addEventListener('click', () => {
      // Route the in-app back button through history.back() so it triggers the
      // same popstate handler as the Android system back gesture. That keeps
      // both paths converging on one navigation routine.
      try { history.back(); }
      catch {
        // Fallback if for some reason history isn't available
        if (state.view === 'detail') navigate('list');
        else if (state.view === 'settings') navigate('list');
        else if (state.view === 'netlog') { state.view = 'settings'; render(); }
        else if (state.view === 'signature') { state.view = 'settings'; render(); }
      }
    });

    // ============ Android back-button / browser-history integration ============
    // Without this, the Android system back gesture exits the PWA from any
    // view. With it, back moves through the view stack (detail → inbox,
    // settings → inbox, netlog/signature → settings). Back from the inbox
    // itself exits the app naturally — standard mobile app behaviour.
    (function setupHistoryNav() {
      // Tag the initial history entry so popstate handlers always have a
      // state object to read against.
      try { history.replaceState({ view: state.view || 'list' }, ''); } catch {}

      window.addEventListener('popstate', function () {
        // A back gesture should dismiss any open modal first — lightbox, AI
        // sheet, date picker, account/assignee popover, overflow menu, etc.
        const overlays = document.querySelectorAll(
          '.lightbox, .ai-sheet-overlay, .confirm-overlay, .popover-menu, .popover-menu-backdrop'
        );
        if (overlays.length) {
          overlays.forEach(el => el.remove());
          document.body.style.overflow = '';
          // The pop just consumed our forward entry; push it back so the
          // user stays on the current view rather than navigating away too.
          try { history.pushState({ view: state.view }, ''); } catch {}
          return;
        }

        // Detail → Inbox
        if (state.view === 'detail') {
          navigate('list', { _fromHistory: true });
          return;
        }
        // Settings → Inbox
        if (state.view === 'settings') {
          navigate('list', { _fromHistory: true });
          return;
        }
        // Netlog / Signature are subviews of Settings (not pushed via
        // navigate()), so we move to settings directly and re-render.
        if (state.view === 'netlog' || state.view === 'signature') {
          state.view = 'settings';
          render();
          return;
        }
        // On the inbox itself: nothing to do — the browser will exit the PWA,
        // matching standard mobile-app behaviour where back from root closes.
      });
    })();
    hdrRight.addEventListener('click', () => {
      if (state.view === 'list') navigate('settings');
    });

    // Bottom nav handlers
    bottomNav.addEventListener('click', (e) => {
      const btn = e.target.closest('.bottom-nav-btn');
      if (!btn) return;
      const target = btn.dataset.nav;
      if (target === 'list') navigate('list');
      else if (target === 'search') {
        navigate('list');
        // Focus synchronously inside the same task as the user tap so iOS
        // treats it as a user gesture and pops up the soft keyboard. A
        // setTimeout (even 0ms) breaks the gesture chain and the keyboard
        // never appears on iPhone — only the visual focus ring shows.
        const s = document.getElementById('searchInput');
        if (s) {
          s.focus({ preventScroll: true });
          // Belt and braces — re-focus on the next frame in case render
          // re-created the element after our initial focus call.
          requestAnimationFrame(() => {
            const s2 = document.getElementById('searchInput');
            if (s2 && document.activeElement !== s2) s2.focus({ preventScroll: true });
          });
        }
      } else if (target === 'settings') navigate('settings');
    });

    // ============ Toast ============

    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg, kind) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
      clearTimeout(toastTimer);
      if (kind === 'error') {
        // Errors stick until tapped, so the user can read & copy the full message
        toastEl.onclick = () => {
          toastEl.className = 'toast' + (kind ? ' ' + kind : '');
          toastEl.onclick = null;
        };
      } else {
        toastEl.onclick = null;
        toastTimer = setTimeout(() => { toastEl.className = 'toast' + (kind ? ' ' + kind : ''); }, 2400);
      }
    }

    // ============ Helpers ============

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // very small HTML sanitizer for message bodies — strips scripts/styles/event handlers,
    // and strips any author-supplied colours so the app theme always wins contrast.
    function sanitizeHtml(html) {
      const tpl = document.createElement('template');
      tpl.innerHTML = String(html || '');
      const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_ELEMENT);
      const remove = [];
      let n;
      while ((n = walker.nextNode())) {
        const tag = n.tagName.toLowerCase();
        if (['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta'].includes(tag)) {
          remove.push(n);
          continue;
        }
        // Drop legacy colour attributes from email HTML (<font color="#000">, <body bgcolor="…">, etc.)
        ['color', 'bgcolor', 'text', 'link', 'vlink', 'alink'].forEach(a => n.removeAttribute(a));

        for (const attr of Array.from(n.attributes)) {
          const name = attr.name.toLowerCase();
          const val = (attr.value || '').trim();
          if (name.startsWith('on')) n.removeAttribute(attr.name);
          else if ((name === 'href' || name === 'src') && /^javascript:/i.test(val)) n.removeAttribute(attr.name);
          else if (name === 'style') {
            // Strip colour-related declarations so theme tokens (--text, --surface) win contrast.
            const cleaned = val
              .split(';')
              .map(s => s.trim())
              .filter(s => s && !/^(color|background|background-color)\s*:/i.test(s))
              .join('; ');
            if (cleaned) n.setAttribute('style', cleaned);
            else n.removeAttribute('style');
          }
        }
        if (tag === 'a' && n.hasAttribute('href')) {
          n.setAttribute('target', '_blank');
          n.setAttribute('rel', 'noopener noreferrer');
        }
        if (tag === 'img') {
          n.setAttribute('loading', 'lazy');
        }
      }
      remove.forEach(el => el.remove());
      return tpl.innerHTML;
    }

    function formatDate(d) {
      try {
        return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return String(d); }
    }
    function formatDateTime(d) {
      try {
        const date = new Date(d);
        const today = new Date();
        const sameDay = date.toDateString() === today.toDateString();
        if (sameDay) return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      } catch { return String(d); }
    }
    function timeAgo(d) {
      try {
        const ms = Date.now() - new Date(d).getTime();
        const s = Math.floor(ms / 1000);
        if (s < 60) return 'just now';
        const m = Math.floor(s / 60);
        if (m < 60) return m + 'm';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h';
        const day = Math.floor(h / 24);
        if (day < 7) return day + 'd';
        return formatDate(d);
      } catch { return ''; }
    }

    function friendlyError(e) {
      const msg = (e && e.message) || String(e);
      if (/Failed to fetch|NetworkError|TypeError/.test(msg)) {
        return 'Network/CORS error. Direct browser calls to api.usepylon.com are usually blocked by CORS — configure a CORS proxy in Settings (see README).';
      }
      // Preserve the full Pylon error message verbatim — the API often returns
      // useful detail (missing field, bad enum, etc).
      return msg;
    }

    // True when the user appears to be actively writing a reply: the editor
    // is focused, or it contains real (non-empty) content. Used to suppress
    // silent re-renders that would otherwise wipe the contenteditable.
    function isComposingActively() {
      const editor = document.getElementById('replyEditor');
      if (!editor) return false;
      if (document.activeElement === editor) return true;
      const html = (editor.innerHTML || '').trim();
      // Treat browser-inserted empty markers as "no content"
      if (!html) return false;
      if (html === '<br>' || html === '<br/>' || html === '<div><br></div>') return false;
      const text = (editor.textContent || '').replace(/[\s​]+/g, '');
      return text.length > 0;
    }

    // Copy the current issue's Pylon web URL to the clipboard. Triggered by the
    // small copy button next to the # number in the detail-view header.
    async function copyIssueUrl(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      const issue = state.issue;
      const num = issue && issue.number;
      if (num == null) { toast('No ticket number to copy', 'error'); return; }
      const url = 'https://app.usepylon.com/issues?issueNumber=' + encodeURIComponent(num);
      const btn = document.getElementById('hdrCopyBtn');
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
          await navigator.clipboard.writeText(url);
          copied = true;
        } else {
          throw new Error('clipboard API unavailable');
        }
      } catch {
        // Fallback for older Safari and non-secure contexts: hidden textarea + execCommand
        try {
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, url.length);
          copied = document.execCommand && document.execCommand('copy');
          document.body.removeChild(ta);
        } catch { copied = false; }
      }
      if (copied) {
        toast('Ticket URL copied', 'success');
        if (window.__buzz) window.__buzz(8);
        if (btn) {
          btn.classList.add('is-copied');
          setTimeout(function () { btn.classList.remove('is-copied'); }, 1200);
        }
      } else {
        toast('Copy failed — ' + url, 'error');
      }
    }

    // ============ Issue overflow menu (delete, etc) ============
    function openIssueMoreMenu(anchorBtn) {
      closeIssueMoreMenu();
      const menu = document.createElement('div');
      menu.className = 'popover-menu';
      menu.setAttribute('role', 'menu');
      menu.innerHTML =
        '<button type="button" class="popover-menu-item danger" role="menuitem" data-action="delete">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="3 6 5 6 21 6"/>' +
        '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
        '<path d="M10 11v6M14 11v6"/>' +
        '<path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>' +
        '</svg><span>Delete ticket</span></button>';

      // Position fixed, anchored to bottom-right of the trigger button
      const r = anchorBtn.getBoundingClientRect();

      menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';

      menu.querySelector('[data-action="delete"]').addEventListener('click', function () {
