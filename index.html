<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#6e56cf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0a1c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Pylon support inbox for your phone — view, reply, manage tickets." />
  <!-- PWA / iOS metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pylon" />
  <meta name="application-name" content="Pylon Mobile" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <title>Pylon Mobile</title>
  <style>
    /* -------- design tokens (Pylon-inspired) -------- */
    :root {
      --bg: #faf9fc;
      --bg-gradient: radial-gradient(120% 80% at 50% -10%, #ece8ff 0%, transparent 55%), #faf9fc;
      --surface: #ffffff;
      --surface-2: #f3f1f8;
      --surface-3: #ebe7f2;
      --border: #e8e4f0;
      --border-strong: #d6d0e2;
      --text: #16121f;
      --text-muted: #6b6680;
      --text-faint: #9c98ad;
      --accent: #6e56cf;        /* Pylon-ish purple */
      --accent-strong: #5b46b8;
      --accent-soft: #ece8ff;
      --accent-text: #ffffff;
      --primary: #6e56cf;
      --primary-soft: #ece8ff;
      --danger: #e5484d;
      --danger-soft: #ffe5e7;
      --success: #30a46c;
      --success-soft: #d6f1e1;
      --warning: #f5a524;
      --warning-soft: #fff1d6;
      --info: #4f86ec;
      --info-soft: #d8e6ff;
      --shadow-1: 0 1px 2px rgba(35, 25, 80, .04), 0 2px 8px rgba(35, 25, 80, .06);
      --shadow-2: 0 8px 24px rgba(35, 25, 80, .12);
      --shadow-3: 0 -4px 24px rgba(35, 25, 80, .08);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 22px;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 42px;
      --bottom-nav-h: 50px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0a1c;
        --bg-gradient: radial-gradient(120% 80% at 50% -10%, #2a1f5c 0%, transparent 60%), #0e0a1c;
        --surface: #1a1530;
        --surface-2: #221b3d;
        --surface-3: #2b234a;
        --border: #2e2750;
        --border-strong: #423765;
        --text: #f3eefc;
        --text-muted: #aaa2c5;
        --text-faint: #7a7297;
        --accent: #8b73f0;
        --accent-strong: #7a61e0;
        --accent-soft: #2c2360;
        --accent-text: #ffffff;
        --primary: #8b73f0;
        --primary-soft: #2c2360;
        --danger: #ff6369;
        --danger-soft: #44171c;
        --success: #46c089;
        --success-soft: #143824;
        --warning: #ffb849;
        --warning-soft: #3d2912;
        --info: #6ea0ff;
        --info-soft: #14264e;
        --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.4);
        --shadow-2: 0 8px 32px rgba(0,0,0,.5);
        --shadow-3: 0 -4px 24px rgba(0,0,0,.5);
      }
    }

    /* -------- reset / base -------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100%;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      /* Smoother momentum scroll on iOS WebKit */
      -webkit-overflow-scrolling: touch;
      /* Stop iOS Safari from auto-zooming text inputs on focus */
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    /* Prevent iOS rubberband when in standalone PWA mode */
    /* Standalone PWA mode: keep iOS from rubber-banding past the top/bottom,
       but DON'T use the old 'position: fixed; inset: 0' trick. That trick
       turned body into the containing block for fixed descendants, which on
       iPhone 17 ends up shorter than the actual screen and floats the bottom-
       nav and composer above the home indicator area. overscroll-behavior
       gives us the anti-rubber-band effect without messing with positioning. */
    html.is-standalone {
      overscroll-behavior-y: contain;
      height: 100%;
    }
    html.is-standalone body {
      overscroll-behavior-y: contain;
      min-height: 100dvh;
      /* Allow native scrolling — position: fixed children now anchor to the
         layout viewport (= the full screen) instead of body's shorter box. */
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { background: none; border: none; padding: 0; cursor: pointer; }
    input, textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      width: 100%;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
    }
    textarea { resize: vertical; min-height: 90px; font-family: inherit; }
    a { color: var(--primary); text-decoration: none; }
    ::placeholder { color: var(--text-faint); }

    /* -------- app shell -------- */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      background: transparent;
    }
    .app.has-nav { padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom)); }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      /* Minimal padding — clear the dynamic island via safe-top, then just
         1px breathing room above and 4px below the title. */
      padding: calc(var(--safe-top) + 1px) 14px 4px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
      min-height: calc(var(--header-h) + var(--safe-top));
    }
    .header-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Small inline action buttons shown next to the ticket # in the header on detail view. */
    .hdr-copy-btn, .hdr-more-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: -6px;
      margin-left: 6px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color .15s, color .15s, transform .12s;
    }
    .hdr-copy-btn:hover, .hdr-copy-btn:focus-visible,
    .hdr-more-btn:hover, .hdr-more-btn:focus-visible {
      background: var(--surface);
      color: var(--accent);
    }
    .hdr-copy-btn:active, .hdr-more-btn:active { transform: scale(.92); background: var(--border); }
    .hdr-copy-btn svg, .hdr-more-btn svg { display: block; }
    .hdr-copy-btn.is-copied {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 40%, var(--border));
      background: color-mix(in srgb, var(--success) 12%, var(--surface-2));
    }

    /* Popover menu — anchored to a header button. */
    .popover-menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
    }
    .popover-menu {
      position: fixed;
      z-index: 100;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
      padding: 6px;
      animation: popover-in .12s ease-out;
    }
    @keyframes popover-in {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .popover-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: none;
      border-radius: 8px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .12s;
    }
    .popover-menu-item:hover, .popover-menu-item:focus-visible {
      background: var(--surface-2);
    }
    .popover-menu-item.danger { color: var(--danger); }
    .popover-menu-item.danger:hover {
      background: color-mix(in srgb, var(--danger) 10%, var(--surface-2));
    }

    /* Confirmation modal — used for destructive actions. */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      transition: opacity .15s ease;
    }
    .confirm-overlay.is-open { opacity: 1; }
    .confirm-modal {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      padding: 22px 22px 18px;
      box-shadow: 0 18px 56px rgba(0, 0, 0, .35);
      text-align: center;
      transform: scale(.95);
      transition: transform .15s ease;
    }
    /* AI Overview button — sits in the detail header below the ticket meta. */
    .ai-overview-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      margin: 10px 0 4px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      color: var(--accent);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s, transform .08s, border-color .15s;
    }
    .ai-overview-btn:hover {
      background: color-mix(in srgb, var(--accent) 16%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }
    .ai-overview-btn:active { transform: scale(.99); }

    /* AI Overview sheet — slides up from the bottom on tap. */
    .ai-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .ai-sheet-overlay.is-open { opacity: 1; }
    .ai-sheet {
      width: 100%;
      max-width: 720px;
      max-height: 85dvh;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(.2, .9, .3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .35);
    }
    .ai-sheet-overlay.is-open .ai-sheet { transform: translateY(0); }
    .ai-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .ai-sheet-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .ai-sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ai-sheet-close:hover { background: var(--border); }
    .ai-sheet-body {
      overflow-y: auto;
      padding: 16px 18px max(env(safe-area-inset-bottom, 0px), 24px);
      -webkit-overflow-scrolling: touch;
    }
    .ai-sheet-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .ai-sheet-error {
      padding: 20px;
      color: var(--danger);
      font-size: 14px;
      line-height: 1.5;
    }
    .ai-sheet-content {
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text);
    }
    .ai-sheet-content p { margin: 0 0 12px; }
    .ai-sheet-content strong { color: var(--text); font-weight: 700; }
    .ai-sheet-content ul {
      list-style: none;
      padding-left: 0;
      margin: 6px 0 14px;
    }
    .ai-sheet-content li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 4px;
    }
    .ai-sheet-content li::before {
      content: '•';
      position: absolute;
      left: 4px;
      color: var(--accent);
    }
    .ai-sheet-content em { font-style: italic; color: var(--text-muted); }

    /* Date-range picker modal — wider, left-aligned. */
    .confirm-modal.date-modal { max-width: 380px; text-align: left; }
    .date-modal h3 { margin-bottom: 8px; }
    .date-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .date-hint strong { color: var(--text); font-weight: 600; }
    .date-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .date-presets .chip {
      padding: 6px 12px;
      font-size: 12.5px;
    }
    .date-presets .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
    }
    .date-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .date-inputs label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .date-inputs label > span {
      width: 42px;
      font-weight: 600;
      color: var(--text);
    }
    .date-inputs input[type="date"] {
      flex: 1;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      color-scheme: light dark;
    }
    .chip-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .confirm-overlay.is-open .confirm-modal { transform: scale(1); }
    .confirm-modal h3 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--text);
    }
    .confirm-modal p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 18px;
      line-height: 1.45;
    }
    .confirm-actions {
      display: flex;
      gap: 10px;
    }
    .confirm-actions button {
      flex: 1;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .12s, transform .1s;
    }
    .confirm-actions button:active { transform: scale(.98); }
    .confirm-cancel {
      background: var(--surface-2);
      color: var(--text);
    }
    .confirm-cancel:hover { background: var(--border); }
    .confirm-danger {
      background: var(--danger);
      color: #fff;
    }
    .confirm-danger:hover { background: color-mix(in srgb, var(--danger) 88%, #000); }
    .confirm-danger:disabled { opacity: .6; cursor: not-allowed; }
    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background-color .15s;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { background: var(--border); }
    .icon-btn svg { width: 22px; height: 22px; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      /* Bottom padding: the composer handles its own safe-area + keyboard
         inset, so .main only needs a small breather here so message content
         doesn't butt right up against the composer. */
      padding-bottom: 8px;
    }

    /* -------- pull-to-refresh -------- */
    #ptrIndicator {
      position: fixed;
      top: calc(var(--safe-top) + 8px);
      left: 50%;
      transform: translate(-50%, -64px); /* hidden just above the visible area */
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(20,12,40,.12);
      z-index: 60;
      pointer-events: none;
      color: var(--text-muted);
      will-change: transform;
    }
    #ptrIndicator .ptr-arrow {
      transition: transform .18s ease, color .18s ease;
      display: block;
    }
    #ptrIndicator.ptr-ready .ptr-arrow {
      transform: rotate(180deg);
      color: var(--accent);
    }
    #ptrIndicator .ptr-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: ptr-spin .8s linear infinite;
    }
    #ptrIndicator.ptr-refreshing .ptr-arrow { display: none; }
    #ptrIndicator.ptr-refreshing .ptr-spinner { display: block; }
    @keyframes ptr-spin { to { transform: rotate(360deg); } }

    /* -------- shared components -------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-1);
    }
    .card + .card { margin-top: 12px; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .help {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 6px;
      line-height: 1.5;
    }
    .help a { word-break: break-all; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row + .row { margin-top: 10px; }
    .stack-12 > * + * { margin-top: 12px; }
    .stack-16 > * + * { margin-top: 16px; }
    .stack-20 > * + * { margin-top: 20px; }
    .muted { color: var(--text-muted); }
    .faint { color: var(--text-faint); }
    .small { font-size: 13px; }
    .tiny { font-size: 12px; }
    .center { text-align: center; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--tap);
      padding: 0 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.005em;
      background: var(--surface-2);
      color: var(--text);
      transition: transform .04s ease, background-color .15s, opacity .15s;
      width: 100%;
    }
    .btn:hover { background: var(--border); }
    .btn:active { transform: scale(.985); }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text-muted)); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-ghost { background: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { width: auto; flex: 1; }

    /* badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      max-width: 100%;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }
    .badge-open { color: var(--success); background: var(--success-soft); border-color: transparent; }
    .badge-closed { color: var(--text-muted); background: var(--surface-2); }
    .badge-pending { color: var(--warning); background: color-mix(in srgb, var(--warning) 15%, transparent); border-color: transparent; }
    .badge-snoozed { color: var(--primary); background: var(--primary-soft); border-color: transparent; }

    /* -------- list view -------- */
    .search {
      position: relative;
      margin-bottom: 14px;
    }
    .search input {
      padding-left: 40px;
      background: var(--surface);
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    /* Single-row filter chips (Status / Assignees / Date). Horizontally
       scrollable on narrow screens but fits all three on iPhone 13/17 widths. */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      min-height: 34px;
      transition: background-color .15s, color .15s, border-color .15s;
    }
    .filter-chip:hover { background: var(--surface-2); }
    .filter-chip:active { transform: scale(.98); }
    .filter-chip.is-active {
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      color: var(--accent);
    }
    .filter-chip .filter-chip-value { font-weight: 600; }
    .filter-chip .filter-chip-count {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      min-width: 18px;
      text-align: center;
    }
    .filter-chip .chevron { opacity: .55; flex-shrink: 0; }

    /* Filter popover sheets (Status, Assignees) — reuse confirm-overlay/modal
       structure but with a list of selectable rows instead of buttons. */
    .filter-sheet { max-width: 360px; text-align: left; }
    .filter-sheet h3 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-sheet-hint {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .filter-list {
      list-style: none;
      padding: 0;
      margin: 0 0 14px;
      max-height: 50dvh;
      overflow-y: auto;
    }
    .filter-list li { padding: 0; margin: 0; }
    .filter-row-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 6px;
      border: none;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 14.5px;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
    }
    .filter-row-btn:hover { background: var(--surface-2); }
    .filter-row-btn + .filter-row-btn { border-top: none; }
    .filter-row-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: background-color .12s, border-color .12s, color .12s;
      flex-shrink: 0;
    }
    .filter-row-btn[aria-pressed="true"] .filter-row-check {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-row-label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .filter-row-sublabel {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .filter-search {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .filter-search:focus { border-color: var(--accent); }
    .filter-empty {
      list-style: none;
      padding: 24px 8px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .filter-row-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--surface-2);
    }
    .chip {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .issue-list { list-style: none; padding: 0; margin: 0; }
    .issue-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .issue-num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-muted); }
    .issue-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.005em;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .issue-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .dot { color: var(--text-faint); }

    /* -------- detail view -------- */
    .detail-header {
      padding: 2px 2px 10px;
    }
    .detail-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.2;
      margin: 2px 0 6px;
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .thread {
      list-style: none;
      padding: 0;
      margin: 0 0 20px;
    }
    .msg {
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
    }
    .msg + .msg { margin-top: 10px; }
    .msg-internal {
      background: color-mix(in srgb, var(--warning) 8%, var(--surface));
      border-color: color-mix(in srgb, var(--warning) 22%, var(--border));
    }
    .msg-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .msg-author { font-weight: 600; color: var(--text); }
    .msg-time { color: var(--text-faint); font-size: 12px; }
    .msg-body {
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    /* Inline images from email bodies. !important here defeats any width/height
       attributes (e.g. <img width="600">) that authors set in their email HTML —
       on a narrow phone bubble those make screenshots look squashed. */
    .msg-body img {
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      border-radius: 8px;
      display: block;
      margin: 6px 0;
      cursor: zoom-in;
    }
    .msg-body a > img { cursor: zoom-in; }
    .msg-body p { margin: 0 0 .8em; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body blockquote {
      margin: .6em 0;
      padding: .2em 0 .2em .8em;
      border-left: 3px solid var(--border-strong);
      color: var(--text-muted);
    }
    /* Attachments — shown under the message body for messages with file_urls. */
    .attachments {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .att-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .att-image {
      display: block;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-2);
      max-width: 100%;
      line-height: 0;
      transition: transform .12s ease, box-shadow .15s ease;
    }
    .att-image:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20,12,40,.12); }
    .att-image img {
      display: block;
      max-width: 220px;
      max-height: 200px;
      width: auto;
      height: auto;
      object-fit: cover;
    }
    .att-files {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .att-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      transition: background-color .15s, border-color .15s, transform .12s;
    }
    .att-file:hover, .att-file:focus-visible {
      background: var(--surface);
      border-color: var(--border-strong);
    }
    .att-file:active { transform: scale(.99); }
    .att-file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }
    .att-file-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .att-file-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .att-file-ext {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      letter-spacing: .05em;
    }
    .att-file-open {
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .att-image img { cursor: zoom-in; }

    /* Full-screen image lightbox. Opens when any inline image or attachment
       thumbnail is tapped so the user can actually read the contents. */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .92);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 12px) 12px calc(var(--safe-bottom) + 12px);
      opacity: 0;
      transition: opacity .18s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .lightbox.is-open { opacity: 1; }
    .lightbox-img-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      /* All gestures are handled in JS — tell the browser to deliver them raw. */
      touch-action: none;
      overflow: hidden;
    }
    .lightbox-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      /* Long-press save sheet stays available — useful in a photo viewer. */
    }
    .lightbox-close, .lightbox-open-orig {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color .15s ease, transform .12s ease;
    }
    .lightbox-close { top: calc(var(--safe-top) + 12px); right: 12px; }
    .lightbox-open-orig {
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      height: auto;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: .01em;
      gap: 6px;
    }
    .lightbox-close:hover, .lightbox-open-orig:hover { background: rgba(255, 255, 255, .2); }
    .lightbox-close:active, .lightbox-open-orig:active { transform: scale(.95); }
    .lightbox-open-orig:active { transform: translateX(-50%) scale(.96); }

    /* Author-supplied colours are stripped at sanitize time, but as a belt-and-braces
       guard we also force the theme text colour on every message-body element with
       !important. This means even if an exotic inline colour (or a colour set by a
       newly-introduced email format) survives sanitisation, contrast is preserved in
       both light and dark mode. */
    .msg-body,
    .msg-body * { color: var(--text) !important; background-color: transparent !important; }
    /* Links keep the accent colour. */
    .msg-body a,
    .msg-body a * { color: var(--accent) !important; }
    /* Quoted-reply containers (Gmail, Outlook) should still look muted. */
    .msg-body blockquote,
    .msg-body blockquote *,
    .msg-body .gmail_quote,
    .msg-body .gmail_quote *,
    .msg-body .gmail_attr,
    .msg-body div[id^="divRplyFwdMsg"],
    .msg-body div[id^="divRplyFwdMsg"] *,
    .msg-body div[id^="appendonsend"] ~ * { color: var(--text-muted) !important; }

    /* Reply composer — pushes to the bottom of .main (flex column) and sticks
       above the keyboard when one's open. Two sources of "keyboard height":
         - env(keyboard-inset-height): iOS 16.1+ exposes the keyboard + Safari
           form accessory bar height directly. This is the most accurate value
           and includes the up/down/done bar that floats above the keyboard.
         - --kb-inset: JS fallback computed from window.visualViewport for
           older iOS versions that don't support env(keyboard-inset-height).
       Take the max so whichever browser reports a value wins, and we never
       leave a gap between the composer and whatever's covering the bottom. */
    .composer {
      margin-top: auto;
      position: sticky;
      bottom: max(env(keyboard-inset-height, 0px), var(--kb-inset, 0px));
      /* Padding-bottom: needs to lift the pill above the iOS home indicator.
         env(safe-area-inset-bottom) returns 0 in iPhone 17 standalone PWA
         (a known WebKit quirk) so we can't rely on it alone. Floor with a
         hard 30pt minimum, subtracting --kb-inset so it collapses cleanly
         when the keyboard is up. */
      padding: 6px 14px max(
        env(safe-area-inset-bottom, 0px),
        calc(30px - var(--kb-inset, 0px)),
        6px
      );
      background: var(--bg);
    }
    .composer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow-2);
    }
    .composer textarea {
      border: none;
      padding: 8px;
      min-height: 80px;
      width: 100%;
      background: transparent;
    }
    .composer textarea:focus { box-shadow: none; }
    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 32px;
    }
    .toggle input { display: none; }
    .toggle[data-on="true"] {
      background: color-mix(in srgb, var(--warning) 18%, transparent);
      color: var(--warning);
    }
    /* AI refine button — sits between toggle row and Send. */
    .composer-ai {
      margin-left: auto;
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color .15s, transform .08s, color .15s;
      position: relative;
    }
    .composer-ai + .composer-send { margin-left: 8px; }
    .composer-ai:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
    .composer-ai:active { transform: scale(.94); }
    .composer-ai:disabled { opacity: .55; cursor: progress; }
    .composer-ai .ai-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: ptr-spin .7s linear infinite;
    }
    .composer-ai.is-loading .ai-sparkle { display: none; }
    .composer-ai.is-loading .ai-spinner { display: block; }

    .composer-send {
      min-height: 44px;
      min-width: 96px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .04s;
    }
    .composer-send:active { transform: scale(.97); }
    .composer-send[disabled] { opacity: .35; cursor: not-allowed; }
    .toggle { min-height: 36px; padding: 8px 12px; cursor: pointer; }
    .thread-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      min-height: 36px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px dashed var(--border-strong);
      max-width: 180px;
    }
    .thread-chip svg { width: 14px; height: 14px; flex-shrink: 0; }
    .thread-chip[data-on="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-style: solid;
      border-color: var(--accent);
    }
    .thread-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thread-picker {
      border-top: 1px solid var(--border);
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
      background: var(--surface);
    }
    .thread-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .12s;
    }
    .thread-option:hover { background: var(--surface-2); }
    .thread-option[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .thread-option .thread-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .thread-option[aria-pressed="true"] .thread-dot { background: var(--accent); }
    .thread-option .thread-hint {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-faint);
      font-style: italic;
    }
    .thread-option-new {
      color: var(--accent);
      font-weight: 600;
      border-top: 1px solid var(--border);
      margin-top: 4px;
      border-radius: 0 0 8px 8px;
    }

    /* ============ Recipients (To/Cc/Bcc) ============ */
    .recipients-box {
      padding: 4px 10px 6px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
    }
    .rcpt-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
      min-height: 32px;
    }
    .rcpt-row + .rcpt-row { border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 2px; }
    .rcpt-label {
      flex-shrink: 0;
      min-width: 26px;
      color: var(--text-muted);
      font-weight: 600;
      padding-top: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .rcpt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .rcpt-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 4px 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      max-width: 100%;
      font-size: 12.5px;
    }
    @media (prefers-color-scheme: dark) {
      .rcpt-chip { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    }
    .rcpt-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .rcpt-remove {
      width: 20px; height: 20px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .rcpt-remove:hover { background: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      .rcpt-remove:hover { background: rgba(255,255,255,.12); }
    }
    .rcpt-add {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px dashed var(--border-strong);
      min-height: 26px;
    }
    .rcpt-add:hover { background: var(--accent-soft); border-color: var(--accent); }
    .rcpt-toggles {
      display: flex;
      gap: 6px;
      padding: 4px 0 0;
    }
    .rcpt-toggle {
      font-size: 11.5px;
      color: var(--text-faint);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .rcpt-toggle:hover { color: var(--accent); background: var(--accent-soft); }
    .state-row-label {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* states */
    .state {
      padding: 56px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .state .icon {
      width: 44px; height: 44px;
      margin: 0 auto 10px;
      opacity: .7;
    }
    .spinner {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--text);
      animation: spin .8s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* settings list rows */
    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      min-height: 56px;
      cursor: pointer;
      transition: background-color .15s;
      width: 100%;
      text-align: left;
    }
    .list-row + .list-row { border-top: 1px solid var(--border); }
    .list-row-header {
      padding: 10px 16px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .list-row-header + .list-row { border-top: 1px solid var(--border); }
    .list-row:hover { background: var(--surface-2); }
    .list-row .left { color: var(--text-muted); display: flex; align-items: center; }
    .list-row .body { flex: 1; min-width: 0; }
    .list-row .body .l1 { font-size: 14.5px; font-weight: 500; }
    .list-row .body .l2 { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .right { color: var(--text-faint); }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 24px);
      transform: translate(-50%, 30px);
      background: var(--accent);
      color: var(--accent-text);
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-2);
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 50;
      max-width: 92vw;
      width: max-content;
      pointer-events: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* Only enable clicks on the toast while it's actually visible. Without
       this, the invisible-but-still-in-DOM error toast (which is 92vw wide
       and sits right over the bottom-nav) intercepted taps on the Search
       and Me tabs after the user dismissed it. */
    .toast.error.show { pointer-events: auto; }
    .toast.error {
      background: var(--danger);
      color: white;
      max-width: 92vw;
      width: 92vw;
      padding: 14px 18px 14px 18px;
      border-radius: 14px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Menlo", monospace;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .toast.error::after {
      content: "Tap to dismiss";
      display: block;
      margin-top: 8px;
      font-size: 11px;
      opacity: .7;
      font-family: var(--font);
      font-style: italic;
    }
    .toast.success { background: var(--success); color: white; }

    /* hidden helper */
    [hidden] { display: none !important; }

    /* logo */
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -.02em;
      margin-bottom: 14px;
    }

    /* media: scale up on bigger screens */
    @media (min-width: 600px) {
      .main { padding: 20px; }
    }

    /* ============ Pylon-style refinements ============ */
    .header { background: color-mix(in srgb, var(--bg) 78%, transparent); }

    /* Avatar circles (initial + deterministic color) */
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -.01em;
      color: white;
      flex-shrink: 0;
      background: var(--accent);
      user-select: none;
    }
    .avatar-sm { width: 28px; height: 28px; font-size: 11px; }
    .avatar-xs { width: 22px; height: 22px; font-size: 10px; }
    .avatar-system { background: var(--text-muted); }

    /* Vibrant state badges */
    .badge-open    { color: var(--success); background: var(--success-soft); border: none; }
    .badge-closed  { color: var(--text-muted); background: var(--surface-2); border: none; }
    .badge-pending { color: var(--warning); background: var(--warning-soft); border: none; }
    .badge-snoozed { color: var(--info); background: var(--info-soft); border: none; }
    .badge-on-hold { color: var(--accent); background: var(--accent-soft); border: none; }
    .badge-new     { color: var(--accent); background: var(--accent-soft); border: none; }

    /* ===== Issue card (Pylon-web inspired) ===== */
    .issue-card {
      display: block;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      cursor: pointer;
      transition: border-color .15s, transform .04s;
    }
    .issue-card + .issue-card { margin-top: 10px; }
    .issue-card:hover { border-color: var(--accent); }
    .issue-card:active { transform: scale(.995); }

    .card-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .account-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
      flex-shrink: 0;
    }
    .account-logo-empty {
      background: var(--surface-2);
      color: var(--text-faint);
      font-weight: 500;
    }
    .card-account-empty {
      color: var(--text-faint);
      font-weight: 600;
      font-style: italic;
    }
    .card-top-text { min-width: 0; }
    .card-top-line1 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .card-account {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .card-issue-num {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .card-top-line2 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      min-width: 0;
    }
    .card-requester {
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .card-state { flex-shrink: 0; align-self: start; }

    .card-subject {
      margin-top: 10px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-subject-label {
      color: var(--text-muted);
      font-weight: 500;
      margin-right: 4px;
    }

    .card-body-preview {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 1.45em;
    }
    .card-preview-placeholder {
      color: var(--text-faint);
      font-style: italic;
    }

    .card-footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .card-assignee {
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .card-assignee em {
      font-style: italic;
      font-weight: 500;
      color: var(--text-faint);
    }
    .card-dot { color: var(--text-faint); }
    .card-time { color: var(--text-faint); }

    /* Active filter chip — accent background */
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .chip { transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s; }

    /* Header gets a subtle bottom border only when scrolled */
    .header { border-bottom-color: var(--border); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      max-width: 720px;
      margin: 0 auto;
      /* Same hard floor as the composer — env(safe-area-inset-bottom) returns
         0 in iPhone 17 standalone PWA, so we need a 28pt minimum to keep the
         labels clear of the home indicator gesture line. */
      padding: 2px 6px max(env(safe-area-inset-bottom, 0px), 28px);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-top: 1px solid var(--border);
    }
    /* Paint the safe-area-inset-bottom region with the nav surface colour so
       it doesn't show through as dark body background. Only applies in
       standalone PWA mode — Safari hides this area under its URL bar so
       there's nothing to fix. */
    html.is-standalone body::after {
      content: '';
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      height: env(safe-area-inset-bottom, 0px);
      background: color-mix(in srgb, var(--surface) 92%, var(--bg));
      z-index: 19;
      pointer-events: none;
    }
    .bottom-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 4px 4px;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s, transform .04s;
    }
    .bottom-nav-btn:active { transform: scale(.96); }
    .bottom-nav-btn[aria-current="true"] { color: var(--accent); }
    .bottom-nav-btn svg { width: 22px; height: 22px; }

    /* Rich text editor */
    .editor-toolbar {
      display: flex;
      gap: 2px;
      padding: 3px 6px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tbtn {
      min-width: 28px; height: 28px;
      padding: 0 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .12s, color .12s;
      flex-shrink: 0;
    }
    .tbtn:hover { background: var(--surface-2); color: var(--text); }
    .tbtn:active { background: var(--border); }
    .tbtn svg { width: 16px; height: 16px; }
    .tbtn-divider {
      width: 1px;
      height: 22px;
      align-self: center;
      background: var(--border);
      margin: 0 3px;
    }
    .editor {
      min-height: 64px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      color: var(--text);
    }
    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--text-faint);
      pointer-events: none;
    }
    .editor p { margin: 0 0 .5em; }
    .editor p:last-child { margin-bottom: 0; }
    .editor ul, .editor ol { margin: .3em 0 .5em 1.2em; padding: 0; }
    .editor a { color: var(--accent); text-decoration: underline; }

    /* Refined composer */
    .composer { margin-top: 8px; }
    .composer-card {
      box-shadow: var(--shadow-2);
      border-radius: var(--radius);
      overflow: hidden;
      padding: 0;
      border-color: var(--border);
    }
    .composer-actions {
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }
    .composer-send {
      background: var(--accent);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .composer-send:hover { background: var(--accent-strong); }

    /* Collapsed pill — sits at the bottom of the detail view when composer is closed */
    .composer-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-2);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: background-color .15s, border-color .15s, transform .04s;
      text-align: left;
      min-height: 42px;
    }
    .composer-pill:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }
    .composer-pill:active { transform: scale(.99); }
    .composer-pill-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .composer-pill-icon svg { width: 18px; height: 18px; }
    .composer-pill-text { flex: 1; }
    .composer-pill-draft {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--warning-soft);
      color: var(--warning);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Composer header — the title row with the minimize chevron */
    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .composer-header-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-faint);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .composer-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color .12s, color .12s;
    }
    .composer-close:hover { background: var(--surface-2); color: var(--text); }
    .composer-close svg { width: 18px; height: 18px; }

    /* Detail page tweaks */
    .detail-title { font-size: 24px; }
    .msg {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }
    .msg-content { min-width: 0; }
    .msg-internal {
      background: var(--warning-soft);
      border-color: color-mix(in srgb, var(--warning) 30%, var(--border));
    }

    /* FAB for new actions (reserved space) */
    .fab {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 16px);
      right: 20px;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
      z-index: 15;
      cursor: pointer;
      transition: transform .08s;
    }
    .fab:active { transform: scale(.94); }

    /* Logo update */
    .logo {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    /* Chip count pill */
    .chip-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 6px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .chip[aria-pressed="true"] .chip-count {
      background: rgba(255,255,255,.22);
      color: white;
    }
    .chip-with-avatar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-left: 6px;
    }
    .chip-with-avatar .avatar {
      box-shadow: 0 0 0 2px var(--surface);
    }
    .chip[aria-pressed="true"] .avatar {
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* Issue assignee block (top-right of card) */
    .issue-top-right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .assignee {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 110px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
    }
    .assignee-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80px;
    }
    .assignee-empty {
      color: var(--text-faint);
      font-style: italic;
      font-size: 11px;
    }
    .issue-time {
      color: var(--text-faint);
      font-size: 11px;
      white-space: nowrap;
    }
    /* On very narrow screens hide the assignee name, keep the avatar */
    @media (max-width: 380px) {
      .assignee-name { display: none; }
      .assignee-empty { display: none; }
    }

    /* ============ Tags ============ */
    .tags-section { margin-top: 6px; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px 4px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      max-width: 100%;
      line-height: 1.3;
    }
    .tag-pill .tag-remove {
      width: 18px; height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: inherit;
      opacity: .6;
      margin-left: 2px;
      cursor: pointer;
    }
    .tag-pill .tag-remove:hover { opacity: 1; background: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      .tag-pill .tag-remove:hover { background: rgba(255,255,255,.12); }
    }
    .tag-add {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px dashed var(--border-strong);
      cursor: pointer;
      min-height: 28px;
      transition: background-color .15s, color .15s, border-color .15s;
    }
    .tag-add:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    .tag-picker {
      margin-top: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .tag-picker input[type="search"] {
      border: none;
      border-radius: 0;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      background: transparent;
      font-size: 14px;
    }
    .tag-picker input[type="search"]:focus { box-shadow: none; border-color: var(--border); }
    .tag-options {
      max-height: 240px;
      overflow-y: auto;
      padding: 4px;
    }
    .tag-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .12s;
    }
    .tag-option:hover { background: var(--surface-2); }
    .tag-option:active { background: var(--surface-3); }
    .tag-swatch {
      width: 14px; height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Tags on issue list cards (small, dense) */
    .issue-item .tag-pill { font-size: 11px; padding: 1px 8px; }

    /* Account name badge on issue cards */
    .account-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.4;
    }
    .account-badge svg { width: 11px; height: 11px; flex-shrink: 0; opacity: .8; }
    .issue-requester {
      color: var(--text-muted);
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .account-badge { color: var(--text); background: color-mix(in srgb, var(--accent) 20%, transparent); }
    }

    /* ============ Sign-in: how-to panel + advanced collapse ============ */
    .help-panel {
      margin-top: 10px;
      padding: 12px 14px 14px;
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
      border-radius: 12px;
      color: var(--text);
      font-size: 13px;
    }
    .help-panel code {
      background: rgba(0,0,0,.06);
      padding: 0 4px;
      border-radius: 4px;
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .help-panel code { background: rgba(255,255,255,.08); }
    }
    .help-panel a { color: var(--accent); font-weight: 600; }
    .btn-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-link:hover { color: var(--accent); }
    .advanced-section { padding-top: 4px; border-top: 1px dashed var(--border); }

    /* ============ PWA banners ============ */
    .pwa-install-bar, .pwa-update-bar {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 12px);
      transform: translateX(-50%);
      max-width: 92vw;
      width: max-content;
      z-index: 100;
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow-2);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pwa-install-bar button, .pwa-update-bar button {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .pwa-install-bar button:not([aria-label]),
    .pwa-update-bar button:not([aria-label]) {
      background: var(--accent);
      color: white;
    }
    .pwa-install-bar button[aria-label],
    .pwa-update-bar button[aria-label] {
      background: transparent;
      color: var(--text-faint);
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
    }
    .pwa-update-bar { background: var(--accent); color: white; border-color: transparent; }
    .pwa-update-bar button[aria-label] { color: rgba(255,255,255,.7); }
    .pwa-update-bar button:not([aria-label]) { background: white; color: var(--accent); }
    html.is-standalone .pwa-install-bar { display: none; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ HEADER (dynamic) ============ -->
    <header class="header" id="header">
      <button class="icon-btn" id="hdrLeft" hidden aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="header-title" id="hdrTitle">Pylon</div>
      <button class="icon-btn" id="hdrRight" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main class="main" id="main">
      <!-- views injected here -->
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" hidden>
    <button class="bottom-nav-btn" data-nav="list" aria-current="true" aria-label="Inbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span>Inbox</span>
    </button>
    <button class="bottom-nav-btn" data-nav="search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="bottom-nav-btn" data-nav="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
      <span>Me</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    // ============ Config / Storage ============
    const STORAGE_KEY = 'pylonMobile.config.v1';
    const DEFAULT_BASE = 'https://api.usepylon.com';
    // Keep this in sync with sw.js VERSION on every release. Shown at the
    // bottom of the Settings screen so the user can verify which build their
    // PWA is currently running after an update.
    const APP_VERSION = 'pylon-mobile-v29';
    const DEFAULT_AI_MODEL = 'llama-3.3-70b-versatile';
    const DEFAULT_AI_PROMPT =
      "You are an experienced customer support specialist helping me refine my reply to a Pylon support ticket. " +
      "Keep my intent and voice, but make the message clearer, friendlier, and more professional. " +
      "Do not invent facts about the product or commit to anything I haven't said. " +
      "Return ONLY the refined reply body — no preamble, no sign-off unless mine had one, and no quoted ticket history.";

    const cfg = loadConfig();

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const defaults = {
          apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '',
          aiApiKey: '', aiSystemPrompt: '', aiModel: DEFAULT_AI_MODEL,
        };
        if (!raw) return defaults;
        const merged = Object.assign(defaults, JSON.parse(raw));
        // Migration: v13/v14 used Anthropic, v15 used Google Gemini, v17+ uses
        // Groq (the Gemini free tier was effectively unavailable on Workspace/
        // billing-attached Google accounts). Reset any stale model so the
        // request shape matches the active provider.
        if (merged.aiModel && (/^claude-/i.test(merged.aiModel) || /^gemini-/i.test(merged.aiModel))) {
          merged.aiModel = DEFAULT_AI_MODEL;
        }
        // Old keys from prior providers won't auth against Groq (Groq keys
        // look like gsk_...). Clear known foreign key shapes.
        if (merged.aiApiKey && (/^sk-ant-/i.test(merged.aiApiKey) || /^AIza/i.test(merged.aiApiKey))) {
          merged.aiApiKey = '';
        }
        return merged;
      } catch {
        return {
          apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '',
          aiApiKey: '', aiSystemPrompt: '', aiModel: DEFAULT_AI_MODEL,
        };
      }
    }
    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    }
    function clearConfig() {
      localStorage.removeItem(STORAGE_KEY);
      cfg.apiKey = '';
      cfg.base = DEFAULT_BASE;
      cfg.proxy = '';
      cfg.aiApiKey = '';
      cfg.aiSystemPrompt = '';
      cfg.aiModel = DEFAULT_AI_MODEL;
    }

    // ============ API ============
    function apiUrl(path, query) {
      const base = (cfg.proxy && cfg.proxy.trim()) ? cfg.proxy.replace(/\/$/, '') : cfg.base.replace(/\/$/, '');
      let url = base + path;
      if (query) {
        const qs = new URLSearchParams();
        for (const [k, v] of Object.entries(query)) {
          if (v === undefined || v === null || v === '') continue;
          qs.set(k, v);
        }
        const s = qs.toString();
        if (s) url += '?' + s;
      }
      return url;
    }
    async function api(method, path, { query, body } = {}) {
      if (!cfg.apiKey) throw new Error('Missing API key');
      const url = apiUrl(path, query);
      const started = Date.now();
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': 'Bearer ' + cfg.apiKey,
          'Accept': 'application/json',
          ...(body ? { 'Content-Type': 'application/json' } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { _raw: text }; }
      logCall({
        method, path, status: res.status, ok: res.ok,
        ms: Date.now() - started,
        excerpt: text ? text.slice(0, 600) : '',
      });
      if (!res.ok) {
        // Surface Pylon's actual error message verbatim
        const inner = data && (data.error || data.message || (data.errors && JSON.stringify(data.errors))) || text || '';
        const err = new Error(`HTTP ${res.status}${inner ? ` — ${String(inner).slice(0, 240)}` : ''}`);
        err.status = res.status;
        err.body = data;
        err.endpoint = `${method} ${path}`;
        throw err;
      }
      return data;
    }

    // Pylon endpoint helpers — see https://docs.usepylon.com/pylon-docs/developer/api/api-reference
    const Pylon = {
      me: () => api('GET', '/me'),
      listIssues: (q) => api('GET', '/issues', { query: q }),
      getIssue: (id) => api('GET', `/issues/${encodeURIComponent(id)}`),
      listMessages: (id) => api('GET', `/issues/${encodeURIComponent(id)}/messages`),
      listMessagesAlt: (id) => api('GET', '/messages', { query: { issue_id: id } }),
      reply: (id, payload) => api('POST', `/issues/${encodeURIComponent(id)}/messages`, { body: payload }),
      replyAlt: (id, payload) => api('POST', '/messages', { body: Object.assign({ issue_id: id }, payload) }),
      updateIssue: (id, body) => api('PATCH', `/issues/${encodeURIComponent(id)}`, { body }),
      deleteIssue: (id) => api('DELETE', `/issues/${encodeURIComponent(id)}`),
      listUsers: () => api('GET', '/users'),
      listContacts: () => api('GET', '/contacts'),
      getContact: (id) => api('GET', `/contacts/${encodeURIComponent(id)}`),
      listTags: () => api('GET', '/tags'),
      listAccounts: (q) => api('GET', '/accounts', { query: q }),
      getAccount: (id) => api('GET', `/accounts/${encodeURIComponent(id)}`),
      // Reply / note / thread endpoints (Pylon docs)
      replyPublic: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/reply`, { body }),
      postNote: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/note`, { body }),
      createThread: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/threads`, { body }),
      listThreads: (id) => api('GET', `/issues/${encodeURIComponent(id)}/threads`),
    };

    // Tag cache
    const tagCache = { tags: [], loaded: false, loading: null };
    async function ensureTagsLoaded() {
      if (tagCache.loaded) return tagCache.tags;
      if (tagCache.loading) return tagCache.loading;
      tagCache.loading = (async () => {
        try {
          const r = await Pylon.listTags();
          const list = extractList(r);
          // Normalize — accept array of strings or array of {name,id,color}
          tagCache.tags = list.map(t => typeof t === 'string' ? { name: t } : t).filter(t => t && (t.name || t.value || t.label));
        } catch {
          tagCache.tags = [];
        } finally {
          tagCache.loaded = true;
          tagCache.loading = null;
        }
        return tagCache.tags;
      })();
      return tagCache.loading;
    }
    function tagNameOf(t) { return (t && (t.name || t.value || t.label)) || ''; }

    // Tiny in-memory cache so author UUIDs resolve to names without re-fetching.
    const peopleCache = { users: {}, contacts: {}, loaded: false };
    const accountCache = { byId: {}, loaded: false, loading: null };

    async function ensurePeopleLoaded() {
      if (peopleCache.loaded) return;
      peopleCache.loaded = true; // attempt only once per session
      try {
        const u = await Pylon.listUsers().catch(() => null);
        const us = extractList(u) || [];
        for (const x of us) {
          if (x && x.id) peopleCache.users[x.id] = x;
        }
      } catch {}
      try {
        const c = await Pylon.listContacts().catch(() => null);
        const cs = extractList(c) || [];
        for (const x of cs) {
          if (x && x.id) peopleCache.contacts[x.id] = x;
        }
      } catch {}
    }

    async function ensureAccountsLoaded() {
      if (accountCache.loaded) return accountCache.byId;
      if (accountCache.loading) return accountCache.loading;
      accountCache.loading = (async () => {
        try {
          // Paginate through Pylon's /accounts using cursor — Pylon caps a single
          // page at 100; we keep walking until has_next_page is false or we hit a
          // sanity cap to avoid runaway loops on huge workspaces.
          let cursor = null;
          let pages = 0;
          while (pages < 20) { // up to 20 * 100 = 2000 accounts
            const resp = await Pylon.listAccounts({ limit: 100, cursor }).catch(() => null);
            if (!resp) break;
            const list = extractList(resp) || [];
            for (const a of list) {
              if (a && a.id) accountCache.byId[a.id] = a;
            }
