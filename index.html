      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .pwa-install-bar button:not([aria-label]),
    .pwa-update-bar button:not([aria-label]) {
      background: var(--accent);
      color: white;
    }
    .pwa-install-bar button[aria-label],
    .pwa-update-bar button[aria-label] {
      background: transparent;
      color: var(--text-faint);
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
    }
    .pwa-update-bar { background: var(--accent); color: white; border-color: transparent; }
    .pwa-update-bar button[aria-label] { color: rgba(255,255,255,.7); }
    .pwa-update-bar button:not([aria-label]) { background: white; color: var(--accent); }
    html.is-standalone .pwa-install-bar { display: none; }
  </style>
</head>
<body>
  <div class="app">

      <span>Me</span>
    </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    // ============ Config / Storage ============
    const STORAGE_KEY = 'pylonMobile.config.v1';
    const DEFAULT_BASE = 'https://api.usepylon.com';
    // Keep this in sync with sw.js VERSION on every release. Shown at the
    // bottom of the Settings screen so the user can verify which build their
    // PWA is currently running after an update.
    const APP_VERSION = 'pylon-mobile-v43';
    const DEFAULT_AI_MODEL = 'llama-3.3-70b-versatile';
    const DEFAULT_AI_PROMPT =
      "You are an experienced customer support specialist helping me refine my reply to a Pylon support ticket. " +
      "Keep my intent and voice, but make the message clearer, friendlier, and more professional. " +
      "Do not invent facts about the product or commit to anything I haven't said. " +
      "Return ONLY the refined reply body — no preamble, no sign-off unless mine had one, and no quoted ticket history.";

    const cfg = loadConfig();

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const defaults = {
          apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '',
          aiApiKey: '', aiSystemPrompt: '', aiModel: DEFAULT_AI_MODEL,
          splitListCollapsed: false,
        };
        if (!raw) return defaults;
        const merged = Object.assign(defaults, JSON.parse(raw));
        // Migration: v13/v14 used Anthropic, v15 used Google Gemini, v17+ uses
        // Groq (the Gemini free tier was effectively unavailable on Workspace/
        // billing-attached Google accounts). Reset any stale model so the
        // request shape matches the active provider.
        if (merged.aiModel && (/^claude-/i.test(merged.aiModel) || /^gemini-/i.test(merged.aiModel))) {
          merged.aiModel = DEFAULT_AI_MODEL;
        }
        // Old keys from prior providers won't auth against Groq (Groq keys
        // look like gsk_...). Clear known foreign key shapes.
        if (merged.aiApiKey && (/^sk-ant-/i.test(merged.aiApiKey) || /^AIza/i.test(merged.aiApiKey))) {
          merged.aiApiKey = '';
        }
        return merged;
      } catch {
        return {
          apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '',
          aiApiKey: '', aiSystemPrompt: '', aiModel: DEFAULT_AI_MODEL,
          splitListCollapsed: false,
        };
      }
    }
    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    }
    function clearConfig() {
      localStorage.removeItem(STORAGE_KEY);
      cfg.apiKey = '';
      cfg.base = DEFAULT_BASE;
      cfg.proxy = '';
      cfg.aiApiKey = '';
      cfg.aiSystemPrompt = '';
      cfg.aiModel = DEFAULT_AI_MODEL;
    }

    // ============ API ============
    function apiUrl(path, query) {
      const proxy = (cfg.proxy && cfg.proxy.trim()) || '';
      const directBase = cfg.base.replace(/\/$/, '');

      // Build the query string against the *real* Pylon URL — that's what
      // gets appended to the proxy regardless of proxy style.
      let qs = '';
      if (query) {
        const params = new URLSearchParams();
        for (const [k, v] of Object.entries(query)) {
          if (v === undefined || v === null || v === '') continue;
          params.set(k, v);
        }
        const s = params.toString();
        if (s) qs = '?' + s;
      }
      const fullTarget = directBase + path + qs;

      // No proxy → direct call to Pylon (works on iOS Safari pre-iOS 16 with
      // CORS hooks but typically blocked; users need a proxy on the web).
      if (!proxy) return fullTarget;

      // Query-param style proxies (corsproxy.io, cors-anywhere with ?url=).
      // The full target URL is appended as the value of the trailing query
      // parameter, URL-encoded.
      if (/\?(?:[a-z_]+=)?$/i.test(proxy)) {
        return proxy + encodeURIComponent(fullTarget);
      }

      // Path-prefix proxies (own Cloudflare Worker, cors-anywhere classic,
      // custom edge functions). Just glue the path on after stripping any
      // trailing slash on the proxy URL.
      return proxy.replace(/\/$/, '') + path + qs;
    }
    // Global rate-limit timestamp. When Pylon returns 429 we set this to a
    // point in the future. Background paths (polling, body-preview loader,
    // foreground-resume) check it and skip their work until the window
    // elapses. Honest user-initiated actions still go through — they should
    // see the 429 toast directly if it happens.
    // (state._rateLimitedUntil is lazily initialised on the first 429 — until
    // then `state._rateLimitedUntil` is undefined which compares false.)
    function isRateLimited() {
      return Date.now() < (state && state._rateLimitedUntil || 0);
    }
    function _rateLimitedToastShown() {
      // Don't spam toasts — show once per back-off window.
      const now = Date.now();
      if ((window._rateLimitedToastAt || 0) > now - 60_000) return;
      window._rateLimitedToastAt = now;
      try {
        toast('Pylon API rate-limited — pausing background refresh for 60s', 'error');
      } catch {}
    }

    async function api(method, path, { query, body } = {}) {
      if (!cfg.apiKey) throw new Error('Missing API key');
      const url = apiUrl(path, query);
      const started = Date.now();
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': 'Bearer ' + cfg.apiKey,
          'Accept': 'application/json',
          ...(body ? { 'Content-Type': 'application/json' } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { _raw: text }; }
      logCall({
        method, path, status: res.status, ok: res.ok,
        ms: Date.now() - started,
        excerpt: text ? text.slice(0, 600) : '',
      });
      if (res.status === 429) {
        // Pylon's docs say most endpoints are 20-30 req/min. When we hit the
        // limit, back off for 60s so polling + body-preview loader + AI
        // search etc. don't keep hammering and worsening things.
        state._rateLimitedUntil = Date.now() + 60_000;
        _rateLimitedToastShown();
      }
      if (!res.ok) {
        // Surface Pylon's actual error message verbatim
        const inner = data && (data.error || data.message || (data.errors && JSON.stringify(data.errors))) || text || '';
        const err = new Error(`HTTP ${res.status}${inner ? ` — ${String(inner).slice(0, 240)}` : ''}`);
        err.status = res.status;
        err.body = data;
        err.endpoint = `${method} ${path}`;
        throw err;
      }
      return data;
    }

    // Pylon endpoint helpers — see https://docs.usepylon.com/pylon-docs/developer/api/api-reference
    const Pylon = {
      me: () => api('GET', '/me'),
      listIssues: (q) => api('GET', '/issues', { query: q }),
      getIssue: (id) => api('GET', `/issues/${encodeURIComponent(id)}`),
      listMessages: (id) => api('GET', `/issues/${encodeURIComponent(id)}/messages`),
      listMessagesAlt: (id) => api('GET', '/messages', { query: { issue_id: id } }),
      reply: (id, payload) => api('POST', `/issues/${encodeURIComponent(id)}/messages`, { body: payload }),
      replyAlt: (id, payload) => api('POST', '/messages', { body: Object.assign({ issue_id: id }, payload) }),
      updateIssue: (id, body) => api('PATCH', `/issues/${encodeURIComponent(id)}`, { body }),
      deleteIssue: (id) => api('DELETE', `/issues/${encodeURIComponent(id)}`),
      listUsers: () => api('GET', '/users'),
      listContacts: () => api('GET', '/contacts'),
      getContact: (id) => api('GET', `/contacts/${encodeURIComponent(id)}`),
      listTags: () => api('GET', '/tags'),
      listAccounts: (q) => api('GET', '/accounts', { query: q }),
      getAccount: (id) => api('GET', `/accounts/${encodeURIComponent(id)}`),
      // Reply / note / thread endpoints (Pylon docs)
      replyPublic: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/reply`, { body }),
      postNote: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/note`, { body }),
      createThread: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/threads`, { body }),
      listThreads: (id) => api('GET', `/issues/${encodeURIComponent(id)}/threads`),
    };

    // Tag cache
    const tagCache = { tags: [], loaded: false, loading: null };
    async function ensureTagsLoaded() {
      if (tagCache.loaded) return tagCache.tags;
      if (tagCache.loading) return tagCache.loading;
      tagCache.loading = (async () => {
        try {
          const r = await Pylon.listTags();
          const list = extractList(r);
          // Normalize — accept array of strings or array of {name,id,color}
          tagCache.tags = list.map(t => typeof t === 'string' ? { name: t } : t).filter(t => t && (t.name || t.value || t.label));
        } catch {
          tagCache.tags = [];
        } finally {
          tagCache.loaded = true;
          tagCache.loading = null;
        }
        return tagCache.tags;
      })();
      return tagCache.loading;
    }
    function tagNameOf(t) { return (t && (t.name || t.value || t.label)) || ''; }

    // Tiny in-memory cache so author UUIDs resolve to names without re-fetching.
    const peopleCache = { users: {}, contacts: {}, loaded: false };
    const accountCache = { byId: {}, loaded: false, loading: null };

    async function ensurePeopleLoaded() {
      if (peopleCache.loaded) return;
      peopleCache.loaded = true; // attempt only once per session
      try {
        const u = await Pylon.listUsers().catch(() => null);
        const us = extractList(u) || [];
        for (const x of us) {
          if (x && x.id) peopleCache.users[x.id] = x;
        }
        try { savePeopleCache(); } catch {}
      } catch {}
      try {
        // Paginate contacts the same way we paginate accounts. Pylon caps a
        // single /contacts page at 100, so workspaces with many requesters
        // would otherwise only get the first 100 cached and the rest fall
        // back to placeholder labels in the filter picker.
        let cursor = null;
        let pages = 0;
        while (pages < 30) { // up to 30 * 100 = 3,000 contacts
          const resp = await Pylon.listContacts(cursor ? { limit: 100, cursor } : { limit: 100 }).catch(() => null);
          if (!resp) break;
          const cs = extractList(resp) || [];
          for (const x of cs) {
            if (x && x.id) peopleCache.contacts[x.id] = x;
          }
          const next = resp.cursor || (resp.pagination && resp.pagination.cursor) || (resp.data && resp.data.cursor) || null;
          const hasNext = (typeof resp.has_next_page === 'boolean' ? resp.has_next_page
                          : (resp.pagination && typeof resp.pagination.has_next_page === 'boolean' ? resp.pagination.has_next_page
                          : (typeof (resp.data && resp.data.has_next_page) === 'boolean' ? resp.data.has_next_page
                          : !!next)));
          if (!hasNext || !next || cs.length === 0) break;
          cursor = next;
          pages++;
        }
        try { savePeopleCache(); } catch {}
      } catch {}
    }

    async function ensureAccountsLoaded() {
      if (accountCache.loaded) return accountCache.byId;
      if (accountCache.loading) return accountCache.loading;
      accountCache.loading = (async () => {
        try {
          // Paginate through Pylon's /accounts using cursor — Pylon caps a single
          // page at 100; we keep walking until has_next_page is false or we hit a
          // sanity cap to avoid runaway loops on huge workspaces.
          let cursor = null;
          let pages = 0;
          while (pages < 20) { // up to 20 * 100 = 2000 accounts
            const resp = await Pylon.listAccounts({ limit: 100, cursor }).catch(() => null);
            if (!resp) break;
            const list = extractList(resp) || [];
            for (const a of list) {
              if (a && a.id) accountCache.byId[a.id] = a;
            }
            // Detect next-cursor in common shapes
            const next = resp.cursor || (resp.data && resp.data.cursor) || null;
            const hasNext = (typeof resp.has_next_page === 'boolean' ? resp.has_next_page
                            : (typeof (resp.data && resp.data.has_next_page) === 'boolean' ? resp.data.has_next_page
                            : !!next));
            if (!hasNext || !next || list.length === 0) break;
            cursor = next;
            pages++;
          }
        } catch {} finally {
          accountCache.loaded = true;
          accountCache.loading = null;
          try { saveAccountsCache(); } catch {}
        }
        return accountCache.byId;
      })();
      return accountCache.loading;
    }

    // Lazy single-account fetch for accounts that didn't appear in the bulk list
    const accountFetchInFlight = {}; // id -> Promise
    function fetchAccountIfMissing(id, onReady) {
      if (!id) return;
      if (accountCache.byId[id]) return; // already have it
      if (accountFetchInFlight[id]) {
        accountFetchInFlight[id].then(onReady);
        return;
      }
      accountFetchInFlight[id] = Pylon.getAccount(id).then(r => {
        const account = (r && (r.data || r.account || r)) || null;
        if (account && account.id) {
          accountCache.byId[account.id] = account;
        } else if (account && !account.id) {
          // Pylon may return account without echoing the id; store under the requested id
          accountCache.byId[id] = Object.assign({ id }, account);
        }
        return accountCache.byId[id];
      }).catch(() => null).finally(() => {
        delete accountFetchInFlight[id];
      });
      accountFetchInFlight[id].then(onReady);
    }

    function resolvePerson(id, type) {
      if (!id) return null;
      if (type === 'user' && peopleCache.users[id]) return peopleCache.users[id];
      if (type === 'contact' && peopleCache.contacts[id]) return peopleCache.contacts[id];
      return peopleCache.users[id] || peopleCache.contacts[id] || null;
    }

    function resolveAccountName(issue) {
      if (!issue) return '';
      if (issue.account && (issue.account.name || issue.account.title || issue.account.display_name)) {
        return issue.account.name || issue.account.title || issue.account.display_name;
      }
      if (issue.account_name) return issue.account_name;
      const aid = issue.account_id || (issue.account && issue.account.id);
      if (aid && accountCache.byId[aid]) {
        const a = accountCache.byId[aid];
        return a.name || a.title || a.display_name || a.company_name || '';
      }
      return '';
    }

    // Simple network log so the user can debug from Settings.
    const netLog = [];
    function logCall(entry) {
      netLog.unshift({ ...entry, at: Date.now() });
      if (netLog.length > 50) netLog.length = 50;
    }

    // Avatar helpers (initial + deterministic background color)
    const AVATAR_PALETTE = ['#6e56cf','#e5484d','#30a46c','#4f86ec','#f5a524','#d6409f','#0091ff','#e54666','#11b3a4','#7c66dc','#dc7e22','#0d99a3'];
    function avatarColor(seed) {
      const s = String(seed || '');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
    }
    function initialsOf(name) {
      if (!name) return '?';
      const parts = String(name).trim().split(/\s+/).slice(0, 2);
      return parts.map(p => p[0] || '').join('').toUpperCase() || '?';
    }
    function renderAvatar(name, opts = {}) {
      const seed = opts.seed || name || '?';
      const size = opts.size || ''; // '', 'sm', 'xs'
      const sysClass = opts.system ? ' avatar-system' : '';
      const color = opts.system ? '' : avatarColor(seed);
      return `<div class="avatar${size ? ' avatar-' + size : ''}${sysClass}" ${color ? `style="background:${color};"` : ''}>${escapeHtml(initialsOf(name))}</div>`;
    }

    // ============ State / Router ============
    // Date-window settings. Pylon's /issues endpoint hard-caps the requested
    // range at ~30 days — past that the API returns no results (or an error).
    // We default to 28 days (a safe 2-day buffer) and refuse any span over
    // MAX_DATE_RANGE_DAYS at the picker level.
    const MAX_DATE_RANGE_DAYS = 28;
    function ymd(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function defaultDateWindow() {
      const today = new Date();
      const start = new Date(today.getTime() - MAX_DATE_RANGE_DAYS * 24 * 60 * 60 * 1000);
      return { dateFrom: ymd(start), dateTo: ymd(today) };
    }
    // Calendar-day span between two YYYY-MM-DD strings, inclusive of both.
    function dateSpanDays(fromStr, toStr) {
      if (!fromStr || !toStr) return 0;
      const a = new Date(fromStr + 'T00:00:00').getTime();
      const b = new Date(toStr + 'T00:00:00').getTime();
      return Math.round((b - a) / (24 * 60 * 60 * 1000));
    }

    const state = {
      view: 'list',
      allIssues: [],   // raw from server, used for counts + assignee list
      issues: [],      // post-filter, displayed
      filter: Object.assign(
        // Default to status='new' so the inbox lands on the most actionable
        // tickets first; assignees/accounts are arrays for multi-select
        // (empty arrays = no filter on that dimension).
        { state: 'new', assignees: [], accounts: [], q: '' },
        defaultDateWindow()
      ),
      // AI search: when set to a Set of ticket IDs/numbers, only those match.
      // Null = no AI filter active.
      aiSearchMatches: null,
      aiSearchQuery: '',
      stateCounts: {}, // { new: 2, waiting_on_you: 18, ... }
      assigneeStats: [], // [{id, name, count}, ...] top assignees
      accountStats: [],  // [{id, name, count}, ...] all accounts
      issue: null,
      messages: [],
      loading: false,
      error: null,
      me: null,
      cursor: null,
    };

    const main = document.getElementById('main');
    const hdrTitle = document.getElementById('hdrTitle');
    const hdrLeft = document.getElementById('hdrLeft');
    const hdrRight = document.getElementById('hdrRight');
    const bottomNav = document.getElementById('bottomNav');

    // Per-view scroll positions, so navigating back to the inbox after
    // scrolling through a ticket returns the user to where they were instead
    // of leaving them stranded at the bottom of the list.
    const scrollPositions = { list: 0, detail: 0, settings: 0, netlog: 0, signature: 0, search: 0 };

    function currentScrollY() {
      return window.scrollY ||
        (document.documentElement && document.documentElement.scrollTop) ||
        (document.body && document.body.scrollTop) ||
        0;
    }
    function scrollToY(y) {
      // Try every scroller — the active one depends on body's positioning,
      // which differs between Safari and standalone PWA modes.
      try { window.scrollTo(0, y); } catch {}
      try { if (document.documentElement) document.documentElement.scrollTop = y; } catch {}
      try { if (document.body) document.body.scrollTop = y; } catch {}
    }

    function navigate(view, opts = {}) {
      // Snapshot the scroll position of the view we're leaving so it can be
      // restored when the user comes back.
      if (state.view) scrollPositions[state.view] = currentScrollY();

      state.view = view;
      state.error = null;
      if (opts.issue !== undefined) state.issue = opts.issue;

      // Opening a (newly-tapped) ticket should start at the top, not at
      // whatever scrollY the previous detail view ended at.
      if (view === 'detail' && opts.issue) scrollPositions.detail = 0;

      // Push a History API entry on forward navigation so the Android system
      // back gesture (and the browser back button) moves through views inside
      // the app instead of exiting the PWA. Skip when we're already responding
      // to a popstate event — that would create a loop.
      if (!opts._fromHistory) {
        try {
          const issueRef = (opts.issue && (opts.issue.id || opts.issue.number || opts.issue)) || null;
          history.pushState({ view, issueRef }, '');
        } catch {}
      }

      render();
      if (view === 'list' && !state.issues.length) loadIssues();
      if (view === 'detail' && state.issue) loadIssueDetail(state.issue.id || state.issue);

      // Restore scroll on the next frame so the new view's DOM has rendered.
      const targetY = scrollPositions[view] || 0;
      requestAnimationFrame(() => scrollToY(targetY));
    }

    function render() {
      // Bottom nav visibility
      const showNav = !!cfg.apiKey && (state.view === 'list' || state.view === 'settings');
      bottomNav.hidden = !showNav;
      document.querySelector('.app').classList.toggle('has-nav', showNav);
      // Update aria-current on tabs
      if (showNav) {
        const map = { list: 'list', search: 'list', settings: 'settings' };
        const current = map[state.view] || state.view;
        bottomNav.querySelectorAll('.bottom-nav-btn').forEach(b => {
          b.setAttribute('aria-current', b.dataset.nav === current ? 'true' : 'false');
        });
      }

      // Header
      if (!cfg.apiKey) {
        hdrTitle.textContent = 'Pylon Mobile';
        hdrLeft.hidden = true;
        hdrRight.hidden = true;
      } else if (state.view === 'list') {
        hdrTitle.textContent = 'Inbox';
        hdrLeft.hidden = true;
        hdrRight.hidden = true;
      } else if (state.view === 'detail') {
        const issue = state.issue;
        if (issue) {
          const num = issue.number || issue.id || '';
          const canCopy = issue.number != null;
          hdrTitle.innerHTML =
            '<span>#' + escapeHtml(String(num)) + '</span>' +
            (canCopy
              ? '<button type="button" class="hdr-copy-btn" id="hdrCopyBtn"' +
                ' aria-label="Copy ticket URL" title="Copy ticket URL">' +
                '<svg viewBox="0 0 24 24" width="14" height="14" fill="none"' +
                ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
                ' stroke-linejoin="round">' +
                '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
                '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' +
                '</svg></button>'
              : '') +
            '<button type="button" class="hdr-more-btn" id="hdrMoreBtn"' +
            ' aria-label="More actions" title="More actions">' +
            '<svg viewBox="0 0 24 24" width="16" height="16" fill="none"' +
            ' stroke="currentColor" stroke-width="2.4" stroke-linecap="round"' +
            ' stroke-linejoin="round">' +
            '<circle cx="12" cy="5" r="1"/>' +
            '<circle cx="12" cy="12" r="1"/>' +
            '<circle cx="12" cy="19" r="1"/>' +
            '</svg></button>';
          const copyBtn = document.getElementById('hdrCopyBtn');
          if (copyBtn) copyBtn.addEventListener('click', copyIssueUrl);
          const moreBtn = document.getElementById('hdrMoreBtn');
          if (moreBtn) moreBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            openIssueMoreMenu(moreBtn);
          });
        } else {
          hdrTitle.textContent = 'Issue';
        }
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'settings') {
        hdrTitle.textContent = 'Settings';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'netlog') {
        hdrTitle.textContent = 'Network log';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'signature') {
        hdrTitle.textContent = 'Email signature';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      }

      // Apply split-pane class to .app so the CSS media query can do its thing.
      // The class flips on for landscape ≥1000pt, off otherwise — including
      // single-pane modes (settings/netlog/signature).
      const splitEligible = isSplitLayout() &&
        (state.view === 'list' || state.view === 'detail');
      document.querySelector('.app').classList.toggle('is-split', splitEligible);

      // Body
      if (!cfg.apiKey) return renderSetup();
      // Split-pane: render BOTH the inbox and the detail at once.
      if (splitEligible) return renderSplitView();
      // Single-pane: existing behaviour — only one view fills the screen.
      if (state.view === 'list') return renderList();
      if (state.view === 'detail') return renderDetail();
      if (state.view === 'settings') return renderSettings();
      if (state.view === 'netlog') return renderNetLog();
      if (state.view === 'signature') return renderSignature();
    }

    // Collapse / expand the left inbox pane in split-pane mode. Persists the
    // user's preference to cfg so it survives reloads.
    function setSplitListCollapsed(collapsed) {
      cfg.splitListCollapsed = !!collapsed;
      try { saveConfig(); } catch {}
      const app = document.querySelector('.app');
      if (app) app.classList.toggle('list-collapsed', !!collapsed);
    }

    // True when the viewport is wide and landscape — iPad in landscape, or
    // any laptop/desktop window ≥1000pt wide. We don't enable split for
    // phones in landscape (≤956pt) because the panes would be too cramped.
    function isSplitLayout() {
      try {
        return window.matchMedia('(min-width: 1000px) and (orientation: landscape)').matches;
      } catch { return false; }
    }

    // Track the layout's "is split" state and re-render whenever it changes —
    // rotating the iPad, resizing a desktop window, or unfolding a foldable.
    let _lastSplitState = isSplitLayout();
    function _onLayoutMaybeChanged() {
      const now = isSplitLayout();
      if (now === _lastSplitState) return;
      _lastSplitState = now;
      // Don't tear down a user's in-progress reply on rotation — preserve
      // composer content if the editor element is in the DOM.
      const editorBeforeRender = document.getElementById('replyEditor');
      const draftHtml = editorBeforeRender ? editorBeforeRender.innerHTML : null;
      try { render(); } catch {}
      // Restore composer draft if there was one.
      if (draftHtml) {
        const editorAfterRender = document.getElementById('replyEditor');
        if (editorAfterRender) editorAfterRender.innerHTML = draftHtml;
      }
    }
    if (window.matchMedia) {
      try {
        const mql = window.matchMedia('(min-width: 1000px) and (orientation: landscape)');
        // Modern Safari/Chrome: addEventListener; older: addListener
        if (mql.addEventListener) mql.addEventListener('change', _onLayoutMaybeChanged);
        else if (mql.addListener) mql.addListener(_onLayoutMaybeChanged);
      } catch {}
    }
    window.addEventListener('orientationchange', function () {
      setTimeout(_onLayoutMaybeChanged, 100); // wait for iOS to finish the rotation
    });

    // Split-pane renderer: inbox list on the left, ticket detail (or empty
    // state) on the right. Reuses renderList() and renderDetail() by passing
    // their target containers so all the existing event-wire-up logic still
    // runs unchanged.
    function renderSplitView() {
      // Apply the saved 'list collapsed' preference so the layout starts in
      // the user's preferred state.
      const collapsed = !!cfg.splitListCollapsed;
      document.querySelector('.app').classList.toggle('list-collapsed', collapsed);

      main.innerHTML =
        '<div class="inbox-pane" id="inboxPane"></div>' +
        '<div class="detail-pane" id="detailPane">' +
          // Floating expand button shown only when the inbox pane is collapsed.
          // Sits in the top-left of the detail pane so the user can re-open
          // the list without leaving the ticket they're reading.
          '<button type="button" class="split-expand-btn" id="splitExpandBtn" aria-label="Show inbox" title="Show inbox">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>' +
            '</svg>' +
          '</button>' +
          '<div id="detailPaneContent"></div>' +
        '</div>';
      const inboxEl = document.getElementById('inboxPane');
      const detailEl = document.getElementById('detailPaneContent');
      // Always render the list in the left pane.
      renderList(inboxEl);
      // Wire the floating expand button.
      const expandBtn = document.getElementById('splitExpandBtn');
      if (expandBtn) {
        expandBtn.addEventListener('click', () => setSplitListCollapsed(false));
      }
      // Insert a collapse-button at the top of the inbox pane so the user
      // can hide the list and see the ticket in full width.
      const collapseBtn = document.createElement('button');
      collapseBtn.type = 'button';
      collapseBtn.className = 'split-collapse-btn';
      collapseBtn.setAttribute('aria-label', 'Hide inbox');
      collapseBtn.setAttribute('title', 'Hide inbox');
      collapseBtn.innerHTML =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="15 18 9 12 15 6"/>' +
        '</svg>';
      collapseBtn.addEventListener('click', () => setSplitListCollapsed(true));
      inboxEl.insertBefore(collapseBtn, inboxEl.firstChild);
      // Right pane: detail when a ticket is selected, empty state otherwise.
      if (state.issue) {
        renderDetail(detailEl);
      } else {
        detailEl.innerHTML =
          '<div class="detail-empty">' +
            '<div class="detail-empty-icon">' +
              '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M22 12h-6l-2 3h-4l-2-3H2"/>' +
                '<path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>' +
              '</svg>' +
            '</div>' +
            '<div class="detail-empty-title">Select a ticket from the inbox</div>' +
            '<div class="small">The conversation will open here.</div>' +
          '</div>';
      }
      // Mark the selected card in the list (if any) so the user can see
      // which ticket is currently in the right pane.
      if (state.issue) {
        const sel = state.issue.id || state.issue.number;
        if (sel != null) {
          const card = inboxEl.querySelector('.issue-card[data-id="' + CSS.escape(String(sel)) + '"]');
          if (card) card.setAttribute('aria-current', 'true');
        }
      }
    }

    // ============ Views ============

    function renderSetup() {
      main.innerHTML = `
        <div class="stack-20" style="padding-top: 24px;">
          <div class="center">
            <div class="logo">P</div>
            <h1 style="margin:0 0 6px; font-size:24px; letter-spacing:-.02em;">Pylon Mobile</h1>
            <p class="muted small" style="max-width: 380px; margin: 0 auto;">
              A clean, mobile-first interface for your Pylon support inbox. Sign in with <strong>your own</strong> Pylon API key — replies will be attributed to you.
            </p>
          </div>
          <div class="card stack-16">
            <div>
              <label class="label" for="setupKey">Your Pylon API key</label>
              <input id="setupKey" type="password" autocomplete="off" spellcheck="false" placeholder="pylon_api_..." />
              <div class="help">
                Don't have one yet? <a href="#" id="howGetKey">How to get my key →</a>
              </div>
              <div id="howGetKeyPanel" class="help-panel" hidden>
                <ol style="margin: 6px 0 0 18px; padding: 0; line-height: 1.7;">
                  <li>Open <a href="https://app.usepylon.com" target="_blank" rel="noopener">app.usepylon.com</a> and sign in with Google as usual.</li>
                  <li>Click your avatar → <strong>Settings</strong> (or go to <em>Settings</em> in the sidebar).</li>
                  <li>Find <strong>API Keys</strong> (under Developers / Integrations).</li>
                  <li>Click <strong>Create API Key</strong>. Name it something like <em>"My phone"</em>.</li>
                  <li>Copy the key (starts with <code>pylon_api_</code>) and paste it above.</li>
                </ol>
                <p class="tiny muted" style="margin: 10px 0 0;">Your key represents <strong>you</strong> — anything you do in this app is attributed to your Pylon account.</p>
              </div>
            </div>
            <div class="advanced-section">
              <button type="button" class="btn-link" id="toggleAdvanced">Advanced settings ▾</button>
              <div id="advancedPanel" hidden style="margin-top: 12px;" class="stack-16">
                <div>
                  <label class="label" for="setupBase">API base URL</label>
                  <input id="setupBase" type="url" autocomplete="off" spellcheck="false" value="${escapeAttr(cfg.base)}" />
                  <div class="help">Default: <code>https://api.usepylon.com</code></div>
                </div>
                <div>
                  <label class="label" for="setupProxy">CORS proxy URL</label>
                  <input id="setupProxy" type="url" autocomplete="off" spellcheck="false" value="${escapeAttr(cfg.proxy || '')}" placeholder="https://your-proxy.workers.dev" />
                  <div class="help">
                    Required for most browsers. Ask your admin for the shared CORS proxy URL, or see the README to deploy one.
                  </div>
                </div>
              </div>
            </div>
            <button class="btn btn-primary" id="setupSave">Sign in</button>
          </div>
          <p class="tiny faint center" style="max-width: 360px; margin: 0 auto;">Your key is stored only on this device. It never leaves your browser except in requests to Pylon.</p>
        </div>
      `;
      document.getElementById('howGetKey').onclick = (e) => {
        e.preventDefault();
        const p = document.getElementById('howGetKeyPanel');
        p.hidden = !p.hidden;
      };
      document.getElementById('toggleAdvanced').onclick = (e) => {
        e.preventDefault();
        const p = document.getElementById('advancedPanel');
        p.hidden = !p.hidden;
        e.currentTarget.textContent = p.hidden ? 'Advanced settings ▾' : 'Advanced settings ▴';
        // If the proxy URL is blank, prefill from a per-team default the user might pre-populate later
      };
      // If the proxy is already set (admin pre-configured), keep advanced collapsed.
      // If not, auto-open it so the user sees the CORS field.
      if (!cfg.proxy) {
        document.getElementById('advancedPanel').hidden = false;
        document.getElementById('toggleAdvanced').textContent = 'Advanced settings ▴';
      }
      const $key = document.getElementById('setupKey');
      const $save = document.getElementById('setupSave');
      $key.focus();
      const submit = async () => {
        const key = $key.value.trim();
        const $baseEl = document.getElementById('setupBase');
        const $proxyEl = document.getElementById('setupProxy');
        const base = ($baseEl && $baseEl.value.trim()) || DEFAULT_BASE;
        const proxy = ($proxyEl && $proxyEl.value.trim()) || '';
        if (!key) { toast('Enter your Pylon API key', 'error'); return; }
        $save.disabled = true;
        $save.innerHTML = '<span class="spinner"></span> Verifying…';
        cfg.apiKey = key; cfg.base = base; cfg.proxy = proxy;
        try {
          const me = await Pylon.me();
          state.me = me && (me.data || me);
          saveConfig();
          const name = (state.me && (state.me.name || state.me.email)) || '';
          toast(name ? `Welcome, ${name.split(/\s+/)[0]} 👋` : 'Signed in', 'success');
          navigate('list');
        } catch (e) {
          cfg.apiKey = ''; // don't persist a bad key
          $save.disabled = false;
          $save.textContent = 'Sign in';
          toast(friendlyError(e), 'error');
        }
      };
      $save.addEventListener('click', submit);
      $key.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }

    function renderList(target) {
      const root = target || main;
      root.innerHTML = `
        <div class="search">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input id="searchInput" type="search" placeholder="Search subject, account, thread text…" value="${escapeAttr(state.filter.q)}" />
          <button type="button" class="search-ai-btn" id="aiSearchBtn" title="AI search — looks inside ticket conversations" aria-label="Search with AI">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/>
              <path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/>
            </svg>
            <span class="ai-spinner" aria-hidden="true"></span>
          </button>
        </div>
        ${state.aiSearchMatches ? `<div class="ai-search-banner" id="aiSearchBanner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--accent);"><path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5L12 3z"/></svg>
          <span>AI found <strong>${state.aiSearchMatches.size}</strong> match${state.aiSearchMatches.size === 1 ? '' : 'es'} for &ldquo;${escapeHtml(state.aiSearchQuery)}&rdquo;</span>
          <button type="button" class="ai-search-clear" id="aiSearchClear" aria-label="Clear AI search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>` : ''}
        <div class="filter-row" id="filterRow">
          ${renderStatusFilterChip()}
          ${renderAssigneeFilterChip()}
          ${renderAccountFilterChip()}
          ${renderDateChip()}
        </div>
        <div id="listContainer">
          ${renderListBody()}
        </div>
      `;
      // wire
      const $search = document.getElementById('searchInput');
      let t = null;
      $search.addEventListener('input', (e) => {
        state.filter.q = e.target.value;
        clearTimeout(t);
        t = setTimeout(() => reapplyFilters(), 200);
      });
      $search.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); reapplyFilters(); }
      });

      const $aiSearch = document.getElementById('aiSearchBtn');
      if ($aiSearch) $aiSearch.addEventListener('click', runAiSearch);
      const $aiClear = document.getElementById('aiSearchClear');
      if ($aiClear) $aiClear.addEventListener('click', () => {
        state.aiSearchMatches = null;
        state.aiSearchQuery = '';
        reapplyFilters();
        render();
      });

      const $filterRow = document.getElementById('filterRow');
      $filterRow.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-chip');
        if (!btn) return;
        const which = btn.dataset.filter;
        if (which === 'status')         openStatusFilterSheet();
        else if (which === 'assignee')  openAssigneeFilterSheet();
        else if (which === 'account')   openAccountFilterSheet();
        else if (which === 'date')      openDatePicker();
      });

      const list = document.getElementById('listContainer');
      // Long-press anywhere on a card → enter bulk-select mode + select that card.
      attachLongPressHandlers(list);
      list.addEventListener('click', (e) => {
        const item = e.target.closest('.issue-card');
        if (!item) return;
        // In selection mode, taps toggle selection instead of navigating.
        if (state.selectionMode) {
          toggleCardSelection(item);
          return;
        }
        const id = item.dataset.id;
        const issue = state.issues.find(i => String(i.id) === id || String(i.number) === id);
        if (isSplitLayout()) {
          // Split mode: don't full-navigate. Just update the right pane.
          state.issue = issue || { id };
          // Reset detail-pane scroll snapshot so the new ticket starts at top.
          scrollPositions.detail = 0;
          // Render the right pane only — keep the inbox state intact.
          const detailEl = document.getElementById('detailPaneContent');
          if (detailEl) {
            renderDetail(detailEl);
            // Highlight the selected card.
            document.querySelectorAll('.issue-card[aria-current="true"]').forEach(c =>
              c.removeAttribute('aria-current'));
            item.setAttribute('aria-current', 'true');
          }
          if (state.issue && (state.issue.id || state.issue)) {
            loadIssueDetail(state.issue.id || state.issue);
          }
          return;
        }
        navigate('detail', { issue: issue || { id } });
      });
      attachBodyObservers();
    }

    // Status options used by both the filter chip label + the popover sheet.
    function statusOptions() {
      const counts = state.stateCounts || {};
      const total = counts._total || 0;
      return [
        { value: '', label: 'All', count: total },
        { value: 'new', label: 'New', count: counts.new || 0 },
        { value: 'waiting_on_you', label: 'On you', count: counts.waiting_on_you || 0 },
        { value: 'waiting_on_customer', label: 'On customer', count: counts.waiting_on_customer || 0 },
        { value: 'on_hold', label: 'On hold', count: counts.on_hold || 0 },
        { value: 'closed', label: 'Closed', count: counts.closed || 0 },
      ];
    }

    function renderStatusFilterChip() {
      const current = statusOptions().find(o => o.value === state.filter.state) || statusOptions()[0];
      return '<button type="button" class="filter-chip" data-filter="status" id="statusFilterBtn">' +
        '<span class="filter-chip-value">' + escapeHtml(current.label) + '</span>' +
        '<span class="filter-chip-count">' + current.count + '</span>' +
        '<svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>';
    }

    function renderAssigneeFilterChip() {
      const me = state.me || {};
      const sel = Array.isArray(state.filter.assignees) ? state.filter.assignees : [];
      let label = 'Anyone';
      if (sel.length === 1) {
        const v = sel[0];
        if (v === 'me') label = 'Me';
        else if (v === 'unassigned') label = 'Unassigned';
        else {
          const a = (state.assigneeStats || []).find(s => s.id === v);
          label = a ? a.name : 'Assignee';
        }
      } else if (sel.length > 1) {
        const first = sel[0];
        const head = first === 'me' ? 'Me' : first === 'unassigned' ? 'Unassigned'
          : ((state.assigneeStats || []).find(s => s.id === first) || { name: 'Multi' }).name;
        label = head + ' +' + (sel.length - 1);
      }
      return '<button type="button" class="filter-chip ' + (sel.length ? 'is-active' : '') + '"' +
        ' data-filter="assignee" id="assigneeFilterBtn">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
        '<span class="filter-chip-value">' + escapeHtml(label) + '</span>' +
        '<svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>';
    }

    // Status filter popover — single-select. Tapping an option applies and closes.
    function openStatusFilterSheet() {
      const opts = statusOptions();
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML =
        '<div class="confirm-modal filter-sheet" role="dialog">' +
          '<h3>Status</h3>' +
          '<ul class="filter-list">' +
            opts.map(function (it) {
              return '<li><button type="button" class="filter-row-btn" data-value="' + escapeAttr(it.value) + '"' +
                (state.filter.state === it.value ? ' aria-pressed="true"' : '') + '>' +
                '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
                '<span class="filter-row-label">' + escapeHtml(it.label) + '</span>' +
                '<span class="filter-row-count">' + it.count + '</span>' +
              '</button></li>';
            }).join('') +
          '</ul>' +
          '<div class="confirm-actions"><button type="button" class="confirm-cancel" data-action="close">Done</button></div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      function close() {
        overlay.classList.remove('is-open');
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      overlay.querySelectorAll('.filter-row-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.filter.state = btn.dataset.value || '';
          reapplyFilters();
          const chip = document.getElementById('statusFilterBtn');
          if (chip) chip.outerHTML = renderStatusFilterChip();
          close();
        });
      });
      overlay.querySelector('[data-action="close"]').addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
    }

    // Assignee filter popover — multi-select. Tapping toggles inclusion; the
    // list updates inline. Done dismisses.
    function openAssigneeFilterSheet() {
      // Lazy-load the user/contact directory on first filter open. If it's
      // already loaded from cache or a previous open, this is a no-op.
      if (!peopleCache.loaded) {
        ensurePeopleLoaded().then(() => {
          try { reapplyFilters(); } catch {}
        });
      }
      const me = state.me || {};
      const meId = me.id || me.user_id;
      const meName = me.name || me.email || 'Me';
      const fixed = [
        { id: 'me', label: meName + ' (me)', icon: 'me' },
        { id: 'unassigned', label: 'Unassigned', icon: 'unassigned' },
      ];
      const dynamic = (state.assigneeStats || []).filter(s => s.id && s.id !== meId)
        .map(s => ({ id: s.id, label: s.name + (s.count ? ' · ' + s.count : ''), icon: 'user' }));
      const all = fixed.concat(dynamic);

      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';

      function rowHtml(opt) {
        const checked = state.filter.assignees.includes(opt.id);
        return '<li><button type="button" class="filter-row-btn" data-value="' + escapeAttr(opt.id) + '"' +
          (checked ? ' aria-pressed="true"' : '') + '>' +
          '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '<span class="filter-row-label">' + escapeHtml(opt.label) + '</span>' +
        '</button></li>';
      }

      overlay.innerHTML =
        '<div class="confirm-modal filter-sheet" role="dialog">' +
          '<h3>Assignees <span class="filter-sheet-hint">(select multiple)</span></h3>' +
          '<ul class="filter-list" id="assigneeFilterList">' + all.map(rowHtml).join('') + '</ul>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="confirm-cancel" data-action="clear">Clear all</button>' +
            '<button type="button" class="confirm-danger" data-action="done" style="background: var(--accent);">Done</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      function close() {
        overlay.classList.remove('is-open');
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
        document.removeEventListener('keydown', onKey);
        // Apply on close so the chip + list reflect the new selection.
        reapplyFilters();
        const chip = document.getElementById('assigneeFilterBtn');
        if (chip) chip.outerHTML = renderAssigneeFilterChip();
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      overlay.querySelector('#assigneeFilterList').addEventListener('click', function (e) {
        const btn = e.target.closest('.filter-row-btn');
        if (!btn) return;
        const v = btn.dataset.value;
        const idx = state.filter.assignees.indexOf(v);
        if (idx >= 0) state.filter.assignees.splice(idx, 1);
        else state.filter.assignees.push(v);
        btn.setAttribute('aria-pressed', idx < 0 ? 'true' : 'false');
      });
      overlay.querySelector('[data-action="clear"]').addEventListener('click', function () {
        state.filter.assignees = [];
        overlay.querySelectorAll('.filter-row-btn').forEach(b => b.removeAttribute('aria-pressed'));
      });
      overlay.querySelector('[data-action="done"]').addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
    }

    // ---------- Account filter ----------
    function accountLabelFor(id) {
      if (id === '__none__') return 'No account';
      const a = (state.accountStats || []).find(s => s.id === id);
      if (a && a.name) return a.name;
      return 'Account · ' + String(id || '').slice(-6);
    }
    function renderAccountFilterChip() {
      const sel = Array.isArray(state.filter.accounts) ? state.filter.accounts : [];
      let label = 'All accounts';
      if (sel.length === 1) label = accountLabelFor(sel[0]);
      else if (sel.length > 1) label = accountLabelFor(sel[0]) + ' +' + (sel.length - 1);
      return '<button type="button" class="filter-chip ' + (sel.length ? 'is-active' : '') + '"' +
        ' data-filter="account" id="accountFilterBtn">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/><path d="M9 18v.01"/></svg>' +
        '<span class="filter-chip-value">' + escapeHtml(label) + '</span>' +
        '<svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>';
    }

    function openAccountFilterSheet() {
      // Lazy-load the accounts directory on first filter open. If it's
      // already loaded from cache or a previous open, this is a no-op.
      if (!accountCache.loaded) {
        ensureAccountsLoaded().then(() => {
          try { reapplyFilters(); } catch {}
        });
      }
      const stats = (state.accountStats || []).slice();
      // Move "No account" bucket to the bottom for tidiness.
      stats.sort((a, b) => (a.id === '__none__') - (b.id === '__none__') || b.count - a.count);
      openMultiSelectFilterSheet({
        title: 'Accounts',
        items: stats.map(s => {
          let label = s.name;
          if (!label) {
            label = s.id === '__none__'
              ? 'No account'
              // Distinct fallback so empty-name entries don't all look like
              // duplicate "Account" rows — show the last 6 chars of the ID.
              : 'Unnamed account · ' + String(s.id).slice(-6);
          }
          return { id: s.id, label, count: s.count };
        }),
        getSelected: () => state.filter.accounts,
        setSelected: (arr) => { state.filter.accounts = arr; },
        chipId: 'accountFilterBtn',
        renderChip: renderAccountFilterChip,
        searchable: true,
        searchPlaceholder: 'Filter accounts…',
      });
    }

    // ---------- Requester filter ----------
    function requesterLabelFor(id) {
      const r = (state.requesterStats || []).find(s => s.id === id);
      if (r) return r.name || r.email || ('Requester · ' + String(id || '').slice(-6));
      return 'Requester · ' + String(id || '').slice(-6);
    }
    function renderRequesterFilterChip() {
      const sel = Array.isArray(state.filter.requesters) ? state.filter.requesters : [];
      let label = 'Any requester';
      if (sel.length === 1) label = requesterLabelFor(sel[0]);
      else if (sel.length > 1) label = requesterLabelFor(sel[0]) + ' +' + (sel.length - 1);
      return '<button type="button" class="filter-chip ' + (sel.length ? 'is-active' : '') + '"' +
        ' data-filter="requester" id="requesterFilterBtn">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/></svg>' +
        '<span class="filter-chip-value">' + escapeHtml(label) + '</span>' +
        '<svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>';
    }

    function openRequesterFilterSheet() {
      const stats = (state.requesterStats || []).slice();
      openMultiSelectFilterSheet({
        title: 'Requesters',
        items: stats.map(s => {
          // Prefer name, then email, then a distinct fallback using the ID
          // tail so we don't show a list full of identical 'Requester' rows
          // when the contacts cache hasn't finished loading.
          const label = s.name || s.email || ('Unnamed · ' + String(s.id).slice(-6));
          const sublabel = s.name && s.email ? s.email : '';
          return { id: s.id, label, sublabel, count: s.count };
        }),
        getSelected: () => state.filter.requesters,
        setSelected: (arr) => { state.filter.requesters = arr; },
        chipId: 'requesterFilterBtn',
        renderChip: renderRequesterFilterChip,
        searchable: true,
        searchPlaceholder: 'Filter by name or email…',
      });
    }

    // Generic multi-select popover used by Account + Requester filters. Pulls
    // out the boilerplate so we don't repeat overlay-create / open / wire / close.
    function openMultiSelectFilterSheet(opts) {
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      const itemsHtml = function (items) {
        if (!items.length) return '<li class="filter-empty">No matches</li>';
        return items.map(function (it) {
          const checked = opts.getSelected().includes(it.id);
          return '<li><button type="button" class="filter-row-btn" data-value="' + escapeAttr(it.id) + '"' +
            (checked ? ' aria-pressed="true"' : '') + '>' +
            '<span class="filter-row-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
            '<span class="filter-row-label">' + escapeHtml(it.label) +
              (it.sublabel ? '<span class="filter-row-sublabel">' + escapeHtml(it.sublabel) + '</span>' : '') +
            '</span>' +
            (it.count != null ? '<span class="filter-row-count">' + it.count + '</span>' : '') +
          '</button></li>';
        }).join('');
      };

      overlay.innerHTML =
        '<div class="confirm-modal filter-sheet" role="dialog">' +
          '<h3>' + escapeHtml(opts.title) + ' <span class="filter-sheet-hint">(select multiple)</span></h3>' +
          (opts.searchable
            ? '<input type="search" class="filter-search" id="filterSheetSearch" placeholder="' + escapeAttr(opts.searchPlaceholder || 'Search…') + '" autocomplete="off"/>'
            : '') +
          '<ul class="filter-list" id="filterSheetList">' + itemsHtml(opts.items) + '</ul>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="confirm-cancel" data-action="clear">Clear all</button>' +
            '<button type="button" class="confirm-danger" data-action="done" style="background: var(--accent);">Done</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      const $list = overlay.querySelector('#filterSheetList');
      const $search = overlay.querySelector('#filterSheetSearch');

      function close() {
        overlay.classList.remove('is-open');
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
        document.removeEventListener('keydown', onKey);
        // Apply: refresh the list + chip label using whatever the user picked.
        reapplyFilters();
        const chip = document.getElementById(opts.chipId);
        if (chip) chip.outerHTML = opts.renderChip();
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      $list.addEventListener('click', function (e) {
        const btn = e.target.closest('.filter-row-btn');
        if (!btn) return;
        const v = btn.dataset.value;
        const sel = opts.getSelected();
        const idx = sel.indexOf(v);
        if (idx >= 0) sel.splice(idx, 1);
        else sel.push(v);
        opts.setSelected(sel);
        btn.setAttribute('aria-pressed', idx < 0 ? 'true' : 'false');
      });

      if ($search) {
        $search.addEventListener('input', function () {
          const q = $search.value.trim().toLowerCase();
          const filtered = !q ? opts.items
            : opts.items.filter(it =>
                (it.label || '').toLowerCase().includes(q) ||
                (it.sublabel || '').toLowerCase().includes(q)
              );
          $list.innerHTML = itemsHtml(filtered);
        });
      }

      overlay.querySelector('[data-action="clear"]').addEventListener('click', function () {
        opts.setSelected([]);
        overlay.querySelectorAll('.filter-row-btn').forEach(b => b.removeAttribute('aria-pressed'));
      });
      overlay.querySelector('[data-action="done"]').addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
    }

    // Friendly label for the current date window. Recognises the in-range
    // presets so the chip stays short; falls back to "Mar 1 – Jun 1" for
    // arbitrary ranges.
    function dateWindowLabel() {
      const f = state.filter.dateFrom;
      const t = state.filter.dateTo;
      if (!f || !t) return 'Last ' + MAX_DATE_RANGE_DAYS + ' days';
      const today = ymd(new Date());
      if (t === today) {
        const days = dateSpanDays(f, t);
        if (days === 7)  return 'Last 7 days';
        if (days === 14) return 'Last 14 days';
        if (days === 21) return 'Last 21 days';
        if (days === 28) return 'Last 28 days';
      }
      const fmt = (s) => new Date(s + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return fmt(f) + ' – ' + fmt(t);
    }

    function renderDateChip() {
      return '<button type="button" class="filter-chip" data-filter="date" id="dateFilterBtn" aria-label="Change date range">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
        '<line x1="16" y1="2" x2="16" y2="6"/>' +
        '<line x1="8" y1="2" x2="8" y2="6"/>' +
        '<line x1="3" y1="10" x2="21" y2="10"/>' +
        '</svg>' +
        '<span class="filter-chip-value">' + escapeHtml(dateWindowLabel()) + '</span>' +
        '<svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</button>';
    }

    function openDatePicker() {
      // Presets cap at the Pylon API's ~30-day limit; we use 28 as a safe ceiling.
      const presets = [
        ['Last 7 days',  7],
        ['Last 14 days', 14],
        ['Last 21 days', 21],
        ['Last 28 days', 28],
      ];
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML =
        '<div class="confirm-modal date-modal" role="dialog" aria-modal="true">' +
          '<h3>Filter by date</h3>' +
          '<p class="date-hint">Pylon\'s API caps the date range at ~30 days. Pick a window up to <strong>' + MAX_DATE_RANGE_DAYS + ' days</strong>.</p>' +
          '<div class="date-presets">' +
            presets.map(function (p) {
              return '<button type="button" class="chip date-preset" data-days="' + p[1] + '">' +
                escapeHtml(p[0]) + '</button>';
            }).join('') +
          '</div>' +
          '<div class="date-inputs">' +
            '<label><span>From</span><input type="date" id="dateFromInput" value="' + escapeAttr(state.filter.dateFrom || '') + '"></label>' +
            '<label><span>To</span><input type="date" id="dateToInput" value="' + escapeAttr(state.filter.dateTo || '') + '"></label>' +
          '</div>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="confirm-cancel" data-action="cancel">Cancel</button>' +
            '<button type="button" class="confirm-danger" data-action="apply" style="background: var(--accent);">Apply</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add('is-open'); });

      const $from = overlay.querySelector('#dateFromInput');
      const $to   = overlay.querySelector('#dateToInput');

      // Preset chips just populate the inputs — applying still requires Apply
      overlay.querySelectorAll('.date-preset').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const days = parseInt(btn.dataset.days, 10);
          const today = new Date();
          const start = new Date(today.getTime() - days * 24 * 60 * 60 * 1000);
          $from.value = ymd(start);
          $to.value   = ymd(today);
          overlay.querySelectorAll('.date-preset').forEach(function (b) { b.removeAttribute('aria-pressed'); });
          btn.setAttribute('aria-pressed', 'true');
        });
      });

      function close() {
        overlay.classList.remove('is-open');
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 160);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      overlay.querySelector('[data-action="cancel"]').addEventListener('click', close);
      overlay.querySelector('[data-action="apply"]').addEventListener('click', function () {
        const f = $from.value;
        const t = $to.value;
        if (!f || !t) { toast('Please pick both From and To dates', 'error'); return; }
        if (f > t) { toast('From date must be on or before To date', 'error'); return; }
        const span = dateSpanDays(f, t);
        if (span > MAX_DATE_RANGE_DAYS) {
          toast('Date range can\'t exceed ' + MAX_DATE_RANGE_DAYS + ' days (Pylon API limit). You picked ' + span + ' days.', 'error');
          return;
        }
        state.filter.dateFrom = f;
        state.filter.dateTo   = t;
        close();
        // Refresh the date chip + refetch
        const $dateBar = document.getElementById('dateBar');
        if ($dateBar) $dateBar.innerHTML = renderDateChip();
        loadIssues();
      });
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
    }

    function renderAssigneeChips() {
      const me = state.me || {};
      const meChip = `
        <button class="chip chip-with-avatar" data-assignee="me" aria-pressed="${state.filter.assignee === 'me'}" title="Assigned to me">
          ${renderAvatar(me.name || me.email || 'Me', { seed: me.id || me.email, size: 'xs' })}
          <span>Me</span>
        </button>`;
      const anyoneChip = `
        <button class="chip" data-assignee="all" aria-pressed="${state.filter.assignee === 'all'}">Anyone</button>`;
      const unassigned = `
        <button class="chip" data-assignee="unassigned" aria-pressed="${state.filter.assignee === 'unassigned'}">Unassigned</button>`;

      const others = (state.assigneeStats || [])
        .filter(a => !me.id || a.id !== me.id)
        .map(a => {
          const name = a.name || resolveAssigneeName(a.id) || a.id.slice(0, 6);
          const first = (name || '').split(/\s+/)[0] || name;
          return `
            <button class="chip chip-with-avatar" data-assignee="${escapeAttr(a.id)}" aria-pressed="${state.filter.assignee === a.id}" title="${escapeAttr(name)}">
              ${renderAvatar(name, { seed: a.id, size: 'xs' })}
              <span>${escapeHtml(first)}</span>
              <span class="chip-count">${a.count}</span>
            </button>`;
        }).join('');
      return anyoneChip + meChip + unassigned + others;
    }

    function resolveAssigneeName(id) {
      const p = resolvePerson(id, 'user');
      return p ? (p.name || p.email) : '';
    }

    function renderListBody() {
      if (state.loading && !state.issues.length) {
        return `<div class="state-row"><span class="spinner"></span> Loading issues…</div>`;
      }
      if (state.error) {
        return `<div class="card" style="border-color: var(--danger-soft); background: var(--danger-soft); color: var(--danger);">
          <div style="font-weight: 600; margin-bottom: 6px;">Couldn't load issues</div>
          <div class="small">${escapeHtml(state.error)}</div>
          <div style="margin-top: 12px;"><button class="btn" id="retryBtn">Retry</button></div>
        </div>`;
      }
      if (!state.issues.length) {
        return `<div class="state">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <div style="font-weight: 600; color: var(--text);">No issues found</div>
          <div class="small">Try a different filter or search.</div>
        </div>`;
      }
      return `<ul class="issue-list">${state.issues.map(renderIssueItem).join('')}</ul>` +
        (state.loading ? `<div class="state-row"><span class="spinner"></span> Loading…</div>` : '');
    }

    function renderIssueItem(issue) {
      const id = issue.id || String(issue.number || '');
      const num = issue.number != null ? `#${issue.number}` : (issue.id || '').slice(0, 8);
      const title = issue.title || issue.subject || '(no subject)';
      const requester = (issue.requester && (issue.requester.name || issue.requester.email))
        || (issue.contact && (issue.contact.name || issue.contact.email))
        || issue.requester_name || '';
      const requesterId = (issue.requester && issue.requester.id) || requester || id;
      const account = resolveAccountName(issue);
      const rawAccountId = issue.account_id || (issue.account && issue.account.id) || '';
      const accountId = rawAccountId || account;
      const stateStr = (issue.state || issue.status || '').toString();
      const created = issue.created_at;
      const assigneeName = assigneeNameOf(issue);

      // If the account name is missing but we have an ID, fire a lazy single fetch.
      // When it arrives, find this card in the DOM and update the account name.
      if (!account && rawAccountId) {
        fetchAccountIfMissing(rawAccountId, () => {
          const cards = document.querySelectorAll(`.issue-card[data-id="${CSS.escape(id)}"] .card-account`);
          const cached = accountCache.byId[rawAccountId];
          const name = cached && (cached.name || cached.title || cached.display_name);
          if (name) cards.forEach(el => { el.textContent = name; });
        });
      }

      // Decide what to show. If the issue genuinely has no account_id, it's a
      // system / automated ticket — say "No account" in muted style.
      // If we have an account_id but no name yet, show a subtle "Loading…" while
      // the lazy fetch resolves it.
      const displayedAccount = account
        ? account
        : (rawAccountId ? 'Loading…' : 'No account');
      const accountInitial = account ? account.trim().charAt(0).toUpperCase()
                                     : (rawAccountId ? '?' : '·');
      const accountLogo = `
        <div class="account-logo${account ? '' : ' account-logo-empty'}" ${account ? `style="background:${avatarColor(accountId)};"` : ''} title="${escapeAttr(displayedAccount)}">
          ${escapeHtml(accountInitial)}
        </div>`;

      // Cached body preview (filled in lazily when the card scrolls into view)
      const cachedPreview = issueBodyPreviewCache[id] || '';

      return `
        <li class="issue-card" data-id="${escapeAttr(id)}">
          <div class="card-top">
            ${accountLogo}
            <div class="card-top-text">
              <div class="card-top-line1">
                <span class="card-account ${account ? '' : 'card-account-empty'}">${escapeHtml(displayedAccount)}</span>
                <span class="card-issue-num">${escapeHtml(num)}</span>
              </div>
              <div class="card-top-line2">
                ${requester ? renderAvatar(requester, { seed: requesterId, size: 'xs' }) : ''}
                <span class="card-requester">${escapeHtml(requester || '—')}</span>
              </div>
            </div>
            <div class="card-state">${stateStr ? renderStateBadge(stateStr) : ''}</div>
          </div>

          <div class="card-subject"><span class="card-subject-label">Subject:</span> ${escapeHtml(title)}</div>

          <div class="card-body-preview" data-preview-for="${escapeAttr(id)}">
            ${cachedPreview ? escapeHtml(cachedPreview) : '<span class="card-preview-placeholder">…</span>'}
          </div>

          <div class="card-footer">
            <span class="card-assignee">${assigneeName ? escapeHtml(assigneeName) : '<em>Unassigned</em>'}</span>
            <span class="card-dot">·</span>
            <span class="card-time">${created ? `Created ${escapeHtml(timeAgo(created))} ago` : ''}</span>
          </div>
        </li>
      `;
    }

    // Lazy-load a short body preview for each visible card from GET /issues/{id}.
    // Populated on first display; cached for the session.
    const issueBodyPreviewCache = {};
    let bodyObserver = null;

    function htmlToPreview(html, max = 160) {
      if (!html) return '';
      // Strip tags
      const tmp = document.createElement('div');
      tmp.innerHTML = String(html);
      const text = (tmp.textContent || tmp.innerText || '')
        .replace(/ /g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > max ? text.slice(0, max).trim() + '…' : text;
    }

    // Queue-based body preview loader so 20 cards becoming visible at once
    // can't fire 20 simultaneous Pylon.getIssue calls (a fast way to blow
    // through the API rate limit on first inbox load).
    const bodyPreviewQueue = [];
    let bodyPreviewInflight = 0;
    const BODY_PREVIEW_MAX_CONCURRENT = 3;
    // Debounced save of the preview cache to localStorage — coalesces writes
    // during a burst of new previews into a single localStorage hit.
    let _previewSaveTimer = null;
    function _schedulePreviewSave() {
      if (_previewSaveTimer) return;
      _previewSaveTimer = setTimeout(() => {
        _previewSaveTimer = null;
        try { savePreviewsCache(); } catch {}
      }, 1500);
    }
    function enqueueBodyPreview(cardId, card) {
      if (!cardId) return;
      if (issueBodyPreviewCache[cardId]) {
        updateCardPreview(card, issueBodyPreviewCache[cardId]);
        return;
      }
      bodyPreviewQueue.push({ cardId, card });
      pumpBodyPreviewQueue();
    }
    function pumpBodyPreviewQueue() {
      while (
        bodyPreviewInflight < BODY_PREVIEW_MAX_CONCURRENT &&
        bodyPreviewQueue.length
      ) {
        // If we're rate-limited, drain the queue (the previews are nice-to-
        // have, not critical) and let the next user interaction retrigger
        // the observer.
        if (isRateLimited()) {
          bodyPreviewQueue.length = 0;
          return;
        }
        const { cardId, card } = bodyPreviewQueue.shift();
        if (!cardId || !card || issueBodyPreviewCache[cardId]) {
          if (card) updateCardPreview(card, issueBodyPreviewCache[cardId] || '');
          continue;
        }
        bodyPreviewInflight += 1;
        Pylon.getIssue(cardId).then(r => {
          const issue = (r && (r.data || r.issue || r)) || {};
          const preview = htmlToPreview(issue.body_html || issue.body_text || issue.body || '', 160);
          issueBodyPreviewCache[cardId] = preview;
          updateCardPreview(card, preview);
          // Debounce the localStorage save so we don't write on every preview;
          // schedule one write after the current burst settles.
          _schedulePreviewSave();
        }).catch(() => {
          // Silent — preview just stays as "…". The 429 (if any) was already
          // recorded by api() and other paths will back off.
        }).finally(() => {
          bodyPreviewInflight -= 1;
          // Continue draining whenever an in-flight call settles.
          pumpBodyPreviewQueue();
        });
      }
    }

    function attachBodyObservers() {
      if (bodyObserver) {
        try { bodyObserver.disconnect(); } catch {}
      }
      if (typeof IntersectionObserver === 'undefined') return;
      bodyObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const card = entry.target;
          const cardId = card.dataset.id;
          bodyObserver.unobserve(card);
          enqueueBodyPreview(cardId, card);
        }
      }, { rootMargin: '300px 0px', threshold: 0.01 });
      // Observe each rendered card
      document.querySelectorAll('.issue-card').forEach(c => bodyObserver.observe(c));
    }

    function updateCardPreview(card, preview) {
      const el = card.querySelector('.card-body-preview');
      if (!el) return;
      if (preview) {
        el.textContent = preview;
      } else {
        el.innerHTML = '<span class="card-preview-placeholder">No preview available</span>';
      }
    }

    function renderStateBadge(s) {
      const k = String(s || '').toLowerCase();
      let cls = '';
      if (k === 'new') cls = 'badge-new';
      else if (k === 'on_hold') cls = 'badge-on-hold';
      else if (k.startsWith('waiting_on_you')) cls = 'badge-pending';
      else if (k.startsWith('waiting_on_customer')) cls = 'badge-snoozed';
      else if (k.includes('clos') || k.includes('resol')) cls = 'badge-closed';
      else if (k.includes('open')) cls = 'badge-open';
      else cls = 'badge-snoozed';
      return `<span class="badge ${cls}"><span class="badge-dot"></span>${escapeHtml(prettyState(s))}</span>`;
    }
    function prettyState(s) { return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }

    function renderDetail(target) {
      const root = target || main;
      // Use the detail-specific loading flag, not state.loading (which is
      // for the inbox fetch).

        root.innerHTML = `<div class="state-row"><span class="spinner"></span> Loading issue…</div>`;
        return;
