<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <meta name="theme-color" content="#6e56cf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0a1c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Pylon support inbox for your phone — view, reply, manage tickets." />
  <!-- PWA / iOS metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pylon" />
  <meta name="application-name" content="Pylon Mobile" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <title>Pylon Mobile</title>
  <style>
    /* -------- design tokens (Pylon-inspired) -------- */
    :root {
      --bg: #faf9fc;
      --bg-gradient: radial-gradient(120% 80% at 50% -10%, #ece8ff 0%, transparent 55%), #faf9fc;
      --surface: #ffffff;
      --surface-2: #f3f1f8;
      --surface-3: #ebe7f2;
      --border: #e8e4f0;
      --border-strong: #d6d0e2;
      --text: #16121f;
      --text-muted: #6b6680;
      --text-faint: #9c98ad;
      --accent: #6e56cf;        /* Pylon-ish purple */
      --accent-strong: #5b46b8;
      --accent-soft: #ece8ff;
      --accent-text: #ffffff;
      --primary: #6e56cf;
      --primary-soft: #ece8ff;
      --danger: #e5484d;
      --danger-soft: #ffe5e7;
      --success: #30a46c;
      --success-soft: #d6f1e1;
      --warning: #f5a524;
      --warning-soft: #fff1d6;
      --info: #4f86ec;
      --info-soft: #d8e6ff;
      --shadow-1: 0 1px 2px rgba(35, 25, 80, .04), 0 2px 8px rgba(35, 25, 80, .06);
      --shadow-2: 0 8px 24px rgba(35, 25, 80, .12);
      --shadow-3: 0 -4px 24px rgba(35, 25, 80, .08);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 22px;
      --tap: 44px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 56px;
      --bottom-nav-h: 60px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0a1c;
        --bg-gradient: radial-gradient(120% 80% at 50% -10%, #2a1f5c 0%, transparent 60%), #0e0a1c;
        --surface: #1a1530;
        --surface-2: #221b3d;
        --surface-3: #2b234a;
        --border: #2e2750;
        --border-strong: #423765;
        --text: #f3eefc;
        --text-muted: #aaa2c5;
        --text-faint: #7a7297;
        --accent: #8b73f0;
        --accent-strong: #7a61e0;
        --accent-soft: #2c2360;
        --accent-text: #ffffff;
        --primary: #8b73f0;
        --primary-soft: #2c2360;
        --danger: #ff6369;
        --danger-soft: #44171c;
        --success: #46c089;
        --success-soft: #143824;
        --warning: #ffb849;
        --warning-soft: #3d2912;
        --info: #6ea0ff;
        --info-soft: #14264e;
        --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.4);
        --shadow-2: 0 8px 32px rgba(0,0,0,.5);
        --shadow-3: 0 -4px 24px rgba(0,0,0,.5);
      }
    }

    /* -------- reset / base -------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100%;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      /* Smoother momentum scroll on iOS WebKit */
      -webkit-overflow-scrolling: touch;
      /* Stop iOS Safari from auto-zooming text inputs on focus */
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    /* Prevent iOS rubberband when in standalone PWA mode */
    html.is-standalone, html.is-standalone body { position: fixed; inset: 0; overflow: hidden; }
    html.is-standalone body { height: 100%; overflow-y: auto; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { background: none; border: none; padding: 0; cursor: pointer; }
    input, textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      width: 100%;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
    }
    textarea { resize: vertical; min-height: 90px; font-family: inherit; }
    a { color: var(--primary); text-decoration: none; }
    ::placeholder { color: var(--text-faint); }

    /* -------- app shell -------- */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      background: transparent;
    }
    .app.has-nav { padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom)); }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(var(--safe-top) + 10px) 14px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
      min-height: calc(var(--header-h) + var(--safe-top));
    }
    .header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.01em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background-color .15s;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn:active { background: var(--border); }
    .icon-btn svg { width: 22px; height: 22px; }

    .main {
      flex: 1;
      padding: 14px;
      padding-bottom: calc(var(--safe-bottom) + 14px);
    }

    /* -------- shared components -------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-1);
    }
    .card + .card { margin-top: 12px; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .help {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 6px;
      line-height: 1.5;
    }
    .help a { word-break: break-all; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row + .row { margin-top: 10px; }
    .stack-12 > * + * { margin-top: 12px; }
    .stack-16 > * + * { margin-top: 16px; }
    .stack-20 > * + * { margin-top: 20px; }
    .muted { color: var(--text-muted); }
    .faint { color: var(--text-faint); }
    .small { font-size: 13px; }
    .tiny { font-size: 12px; }
    .center { text-align: center; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--tap);
      padding: 0 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.005em;
      background: var(--surface-2);
      color: var(--text);
      transition: transform .04s ease, background-color .15s, opacity .15s;
      width: 100%;
    }
    .btn:hover { background: var(--border); }
    .btn:active { transform: scale(.985); }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text-muted)); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-ghost { background: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { width: auto; flex: 1; }

    /* badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      max-width: 100%;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }
    .badge-open { color: var(--success); background: var(--success-soft); border-color: transparent; }
    .badge-closed { color: var(--text-muted); background: var(--surface-2); }
    .badge-pending { color: var(--warning); background: color-mix(in srgb, var(--warning) 15%, transparent); border-color: transparent; }
    .badge-snoozed { color: var(--primary); background: var(--primary-soft); border-color: transparent; }

    /* -------- list view -------- */
    .search {
      position: relative;
      margin-bottom: 14px;
    }
    .search input {
      padding-left: 40px;
      background: var(--surface);
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .issue-list { list-style: none; padding: 0; margin: 0; }
    .issue-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .issue-num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-muted); }
    .issue-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.005em;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .issue-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .dot { color: var(--text-faint); }

    /* -------- detail view -------- */
    .detail-header {
      padding: 4px 2px 14px;
    }
    .detail-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.25;
      margin: 4px 0 10px;
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .thread {
      list-style: none;
      padding: 0;
      margin: 0 0 20px;
    }
    .msg {
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
    }
    .msg + .msg { margin-top: 10px; }
    .msg-internal {
      background: color-mix(in srgb, var(--warning) 8%, var(--surface));
      border-color: color-mix(in srgb, var(--warning) 22%, var(--border));
    }
    .msg-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .msg-author { font-weight: 600; color: var(--text); }
    .msg-time { color: var(--text-faint); font-size: 12px; }
    .msg-body {
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .msg-body img { max-width: 100%; height: auto; border-radius: 8px; }
    .msg-body p { margin: 0 0 .8em; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body blockquote {
      margin: .6em 0;
      padding: .2em 0 .2em .8em;
      border-left: 3px solid var(--border-strong);
      color: var(--text-muted);
    }
    /* Author-supplied colours are stripped at sanitize time, but as a belt-and-braces
       guard we also force the theme text colour on every message-body element with
       !important. This means even if an exotic inline colour (or a colour set by a
       newly-introduced email format) survives sanitisation, contrast is preserved in
       both light and dark mode. */
    .msg-body,
    .msg-body * { color: var(--text) !important; background-color: transparent !important; }
    /* Links keep the accent colour. */
    .msg-body a,
    .msg-body a * { color: var(--accent) !important; }
    /* Quoted-reply containers (Gmail, Outlook) should still look muted. */
    .msg-body blockquote,
    .msg-body blockquote *,
    .msg-body .gmail_quote,
    .msg-body .gmail_quote *,
    .msg-body .gmail_attr,
    .msg-body div[id^="divRplyFwdMsg"],
    .msg-body div[id^="divRplyFwdMsg"] *,
    .msg-body div[id^="appendonsend"] ~ * { color: var(--text-muted) !important; }

    /* reply composer */
    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 calc(var(--safe-bottom) + 12px);
      background: linear-gradient(to bottom, transparent, var(--bg) 22%);
      margin-top: 24px;
    }
    .composer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow-2);
    }
    .composer textarea {
      border: none;
      padding: 8px;
      min-height: 80px;
      width: 100%;
      background: transparent;
    }
    .composer textarea:focus { box-shadow: none; }
    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
      margin-top: 6px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 32px;
    }
    .toggle input { display: none; }
    .toggle[data-on="true"] {
      background: color-mix(in srgb, var(--warning) 18%, transparent);
      color: var(--warning);
    }
    .composer-send {
      margin-left: auto;
      min-height: 44px;
      min-width: 96px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .04s;
    }
    .composer-send:active { transform: scale(.97); }
    .composer-send[disabled] { opacity: .35; cursor: not-allowed; }
    .toggle { min-height: 36px; padding: 8px 12px; cursor: pointer; }
    .thread-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      min-height: 36px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px dashed var(--border-strong);
      max-width: 180px;
    }
    .thread-chip svg { width: 14px; height: 14px; flex-shrink: 0; }
    .thread-chip[data-on="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-style: solid;
      border-color: var(--accent);
    }
    .thread-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thread-picker {
      border-top: 1px solid var(--border);
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
      background: var(--surface);
    }
    .thread-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .12s;
    }
    .thread-option:hover { background: var(--surface-2); }
    .thread-option[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .thread-option .thread-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .thread-option[aria-pressed="true"] .thread-dot { background: var(--accent); }
    .thread-option .thread-hint {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-faint);
      font-style: italic;
    }
    .thread-option-new {
      color: var(--accent);
      font-weight: 600;
      border-top: 1px solid var(--border);
      margin-top: 4px;
      border-radius: 0 0 8px 8px;
    }

    /* ============ Recipients (To/Cc/Bcc) ============ */
    .recipients-box {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
    }
    .rcpt-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
      min-height: 32px;
    }
    .rcpt-row + .rcpt-row { border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 2px; }
    .rcpt-label {
      flex-shrink: 0;
      min-width: 26px;
      color: var(--text-muted);
      font-weight: 600;
      padding-top: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .rcpt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .rcpt-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 4px 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      max-width: 100%;
      font-size: 12.5px;
    }
    @media (prefers-color-scheme: dark) {
      .rcpt-chip { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    }
    .rcpt-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .rcpt-remove {
      width: 20px; height: 20px;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .rcpt-remove:hover { background: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      .rcpt-remove:hover { background: rgba(255,255,255,.12); }
    }
    .rcpt-add {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px dashed var(--border-strong);
      min-height: 26px;
    }
    .rcpt-add:hover { background: var(--accent-soft); border-color: var(--accent); }
    .rcpt-toggles {
      display: flex;
      gap: 6px;
      padding: 4px 0 0;
    }
    .rcpt-toggle {
      font-size: 11.5px;
      color: var(--text-faint);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .rcpt-toggle:hover { color: var(--accent); background: var(--accent-soft); }
    .state-row-label {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* states */
    .state {
      padding: 56px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .state .icon {
      width: 44px; height: 44px;
      margin: 0 auto 10px;
      opacity: .7;
    }
    .spinner {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--text);
      animation: spin .8s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* settings list rows */
    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      min-height: 56px;
      cursor: pointer;
      transition: background-color .15s;
      width: 100%;
      text-align: left;
    }
    .list-row + .list-row { border-top: 1px solid var(--border); }
    .list-row:hover { background: var(--surface-2); }
    .list-row .left { color: var(--text-muted); display: flex; align-items: center; }
    .list-row .body { flex: 1; min-width: 0; }
    .list-row .body .l1 { font-size: 14.5px; font-weight: 500; }
    .list-row .body .l2 { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .right { color: var(--text-faint); }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 24px);
      transform: translate(-50%, 30px);
      background: var(--accent);
      color: var(--accent-text);
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-2);
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 50;
      max-width: 92vw;
      width: max-content;
      pointer-events: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error {
      background: var(--danger);
      color: white;
      max-width: 92vw;
      width: 92vw;
      padding: 14px 18px 14px 18px;
      pointer-events: auto;
      border-radius: 14px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Menlo", monospace;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .toast.error::after {
      content: "Tap to dismiss";
      display: block;
      margin-top: 8px;
      font-size: 11px;
      opacity: .7;
      font-family: var(--font);
      font-style: italic;
    }
    .toast.success { background: var(--success); color: white; }

    /* hidden helper */
    [hidden] { display: none !important; }

    /* logo */
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -.02em;
      margin-bottom: 14px;
    }

    /* media: scale up on bigger screens */
    @media (min-width: 600px) {
      .main { padding: 20px; }
    }

    /* ============ Pylon-style refinements ============ */
    .header { background: color-mix(in srgb, var(--bg) 78%, transparent); }

    /* Avatar circles (initial + deterministic color) */
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -.01em;
      color: white;
      flex-shrink: 0;
      background: var(--accent);
      user-select: none;
    }
    .avatar-sm { width: 28px; height: 28px; font-size: 11px; }
    .avatar-xs { width: 22px; height: 22px; font-size: 10px; }
    .avatar-system { background: var(--text-muted); }

    /* Vibrant state badges */
    .badge-open    { color: var(--success); background: var(--success-soft); border: none; }
    .badge-closed  { color: var(--text-muted); background: var(--surface-2); border: none; }
    .badge-pending { color: var(--warning); background: var(--warning-soft); border: none; }
    .badge-snoozed { color: var(--info); background: var(--info-soft); border: none; }
    .badge-on-hold { color: var(--accent); background: var(--accent-soft); border: none; }
    .badge-new     { color: var(--accent); background: var(--accent-soft); border: none; }

    /* ===== Issue card (Pylon-web inspired) ===== */
    .issue-card {
      display: block;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      cursor: pointer;
      transition: border-color .15s, transform .04s;
    }
    .issue-card + .issue-card { margin-top: 10px; }
    .issue-card:hover { border-color: var(--accent); }
    .issue-card:active { transform: scale(.995); }

    .card-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .account-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
      flex-shrink: 0;
    }
    .account-logo-empty {
      background: var(--surface-2);
      color: var(--text-faint);
      font-weight: 500;
    }
    .card-account-empty {
      color: var(--text-faint);
      font-weight: 600;
      font-style: italic;
    }
    .card-top-text { min-width: 0; }
    .card-top-line1 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .card-account {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .card-issue-num {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .card-top-line2 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      min-width: 0;
    }
    .card-requester {
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .card-state { flex-shrink: 0; align-self: start; }

    .card-subject {
      margin-top: 10px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-subject-label {
      color: var(--text-muted);
      font-weight: 500;
      margin-right: 4px;
    }

    .card-body-preview {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 1.45em;
    }
    .card-preview-placeholder {
      color: var(--text-faint);
      font-style: italic;
    }

    .card-footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .card-assignee {
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .card-assignee em {
      font-style: italic;
      font-weight: 500;
      color: var(--text-faint);
    }
    .card-dot { color: var(--text-faint); }
    .card-time { color: var(--text-faint); }

    /* Active filter chip — accent background */
    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .chip { transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s; }

    /* Header gets a subtle bottom border only when scrolled */
    .header { border-bottom-color: var(--border); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 6px calc(var(--safe-bottom) + 8px);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-top: 1px solid var(--border);
    }
    .bottom-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s, transform .04s;
    }
    .bottom-nav-btn:active { transform: scale(.96); }
    .bottom-nav-btn[aria-current="true"] { color: var(--accent); }
    .bottom-nav-btn svg { width: 22px; height: 22px; }

    /* Rich text editor */
    .editor-toolbar {
      display: flex;
      gap: 2px;
      padding: 6px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tbtn {
      min-width: 32px; height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .12s, color .12s;
      flex-shrink: 0;
    }
    .tbtn:hover { background: var(--surface-2); color: var(--text); }
    .tbtn:active { background: var(--border); }
    .tbtn svg { width: 16px; height: 16px; }
    .tbtn-divider {
      width: 1px;
      height: 22px;
      align-self: center;
      background: var(--border);
      margin: 0 3px;
    }
    .editor {
      min-height: 80px;
      max-height: 240px;
      overflow-y: auto;
      padding: 12px;
      font-size: 15px;
      line-height: 1.55;
      outline: none;
      color: var(--text);
    }
    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--text-faint);
      pointer-events: none;
    }
    .editor p { margin: 0 0 .5em; }
    .editor p:last-child { margin-bottom: 0; }
    .editor ul, .editor ol { margin: .3em 0 .5em 1.2em; padding: 0; }
    .editor a { color: var(--accent); text-decoration: underline; }

    /* Refined composer */
    .composer { margin-top: 20px; }
    .composer-card {
      box-shadow: var(--shadow-2);
      border-radius: var(--radius);
      overflow: hidden;
      padding: 0;
      border-color: var(--border);
    }
    .composer-actions {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }
    .composer-send {
      background: var(--accent);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .composer-send:hover { background: var(--accent-strong); }

    /* Collapsed pill — sits at the bottom of the detail view when composer is closed */
    .composer-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-2);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      transition: background-color .15s, border-color .15s, transform .04s;
      text-align: left;
      min-height: 48px;
    }
    .composer-pill:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }
    .composer-pill:active { transform: scale(.99); }
    .composer-pill-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .composer-pill-icon svg { width: 18px; height: 18px; }
    .composer-pill-text { flex: 1; }
    .composer-pill-draft {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--warning-soft);
      color: var(--warning);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Composer header — the title row with the minimize chevron */
    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .composer-header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .composer-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color .12s, color .12s;
    }
    .composer-close:hover { background: var(--surface-2); color: var(--text); }
    .composer-close svg { width: 18px; height: 18px; }

    /* Detail page tweaks */
    .detail-title { font-size: 24px; }
    .msg {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }
    .msg-content { min-width: 0; }
    .msg-internal {
      background: var(--warning-soft);
      border-color: color-mix(in srgb, var(--warning) 30%, var(--border));
    }

    /* FAB for new actions (reserved space) */
    .fab {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 16px);
      right: 20px;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
      z-index: 15;
      cursor: pointer;
      transition: transform .08s;
    }
    .fab:active { transform: scale(.94); }

    /* Logo update */
    .logo {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    /* Chip count pill */
    .chip-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 6px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .chip[aria-pressed="true"] .chip-count {
      background: rgba(255,255,255,.22);
      color: white;
    }
    .chip-with-avatar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-left: 6px;
    }
    .chip-with-avatar .avatar {
      box-shadow: 0 0 0 2px var(--surface);
    }
    .chip[aria-pressed="true"] .avatar {
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* Issue assignee block (top-right of card) */
    .issue-top-right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .assignee {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 110px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
    }
    .assignee-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80px;
    }
    .assignee-empty {
      color: var(--text-faint);
      font-style: italic;
      font-size: 11px;
    }
    .issue-time {
      color: var(--text-faint);
      font-size: 11px;
      white-space: nowrap;
    }
    /* On very narrow screens hide the assignee name, keep the avatar */
    @media (max-width: 380px) {
      .assignee-name { display: none; }
      .assignee-empty { display: none; }
    }

    /* ============ Tags ============ */
    .tags-section { margin-top: 6px; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px 4px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      max-width: 100%;
      line-height: 1.3;
    }
    .tag-pill .tag-remove {
      width: 18px; height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      color: inherit;
      opacity: .6;
      margin-left: 2px;
      cursor: pointer;
    }
    .tag-pill .tag-remove:hover { opacity: 1; background: rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      .tag-pill .tag-remove:hover { background: rgba(255,255,255,.12); }
    }
    .tag-add {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px dashed var(--border-strong);
      cursor: pointer;
      min-height: 28px;
      transition: background-color .15s, color .15s, border-color .15s;
    }
    .tag-add:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    .tag-picker {
      margin-top: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .tag-picker input[type="search"] {
      border: none;
      border-radius: 0;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      background: transparent;
      font-size: 14px;
    }
    .tag-picker input[type="search"]:focus { box-shadow: none; border-color: var(--border); }
    .tag-options {
      max-height: 240px;
      overflow-y: auto;
      padding: 4px;
    }
    .tag-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .12s;
    }
    .tag-option:hover { background: var(--surface-2); }
    .tag-option:active { background: var(--surface-3); }
    .tag-swatch {
      width: 14px; height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Tags on issue list cards (small, dense) */
    .issue-item .tag-pill { font-size: 11px; padding: 1px 8px; }

    /* Account name badge on issue cards */
    .account-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.4;
    }
    .account-badge svg { width: 11px; height: 11px; flex-shrink: 0; opacity: .8; }
    .issue-requester {
      color: var(--text-muted);
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .account-badge { color: var(--text); background: color-mix(in srgb, var(--accent) 20%, transparent); }
    }

    /* ============ Sign-in: how-to panel + advanced collapse ============ */
    .help-panel {
      margin-top: 10px;
      padding: 12px 14px 14px;
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
      border-radius: 12px;
      color: var(--text);
      font-size: 13px;
    }
    .help-panel code {
      background: rgba(0,0,0,.06);
      padding: 0 4px;
      border-radius: 4px;
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      .help-panel code { background: rgba(255,255,255,.08); }
    }
    .help-panel a { color: var(--accent); font-weight: 600; }
    .btn-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-link:hover { color: var(--accent); }
    .advanced-section { padding-top: 4px; border-top: 1px dashed var(--border); }

    /* ============ PWA banners ============ */
    .pwa-install-bar, .pwa-update-bar {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 12px);
      transform: translateX(-50%);
      max-width: 92vw;
      width: max-content;
      z-index: 100;
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow-2);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pwa-install-bar button, .pwa-update-bar button {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .pwa-install-bar button:not([aria-label]),
    .pwa-update-bar button:not([aria-label]) {
      background: var(--accent);
      color: white;
    }
    .pwa-install-bar button[aria-label],
    .pwa-update-bar button[aria-label] {
      background: transparent;
      color: var(--text-faint);
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
    }
    .pwa-update-bar { background: var(--accent); color: white; border-color: transparent; }
    .pwa-update-bar button[aria-label] { color: rgba(255,255,255,.7); }
    .pwa-update-bar button:not([aria-label]) { background: white; color: var(--accent); }
    html.is-standalone .pwa-install-bar { display: none; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ HEADER (dynamic) ============ -->
    <header class="header" id="header">
      <button class="icon-btn" id="hdrLeft" hidden aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="header-title" id="hdrTitle">Pylon</div>
      <button class="icon-btn" id="hdrRight" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main class="main" id="main">
      <!-- views injected here -->
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" hidden>
    <button class="bottom-nav-btn" data-nav="list" aria-current="true" aria-label="Inbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span>Inbox</span>
    </button>
    <button class="bottom-nav-btn" data-nav="search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="bottom-nav-btn" data-nav="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
      <span>Me</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    // ============ Config / Storage ============
    const STORAGE_KEY = 'pylonMobile.config.v1';
    const DEFAULT_BASE = 'https://api.usepylon.com';

    const cfg = loadConfig();

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const defaults = { apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '' };
        if (!raw) return defaults;
        return Object.assign(defaults, JSON.parse(raw));
      } catch {
        return { apiKey: '', base: DEFAULT_BASE, proxy: '', signature: '' };
      }
    }
    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    }
    function clearConfig() {
      localStorage.removeItem(STORAGE_KEY);
      cfg.apiKey = '';
      cfg.base = DEFAULT_BASE;
      cfg.proxy = '';
    }

    // ============ API ============
    function apiUrl(path, query) {
      const base = (cfg.proxy && cfg.proxy.trim()) ? cfg.proxy.replace(/\/$/, '') : cfg.base.replace(/\/$/, '');
      let url = base + path;
      if (query) {
        const qs = new URLSearchParams();
        for (const [k, v] of Object.entries(query)) {
          if (v === undefined || v === null || v === '') continue;
          qs.set(k, v);
        }
        const s = qs.toString();
        if (s) url += '?' + s;
      }
      return url;
    }
    async function api(method, path, { query, body } = {}) {
      if (!cfg.apiKey) throw new Error('Missing API key');
      const url = apiUrl(path, query);
      const started = Date.now();
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': 'Bearer ' + cfg.apiKey,
          'Accept': 'application/json',
          ...(body ? { 'Content-Type': 'application/json' } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { _raw: text }; }
      logCall({
        method, path, status: res.status, ok: res.ok,
        ms: Date.now() - started,
        excerpt: text ? text.slice(0, 600) : '',
      });
      if (!res.ok) {
        // Surface Pylon's actual error message verbatim
        const inner = data && (data.error || data.message || (data.errors && JSON.stringify(data.errors))) || text || '';
        const err = new Error(`HTTP ${res.status}${inner ? ` — ${String(inner).slice(0, 240)}` : ''}`);
        err.status = res.status;
        err.body = data;
        err.endpoint = `${method} ${path}`;
        throw err;
      }
      return data;
    }

    // Pylon endpoint helpers — see https://docs.usepylon.com/pylon-docs/developer/api/api-reference
    const Pylon = {
      me: () => api('GET', '/me'),
      listIssues: (q) => api('GET', '/issues', { query: q }),
      getIssue: (id) => api('GET', `/issues/${encodeURIComponent(id)}`),
      listMessages: (id) => api('GET', `/issues/${encodeURIComponent(id)}/messages`),
      listMessagesAlt: (id) => api('GET', '/messages', { query: { issue_id: id } }),
      reply: (id, payload) => api('POST', `/issues/${encodeURIComponent(id)}/messages`, { body: payload }),
      replyAlt: (id, payload) => api('POST', '/messages', { body: Object.assign({ issue_id: id }, payload) }),
      updateIssue: (id, body) => api('PATCH', `/issues/${encodeURIComponent(id)}`, { body }),
      listUsers: () => api('GET', '/users'),
      listContacts: () => api('GET', '/contacts'),
      getContact: (id) => api('GET', `/contacts/${encodeURIComponent(id)}`),
      listTags: () => api('GET', '/tags'),
      listAccounts: (q) => api('GET', '/accounts', { query: q }),
      getAccount: (id) => api('GET', `/accounts/${encodeURIComponent(id)}`),
      // Reply / note / thread endpoints (Pylon docs)
      replyPublic: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/reply`, { body }),
      postNote: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/note`, { body }),
      createThread: (id, body) => api('POST', `/issues/${encodeURIComponent(id)}/threads`, { body }),
      listThreads: (id) => api('GET', `/issues/${encodeURIComponent(id)}/threads`),
    };

    // Tag cache
    const tagCache = { tags: [], loaded: false, loading: null };
    async function ensureTagsLoaded() {
      if (tagCache.loaded) return tagCache.tags;
      if (tagCache.loading) return tagCache.loading;
      tagCache.loading = (async () => {
        try {
          const r = await Pylon.listTags();
          const list = extractList(r);
          // Normalize — accept array of strings or array of {name,id,color}
          tagCache.tags = list.map(t => typeof t === 'string' ? { name: t } : t).filter(t => t && (t.name || t.value || t.label));
        } catch {
          tagCache.tags = [];
        } finally {
          tagCache.loaded = true;
          tagCache.loading = null;
        }
        return tagCache.tags;
      })();
      return tagCache.loading;
    }
    function tagNameOf(t) { return (t && (t.name || t.value || t.label)) || ''; }

    // Tiny in-memory cache so author UUIDs resolve to names without re-fetching.
    const peopleCache = { users: {}, contacts: {}, loaded: false };
    const accountCache = { byId: {}, loaded: false, loading: null };

    async function ensurePeopleLoaded() {
      if (peopleCache.loaded) return;
      peopleCache.loaded = true; // attempt only once per session
      try {
        const u = await Pylon.listUsers().catch(() => null);
        const us = extractList(u) || [];
        for (const x of us) {
          if (x && x.id) peopleCache.users[x.id] = x;
        }
      } catch {}
      try {
        const c = await Pylon.listContacts().catch(() => null);
        const cs = extractList(c) || [];
        for (const x of cs) {
          if (x && x.id) peopleCache.contacts[x.id] = x;
        }
      } catch {}
    }

    async function ensureAccountsLoaded() {
      if (accountCache.loaded) return accountCache.byId;
      if (accountCache.loading) return accountCache.loading;
      accountCache.loading = (async () => {
        try {
          // Paginate through Pylon's /accounts using cursor — Pylon caps a single
          // page at 100; we keep walking until has_next_page is false or we hit a
          // sanity cap to avoid runaway loops on huge workspaces.
          let cursor = null;
          let pages = 0;
          while (pages < 20) { // up to 20 * 100 = 2000 accounts
            const resp = await Pylon.listAccounts({ limit: 100, cursor }).catch(() => null);
            if (!resp) break;
            const list = extractList(resp) || [];
            for (const a of list) {
              if (a && a.id) accountCache.byId[a.id] = a;
            }
            // Detect next-cursor in common shapes
            const next = resp.cursor || (resp.data && resp.data.cursor) || null;
            const hasNext = (typeof resp.has_next_page === 'boolean' ? resp.has_next_page
                            : (typeof (resp.data && resp.data.has_next_page) === 'boolean' ? resp.data.has_next_page
                            : !!next));
            if (!hasNext || !next || list.length === 0) break;
            cursor = next;
            pages++;
          }
        } catch {} finally {
          accountCache.loaded = true;
          accountCache.loading = null;
        }
        return accountCache.byId;
      })();
      return accountCache.loading;
    }

    // Lazy single-account fetch for accounts that didn't appear in the bulk list
    const accountFetchInFlight = {}; // id -> Promise
    function fetchAccountIfMissing(id, onReady) {
      if (!id) return;
      if (accountCache.byId[id]) return; // already have it
      if (accountFetchInFlight[id]) {
        accountFetchInFlight[id].then(onReady);
        return;
      }
      accountFetchInFlight[id] = Pylon.getAccount(id).then(r => {
        const account = (r && (r.data || r.account || r)) || null;
        if (account && account.id) {
          accountCache.byId[account.id] = account;
        } else if (account && !account.id) {
          // Pylon may return account without echoing the id; store under the requested id
          accountCache.byId[id] = Object.assign({ id }, account);
        }
        return accountCache.byId[id];
      }).catch(() => null).finally(() => {
        delete accountFetchInFlight[id];
      });
      accountFetchInFlight[id].then(onReady);
    }

    function resolvePerson(id, type) {
      if (!id) return null;
      if (type === 'user' && peopleCache.users[id]) return peopleCache.users[id];
      if (type === 'contact' && peopleCache.contacts[id]) return peopleCache.contacts[id];
      return peopleCache.users[id] || peopleCache.contacts[id] || null;
    }

    function resolveAccountName(issue) {
      if (!issue) return '';
      if (issue.account && (issue.account.name || issue.account.title || issue.account.display_name)) {
        return issue.account.name || issue.account.title || issue.account.display_name;
      }
      if (issue.account_name) return issue.account_name;
      const aid = issue.account_id || (issue.account && issue.account.id);
      if (aid && accountCache.byId[aid]) {
        const a = accountCache.byId[aid];
        return a.name || a.title || a.display_name || a.company_name || '';
      }
      return '';
    }

    // Simple network log so the user can debug from Settings.
    const netLog = [];
    function logCall(entry) {
      netLog.unshift({ ...entry, at: Date.now() });
      if (netLog.length > 50) netLog.length = 50;
    }

    // Avatar helpers (initial + deterministic background color)
    const AVATAR_PALETTE = ['#6e56cf','#e5484d','#30a46c','#4f86ec','#f5a524','#d6409f','#0091ff','#e54666','#11b3a4','#7c66dc','#dc7e22','#0d99a3'];
    function avatarColor(seed) {
      const s = String(seed || '');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
    }
    function initialsOf(name) {
      if (!name) return '?';
      const parts = String(name).trim().split(/\s+/).slice(0, 2);
      return parts.map(p => p[0] || '').join('').toUpperCase() || '?';
    }
    function renderAvatar(name, opts = {}) {
      const seed = opts.seed || name || '?';
      const size = opts.size || ''; // '', 'sm', 'xs'
      const sysClass = opts.system ? ' avatar-system' : '';
      const color = opts.system ? '' : avatarColor(seed);
      return `<div class="avatar${size ? ' avatar-' + size : ''}${sysClass}" ${color ? `style="background:${color};"` : ''}>${escapeHtml(initialsOf(name))}</div>`;
    }

    // ============ State / Router ============
    const state = {
      view: 'list',
      allIssues: [],   // raw from server, used for counts + assignee list
      issues: [],      // post-filter, displayed
      filter: { state: '', assignee: 'all', q: '' },
      stateCounts: {}, // { new: 2, waiting_on_you: 18, ... }
      assigneeStats: [], // [{id, name, count}, ...] top assignees
      issue: null,
      messages: [],
      loading: false,
      error: null,
      me: null,
      cursor: null,
    };

    const main = document.getElementById('main');
    const hdrTitle = document.getElementById('hdrTitle');
    const hdrLeft = document.getElementById('hdrLeft');
    const hdrRight = document.getElementById('hdrRight');
    const bottomNav = document.getElementById('bottomNav');

    function navigate(view, opts = {}) {
      state.view = view;
      state.error = null;
      if (opts.issue !== undefined) state.issue = opts.issue;
      render();
      if (view === 'list' && !state.issues.length) loadIssues();
      if (view === 'detail' && state.issue) loadIssueDetail(state.issue.id || state.issue);
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function render() {
      // Bottom nav visibility
      const showNav = !!cfg.apiKey && (state.view === 'list' || state.view === 'settings');
      bottomNav.hidden = !showNav;
      document.querySelector('.app').classList.toggle('has-nav', showNav);
      // Update aria-current on tabs
      if (showNav) {
        const map = { list: 'list', search: 'list', settings: 'settings' };
        const current = map[state.view] || state.view;
        bottomNav.querySelectorAll('.bottom-nav-btn').forEach(b => {
          b.setAttribute('aria-current', b.dataset.nav === current ? 'true' : 'false');
        });
      }

      // Header
      if (!cfg.apiKey) {
        hdrTitle.textContent = 'Pylon Mobile';
        hdrLeft.hidden = true;
        hdrRight.hidden = true;
      } else if (state.view === 'list') {
        hdrTitle.textContent = 'Inbox';
        hdrLeft.hidden = true;
        hdrRight.hidden = true;
      } else if (state.view === 'detail') {
        hdrTitle.textContent = state.issue ? `#${state.issue.number || state.issue.id || ''}` : 'Issue';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'settings') {
        hdrTitle.textContent = 'Settings';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'netlog') {
        hdrTitle.textContent = 'Network log';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      } else if (state.view === 'signature') {
        hdrTitle.textContent = 'Email signature';
        hdrLeft.hidden = false;
        hdrRight.hidden = true;
      }

      // Body
      if (!cfg.apiKey) return renderSetup();
      if (state.view === 'list') return renderList();
      if (state.view === 'detail') return renderDetail();
      if (state.view === 'settings') return renderSettings();
      if (state.view === 'netlog') return renderNetLog();
      if (state.view === 'signature') return renderSignature();
    }

    // ============ Views ============

    function renderSetup() {
      main.innerHTML = `
        <div class="stack-20" style="padding-top: 24px;">
          <div class="center">
            <div class="logo">P</div>
            <h1 style="margin:0 0 6px; font-size:24px; letter-spacing:-.02em;">Pylon Mobile</h1>
            <p class="muted small" style="max-width: 380px; margin: 0 auto;">
              A clean, mobile-first interface for your Pylon support inbox. Sign in with <strong>your own</strong> Pylon API key — replies will be attributed to you.
            </p>
          </div>
          <div class="card stack-16">
            <div>
              <label class="label" for="setupKey">Your Pylon API key</label>
              <input id="setupKey" type="password" autocomplete="off" spellcheck="false" placeholder="pylon_api_..." />
              <div class="help">
                Don't have one yet? <a href="#" id="howGetKey">How to get my key →</a>
              </div>
              <div id="howGetKeyPanel" class="help-panel" hidden>
                <ol style="margin: 6px 0 0 18px; padding: 0; line-height: 1.7;">
                  <li>Open <a href="https://app.usepylon.com" target="_blank" rel="noopener">app.usepylon.com</a> and sign in with Google as usual.</li>
                  <li>Click your avatar → <strong>Settings</strong> (or go to <em>Settings</em> in the sidebar).</li>
                  <li>Find <strong>API Keys</strong> (under Developers / Integrations).</li>
                  <li>Click <strong>Create API Key</strong>. Name it something like <em>"My phone"</em>.</li>
                  <li>Copy the key (starts with <code>pylon_api_</code>) and paste it above.</li>
                </ol>
                <p class="tiny muted" style="margin: 10px 0 0;">Your key represents <strong>you</strong> — anything you do in this app is attributed to your Pylon account.</p>
              </div>
            </div>
            <div class="advanced-section">
              <button type="button" class="btn-link" id="toggleAdvanced">Advanced settings ▾</button>
              <div id="advancedPanel" hidden style="margin-top: 12px;" class="stack-16">
                <div>
                  <label class="label" for="setupBase">API base URL</label>
                  <input id="setupBase" type="url" autocomplete="off" spellcheck="false" value="${escapeAttr(cfg.base)}" />
                  <div class="help">Default: <code>https://api.usepylon.com</code></div>
                </div>
                <div>
                  <label class="label" for="setupProxy">CORS proxy URL</label>
                  <input id="setupProxy" type="url" autocomplete="off" spellcheck="false" value="${escapeAttr(cfg.proxy || '')}" placeholder="https://your-proxy.workers.dev" />
                  <div class="help">
                    Required for most browsers. Ask your admin for the shared CORS proxy URL, or see the README to deploy one.
                  </div>
                </div>
              </div>
            </div>
            <button class="btn btn-primary" id="setupSave">Sign in</button>
          </div>
          <p class="tiny faint center" style="max-width: 360px; margin: 0 auto;">Your key is stored only on this device. It never leaves your browser except in requests to Pylon.</p>
        </div>
      `;
      document.getElementById('howGetKey').onclick = (e) => {
        e.preventDefault();
        const p = document.getElementById('howGetKeyPanel');
        p.hidden = !p.hidden;
      };
      document.getElementById('toggleAdvanced').onclick = (e) => {
        e.preventDefault();
        const p = document.getElementById('advancedPanel');
        p.hidden = !p.hidden;
        e.currentTarget.textContent = p.hidden ? 'Advanced settings ▾' : 'Advanced settings ▴';
        // If the proxy URL is blank, prefill from a per-team default the user might pre-populate later
      };
      // If the proxy is already set (admin pre-configured), keep advanced collapsed.
      // If not, auto-open it so the user sees the CORS field.
      if (!cfg.proxy) {
        document.getElementById('advancedPanel').hidden = false;
        document.getElementById('toggleAdvanced').textContent = 'Advanced settings ▴';
      }
      const $key = document.getElementById('setupKey');
      const $save = document.getElementById('setupSave');
      $key.focus();
      const submit = async () => {
        const key = $key.value.trim();
        const $baseEl = document.getElementById('setupBase');
        const $proxyEl = document.getElementById('setupProxy');
        const base = ($baseEl && $baseEl.value.trim()) || DEFAULT_BASE;
        const proxy = ($proxyEl && $proxyEl.value.trim()) || '';
        if (!key) { toast('Enter your Pylon API key', 'error'); return; }
        $save.disabled = true;
        $save.innerHTML = '<span class="spinner"></span> Verifying…';
        cfg.apiKey = key; cfg.base = base; cfg.proxy = proxy;
        try {
          const me = await Pylon.me();
          state.me = me && (me.data || me);
          saveConfig();
          const name = (state.me && (state.me.name || state.me.email)) || '';
          toast(name ? `Welcome, ${name.split(/\s+/)[0]} 👋` : 'Signed in', 'success');
          navigate('list');
        } catch (e) {
          cfg.apiKey = ''; // don't persist a bad key
          $save.disabled = false;
          $save.textContent = 'Sign in';
          toast(friendlyError(e), 'error');
        }
      };
      $save.addEventListener('click', submit);
      $key.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }

    function renderList() {
      main.innerHTML = `
        <div class="search">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input id="searchInput" type="search" placeholder="Search issues, subjects, requesters…" value="${escapeAttr(state.filter.q)}" />
        </div>
        <div class="filter-bar" id="filterBar">${renderStateChips()}</div>
        <div class="filter-bar" id="assigneeBar" style="margin-top: -4px;">${renderAssigneeChips()}</div>
        <div id="listContainer">
          ${renderListBody()}
        </div>
      `;
      // wire
      const $search = document.getElementById('searchInput');
      let t = null;
      $search.addEventListener('input', (e) => {
        state.filter.q = e.target.value;
        clearTimeout(t);
        t = setTimeout(() => reapplyFilters(), 200);
      });
      $search.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); reapplyFilters(); }
      });

      const $filterBar = document.getElementById('filterBar');
      $filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        state.filter.state = btn.dataset.state || '';
        reapplyFilters();
      });

      const $assigneeBar = document.getElementById('assigneeBar');
      $assigneeBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        state.filter.assignee = btn.dataset.assignee || 'all';

      });

      const list = document.getElementById('listContainer');
      list.addEventListener('click', (e) => {
        const item = e.target.closest('.issue-card');
        if (!item) return;
        const id = item.dataset.id;
        const issue = state.issues.find(i => String(i.id) === id || String(i.number) === id);
        navigate('detail', { issue: issue || { id } });
      });
      attachBodyObservers();
    }

    function renderStateChips() {
      const counts = state.stateCounts || {};
      const total = counts._total || 0;
      const items = [
        ['', 'All', total],
        ['new', 'New', counts.new || 0],
        ['waiting_on_you', 'On you', counts.waiting_on_you || 0],
        ['waiting_on_customer', 'On customer', counts.waiting_on_customer || 0],
        ['on_hold', 'On hold', counts.on_hold || 0],
        ['closed', 'Closed', counts.closed || 0],

      return items.map(([k, label, c]) => `
        <button class="chip" data-state="${k}" aria-pressed="${state.filter.state === k}">
          ${escapeHtml(label)}<span class="chip-count">${c}</span>
        </button>
      `).join('');
    }

    function renderAssigneeChips() {
      const me = state.me || {};
      const meChip = `
        <button class="chip chip-with-avatar" data-assignee="me" aria-pressed="${state.filter.assignee === 'me'}" title="Assigned to me">
          ${renderAvatar(me.name || me.email || 'Me', { seed: me.id || me.email, size: 'xs' })}
          <span>Me</span>
        </button>`;
      const anyoneChip = `
        <button class="chip" data-assignee="all" aria-pressed="${state.filter.assignee === 'all'}">Anyone</button>`;
      const unassigned = `
        <button class="chip" data-assignee="unassigned" aria-pressed="${state.filter.assignee === 'unassigned'}">Unassigned</button>`;

      const others = (state.assigneeStats || [])
        .filter(a => !me.id || a.id !== me.id)
        .map(a => {
          const name = a.name || resolveAssigneeName(a.id) || a.id.slice(0, 6);
          const first = (name || '').split(/\s+/)[0] || name;
          return `
            <button class="chip chip-with-avatar" data-assignee="${escapeAttr(a.id)}" aria-pressed="${state.filter.assignee === a.id}" title="${escapeAttr(name)}">
              ${renderAvatar(name, { seed: a.id, size: 'xs' })}
              <span>${escapeHtml(first)}</span>
              <span class="chip-count">${a.count}</span>
            </button>`;
        }).join('');
      return anyoneChip + meChip + unassigned + others;
    }

    function resolveAssigneeName(id) {
      const p = resolvePerson(id, 'user');
      return p ? (p.name || p.email) : '';
    }

    function renderListBody() {
      if (state.loading && !state.issues.length) {
        return `<div class="state-row"><span class="spinner"></span> Loading issues…</div>`;
      }
      if (state.error) {
        return `<div class="card" style="border-color: var(--danger-soft); background: var(--danger-soft); color: var(--danger);">
          <div style="font-weight: 600; margin-bottom: 6px;">Couldn't load issues</div>
          <div class="small">${escapeHtml(state.error)}</div>
          <div style="margin-top: 12px;"><button class="btn" id="retryBtn">Retry</button></div>
        </div>`;
      }
      if (!state.issues.length) {
        return `<div class="state">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <div style="font-weight: 600; color: var(--text);">No issues found</div>
          <div class="small">Try a different filter or search.</div>
        </div>`;
      }
      return `<ul class="issue-list">${state.issues.map(renderIssueItem).join('')}</ul>` +
        (state.loading ? `<div class="state-row"><span class="spinner"></span> Loading…</div>` : '');
    }

    function renderIssueItem(issue) {
      const id = issue.id || String(issue.number || '');
      const num = issue.number != null ? `#${issue.number}` : (issue.id || '').slice(0, 8);
      const title = issue.title || issue.subject || '(no subject)';
      const requester = (issue.requester && (issue.requester.name || issue.requester.email))
        || (issue.contact && (issue.contact.name || issue.contact.email))
        || issue.requester_name || '';
      const requesterId = (issue.requester && issue.requester.id) || requester || id;
      const account = resolveAccountName(issue);
      const rawAccountId = issue.account_id || (issue.account && issue.account.id) || '';
      const accountId = rawAccountId || account;
      const stateStr = (issue.state || issue.status || '').toString();
      const created = issue.created_at;
      const assigneeName = assigneeNameOf(issue);

      // If the account name is missing but we have an ID, fire a lazy single fetch.
      // When it arrives, find this card in the DOM and update the account name.
      if (!account && rawAccountId) {
        fetchAccountIfMissing(rawAccountId, () => {
          const cards = document.querySelectorAll(`.issue-card[data-id="${CSS.escape(id)}"] .card-account`);
          const cached = accountCache.byId[rawAccountId];
          const name = cached && (cached.name || cached.title || cached.display_name);
          if (name) cards.forEach(el => { el.textContent = name; });
        });
      }

      // Decide what to show. If the issue genuinely has no account_id, it's a
      // system / automated ticket — say "No account" in muted style.
      // If we have an account_id but no name yet, show a subtle "Loading…" while
      // the lazy fetch resolves it.
      const displayedAccount = account
        ? account
        : (rawAccountId ? 'Loading…' : 'No account');
      const accountInitial = account ? account.trim().charAt(0).toUpperCase()
                                     : (rawAccountId ? '?' : '·');
      const accountLogo = `
        <div class="account-logo${account ? '' : ' account-logo-empty'}" ${account ? `style="background:${avatarColor(accountId)};"` : ''} title="${escapeAttr(displayedAccount)}">
          ${escapeHtml(accountInitial)}
        </div>`;

      // Cached body preview (filled in lazily when the card scrolls into view)
      const cachedPreview = issueBodyPreviewCache[id] || '';

      return `
        <li class="issue-card" data-id="${escapeAttr(id)}">
          <div class="card-top">
            ${accountLogo}
            <div class="card-top-text">
              <div class="card-top-line1">
                <span class="card-account ${account ? '' : 'card-account-empty'}">${escapeHtml(displayedAccount)}</span>
                <span class="card-issue-num">${escapeHtml(num)}</span>
              </div>
              <div class="card-top-line2">
                ${requester ? renderAvatar(requester, { seed: requesterId, size: 'xs' }) : ''}
                <span class="card-requester">${escapeHtml(requester || '—')}</span>
              </div>
            </div>
            <div class="card-state">${stateStr ? renderStateBadge(stateStr) : ''}</div>
          </div>

          <div class="card-subject"><span class="card-subject-label">Subject:</span> ${escapeHtml(title)}</div>

          <div class="card-body-preview" data-preview-for="${escapeAttr(id)}">
            ${cachedPreview ? escapeHtml(cachedPreview) : '<span class="card-preview-placeholder">…</span>'}
          </div>

          <div class="card-footer">
            <span class="card-assignee">${assigneeName ? escapeHtml(assigneeName) : '<em>Unassigned</em>'}</span>
            <span class="card-dot">·</span>
            <span class="card-time">${created ? `Created ${escapeHtml(timeAgo(created))} ago` : ''}</span>
          </div>
        </li>
      `;
    }

    // Lazy-load a short body preview for each visible card from GET /issues/{id}.
    // Populated on first display; cached for the session.
    const issueBodyPreviewCache = {};
    let bodyObserver = null;

    function htmlToPreview(html, max = 160) {
      if (!html) return '';
      // Strip tags
      const tmp = document.createElement('div');
      tmp.innerHTML = String(html);
      const text = (tmp.textContent || tmp.innerText || '')
        .replace(/ /g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > max ? text.slice(0, max).trim() + '…' : text;
    }

    function attachBodyObservers() {
      if (bodyObserver) {
        try { bodyObserver.disconnect(); } catch {}
      }
      if (typeof IntersectionObserver === 'undefined') return;
      bodyObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const card = entry.target;
          const cardId = card.dataset.id;
          bodyObserver.unobserve(card);
          if (!cardId || issueBodyPreviewCache[cardId]) {
            updateCardPreview(card, issueBodyPreviewCache[cardId] || '');
            continue;
          }
          // Fetch issue body (single request per card)
          Pylon.getIssue(cardId).then(r => {
            const issue = (r && (r.data || r.issue || r)) || {};
            const preview = htmlToPreview(issue.body_html || issue.body_text || issue.body || '', 160);
            issueBodyPreviewCache[cardId] = preview;
            updateCardPreview(card, preview);
          }).catch(() => {
            // Silent — preview just stays as "..."
          });
        }
      }, { rootMargin: '300px 0px', threshold: 0.01 });
      // Observe each rendered card
      document.querySelectorAll('.issue-card').forEach(c => bodyObserver.observe(c));
    }

    function updateCardPreview(card, preview) {
      const el = card.querySelector('.card-body-preview');
      if (!el) return;
      if (preview) {
        el.textContent = preview;
      } else {
        el.innerHTML = '<span class="card-preview-placeholder">No preview available</span>';
      }
    }

    function renderStateBadge(s) {
      const k = String(s || '').toLowerCase();
      let cls = '';
      if (k === 'new') cls = 'badge-new';
      else if (k === 'on_hold') cls = 'badge-on-hold';
      else if (k.startsWith('waiting_on_you')) cls = 'badge-pending';
      else if (k.startsWith('waiting_on_customer')) cls = 'badge-snoozed';
      else if (k.includes('clos') || k.includes('resol')) cls = 'badge-closed';
      else if (k.includes('open')) cls = 'badge-open';
      else cls = 'badge-snoozed';
      return `<span class="badge ${cls}"><span class="badge-dot"></span>${escapeHtml(prettyState(s))}</span>`;
    }
    function prettyState(s) { return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }

    function renderDetail() {
      if (state.loading && !state.messages.length) {

      // State chips click handler
      const $stateChips = document.getElementById('stateChips');
      if ($stateChips) {
        $stateChips.addEventListener('click', (e) => {
          const btn = e.target.closest('.chip');
          if (!btn) return;
          const ns = btn.dataset.state;
          if (ns && ns !== stateStr) changeIssueState(ns);
        });
      }

      // Tags section
      bindTagsSection();
      // Lazy-load the list of available tags in the background
      ensureTagsLoaded().then(() => { if (state.view === 'detail') patchTagsSection(); });

      const $composerWrap = document.getElementById('composerWrap');
      const $composerCard = document.getElementById('composerCard');

      const $composerCloseBtn = document.getElementById('composerCloseBtn');

      const $composerPillDraft = document.getElementById('composerPillDraft');
